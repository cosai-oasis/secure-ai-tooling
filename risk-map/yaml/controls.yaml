        - MANAGE-2.2@1.0
        - MANAGE-4.1@1.0
  - id: controlAuditRecordRepositoryIndependence
    title: Audit Record Repository Independence
    description:
      - >-
        Ensure the durable record of what an AI system did is held under an authority the recorded
        workload does not control. The obligation attaches to the storage substrate ({{componentAuditRecordRepository}}),
        not the components that write to it: an emitter can produce complete and accurate records
        and still not guarantee they survive an adversary holding administrative authority over
        the workload being recorded. That adversary is frequently the recorded workload itself,
        which is why a component cannot be its own audit authority.
      - >-
        Effective implementation provides three structural properties. **Separated append, read,
        and delete authority:** the authority to append records does not carry authority to read
        the trail back, amend it, or remove entries; audit read access is granted separately;
        and no principal holds append together with deletion or retention-shortening authority.
        **An administrative plane outside the recorded trust domain:** the authority to configure
        retention, grant and revoke access, and authorize deletion sits outside the trust domain
        of the workloads the store records, so compromise of a recorded workload confers none
        over the record of that compromise. **Self-recording of the administrative plane:** actions
        taken against the store — retention changes, access grants and revocations, deletions,
        expiry, and roster changes — are themselves written to the trail. These are properties
        of authority, not of any mechanism expressing it: credentials are the usual expression,
        but a one-way write path into write-once media satisfies the first without one.
      - >-
        Omitting the third leaves the first two asserted rather than evidenced — though not falsifiable
        on its own, since self-recorded administrative actions land in the same trail an administrator
        can rewrite; only the externally held reference point of {{controlAuditTrailIntegrityVerification}}
        closes that. NIST SP 800-53 states these as enhancements to the protection of audit information
        — AU-9(4), AU-9(5) and AU-9(6) for the authority separation, and AU-9(2) and AU-9(7) for
        the administrative plane, which it frames topologically ({{ref:nist-sp-800-53r5}}). This
        control states that in control-plane terms; the topological form remains stronger wherever
        an adversary reaches host or hypervisor privilege, since a co-located store falls to that
        adversary regardless of logical partitioning. The EU AI Act divides them similarly, separating
        recording under Article 12 from the duty to keep records under Articles 19 and 26(6) ({{ref:eu-ai-act-2024}}).
      - >-
        Where a recorded workload's operator also operates its store, that operator arranges the
        separation: holding both roles is the ordinary case for separation of duties, not an exemption.
        This control, with {{controlAuditTrailCompleteness}} and {{controlAuditTrailIntegrityVerification}},
        divides by the question the trail must answer — who could have changed it, whether everything
        reached it, and whether what reached it still stands — not by the properties within an
        answer: here the separated administrative plane subsumes separated authority against the
        adversary this risk names, and self-recording makes either checkable. {{controlResourceAuthorizationEnforcement}}
        carries least-privilege and privilege-separation for service and tool-integration permission
        scope, but is an application-layer control that does not reach this component and names
        neither the append/read/delete triad over the audit record nor where its administrative
        plane sits.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaGovernance
    components:
      - componentAuditRecordRepository
    risks:
      - riskAuditTrailTampering
    mappings:
      nist-ai-rmf:
        - MEASURE-2.7@1.0
