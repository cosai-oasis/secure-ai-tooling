  - id: controlInterComponentTransportSecurity
    title: Inter-Component Transport Security
    description:
      - >
        Enforce authenticated, encrypted, and integrity-protected communication
        channels for all inter-component connections in AI systems, including
        agent-to-tool, model serving, orchestration, and application API
        channels.
    guidance:
      - >
        Implement the following transport-layer controls across all component
        communication paths:
      - - >
          TLS/mTLS enforcement: Require TLS 1.2 minimum (TLS 1.3 preferred)
          for all inter-component connections. Require mutual TLS (mTLS) for
          machine-to-machine paths — agent-to-tool server, orchestrator-to-model
          serving endpoint, and application-to-serving API — so that both
          parties authenticate before any payload is exchanged. Locally-exposed
          tool server endpoints (e.g., MCP servers on localhost) are in scope
          and must not be treated as implicitly trusted.
        - >
          Mutual authentication: Each component must present a valid certificate
          or credential verified against an expected identity before the
          connection is accepted. This applies to machine-to-machine paths,
          not user-facing authentication (covered by application access
          controls).
        - >
          Session token binding: Bind session tokens and API credentials to a
          session-unique transport-layer identifier so that a token captured from
          one TLS session cannot be replayed on a different channel. Use the
          tls-exporter binding of {{ref:rfc9266}} (TLS 1.3, or TLS 1.2 with the
          extended master secret), or the tls-unique binding of {{ref:rfc5929}}
          only on TLS 1.2 or earlier with the extended master secret. The
          tls-server-end-point binding binds the server certificate, not the
          session, and does not provide this anti-replay property.
        - >
          Replay protection: Apply nonce, timestamp, or sequence number
          mechanisms to tool invocation requests and inter-component messages
          carrying side-effecting instructions, preventing captured messages
          from being reinjected.
        - >
          Origin validation: Validate the origin of requests to locally-exposed
          endpoints against an allowlist of expected callers, preventing DNS
          rebinding attacks.
        - >
          Certificate lifecycle management: Issue individual certificates per
          channel endpoint rather than shared wildcards. Automate certificate
          rotation before expiry. Revoke certificates immediately on endpoint
          decommission or key compromise.
      - >
        This control addresses how component messages are protected in transit.
        It is distinct from {{controlOrchestratorAndRouteIntegrity}} (where traffic
        is routed), {{controlSecureByDefaultMLTooling}} (tooling selection and
        configuration), and {{controlIsolatedConfidentialComputing}} (hardware-level
        compute isolation, not the channels between components). Those controls
        assume secure channels; this control establishes them.
      - >
        Identity and credentials sit on the other side of the channel. This control
        binds session tokens to the TLS channel and authenticates the endpoint there;
        siblings own the rest:
      - - >
          {{controlComponentIdentityRegistration}} enrolls the component,
          {{controlComponentIdentityAuthentication}} issues and verifies its authenticator
          at connection time, and {{controlComponentIdentityProvenance}} verifies per
          invocation that the counterparty is still the registered, non-revoked principal.
        - >
          {{controlAuthenticationSchemeHardening}} makes the authentication scheme sound;
          {{controlDelegatedAuthorizationIntegrity}} establishes the grant and its per-hop
          verifiability.
        - >
          {{controlSenderConstrainedCredentials}} owns holder-key binding, including
          mutual-TLS certificate-bound access tokens; {{controlSessionCredentialBindingAndLifecycle}}
          owns the audience, lifetime, rotation and revocation of session credentials,
          including on detected reuse or anomaly; {{controlSecretsAndKeyManagement}} owns
          custody of the secrets and keys behind this control's certificates, and rotation
          and revocation on compromise of the stored material.
        - >
          Issuing, rotating and revoking the certificates that secure the transport channel
          itself stays with this control; per-principal authenticators, including
          per-principal client certificates, belong to
          {{controlComponentIdentityAuthentication}}.
      - >
        {{controlInboundNetworkExposureAndSegmentation}} governs whether a service is
        reachable at all and {{controlNetworkEgressControl}} where a component may send;
        this control applies once a connection is permitted.
        {{controlMessageAndPayloadResourceLimits}} bounds the work a well-formed message
        can impose on its receiver, which a protected channel does not.
      - >
        Protecting a channel does not make the receiver keep what it receives: commitment
        of records is {{controlAuditTrailCompleteness}}. Structuring these controls
        around an explicit trust topology is the posture of
        {{controlAgenticZeroTrustPosture}}, of which this control is one operational
        layer.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    components:
      - componentModelServing
      - componentTools
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
      - componentApplication
      - componentAgentNetworkPolicyEnforcementPoint
    risks:
      - riskMCPTransportHijacking
      - riskOrchestratorRouteHijacking
      - riskInsecureIntegratedComponent
      - riskZombieShadowMCPServers
      - riskCredentialAndTokenTheft
    externalReferences:
      - id: rfc9266
        title: RFC 9266 — Channel Bindings for TLS 1.3
        url: https://datatracker.ietf.org/doc/html/rfc9266
        type: spec
      - id: rfc5929
        title: RFC 5929 — Channel Bindings for TLS
        url: https://datatracker.ietf.org/doc/html/rfc5929
        type: spec
    mappings:
      nist-ai-rmf:
        - MEASURE-2.7@1.0
        - MAP-3.4@1.0
      owasp-top10-llm:
        - LLM03:2025
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
    actorAccess:
      - external
      - agent
      - privileged
      - infrastructure-provider
  - id: controlComponentIdentityProvenance
    title: Component Identity Provenance
    description:
      - >
        Ensure that when one component invokes another, the calling component can verify
        at invocation time that the callee is the currently registered, non-revoked
        principal for that role, ensuring that revocation in the authoritative registry
        is observable to callers within a bounded time window.
    guidance:
      - >
        Implementation requires: a binding between a component's runtime identity and an
        authoritative registry entry, so revocation is observable to callers within a bounded
        time window; verification at invocation time, not solely at channel establishment and
        not by accepting the holder of a key for a domain or network address as the registered
        principal; and audit telemetry recording, per invocation, the provenance assertion
        presented, the verify-pass or verify-fail outcome, and the registry state relied on,
        enabling after-the-fact detection of calls against revoked or expired principals. The
        registry read is the enrollment record where one exists, otherwise the inventory of
        authorized principals.
      - >
        This control is mechanism-agnostic: standing-check mechanisms such as registry-backed
        short-lived assertions,
        revocation lists or status checks consulted at call time, registration receipts
        checked at call time, or other approaches satisfy it. It specifies the question that
        must be answered at invocation time — "is this the registered principal?" — not the
        protocol.
      - >
        TLS and mTLS prove key possession for an endpoint, not that it is the principal the
        registry says it should be. This control closes that gap: a revoked or replaced
        principal still holding a valid authenticator is refused at invocation, reducing
        impersonation by a stale or revoked identity.
      - >
        This control checks current standing, not identity establishment.
        {{controlComponentIdentityRegistration}} enrolls a component as a recognized,
        revocable client of the authorization server and issues no credential or
        authenticator (its client identifier is the record of enrollment);
        {{controlComponentIdentityAuthentication}} issues the principal identifier and the
        bound authenticator and verifies them at connection time; this control verifies at
        each invocation that the counterparty is still the currently registered, non-revoked
        principal for its role. It is distinct from {{controlInterComponentTransportSecurity}},
        which secures the channel, and from {{controlAgentInventoryManagement}}, which
        maintains the registry of authorized principals (the lifecycle authority). It also
        implements, at the invocation boundary, the explicit boundary verification that
        {{controlAgenticZeroTrustPosture}} requires; the posture is that control's, the
        per-invocation registry check this control's. It is also distinct from the controls
        that rely on an established principal: {{controlAuthenticationSchemeHardening}} (which
        schemes are acceptable), {{controlFederatedUserAuthentication}} (human-user identity),
        {{controlDelegatedAuthorizationIntegrity}} and {{controlDelegatedAuthorityConfinement}}
        (delegated authority), {{controlExternalizedAuthorizationDecisioning}} and
        {{controlResourceAuthorizationEnforcement}} (authorization decision and enforcement),
        and {{controlToolServerSupplyChainIntegrity}} and {{controlToolServerVetting}}
        (tool-server software and provider admission); this control checks only that the
        principal is still the registered one. Showing that this control was enforced
        depends on its audit telemetry being committed and retained under
        {{controlAuditTrailCompleteness}}.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaModelServing
      - personaGovernance
    components:
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
      - componentTools
      - componentModelServing
      - componentApplication
    risks:
      - riskZombieShadowMCPServers
      - riskStaleAgentIdentityBinding
      - riskMCPTransportHijacking
      - riskAgentIdentitySpoofing
    lifecycleStage:
      - deployment
      - runtime
      - maintenance
    impactType:
      - integrity
      - confidentiality
      - accountability
    actorAccess:
      - external
      - supply-chain
      - agent
  - id: controlAgentExecutionBounds
    title: Agent Execution Bounds
    description:
      - >
        Enforce per-agent, per-session, and per-tool-call execution limits
        at the orchestration layer to prevent runaway tool-calling cycles.
        This control addresses the enforcement of loop bounds, context-window
        budgets, and circuit breakers within agent reasoning and tool
        invocation sequences — as distinct from API-layer rate limiting
        (which operates at the external request boundary) and agent
        observability (which detects loops but does not halt them).
      - >
        Implementation requires: mandatory max_turns defaults for all
        agent-to-tool execution sequences, with no framework permitting
        unbounded execution by default; per-agent and per-session tool-call
        budgets that are enforced by the orchestration layer before each
        tool invocation; context-window budget tracking that halts agent
        execution before context saturation degrades reasoning quality;
        and circuit breakers that terminate agent execution when cumulative
        resource thresholds (compute, tokens, wall-clock time) are exceeded.
        Loop detection at the orchestration layer should identify repeated
        tool-call patterns and trigger early termination.
    category: controlsApplication
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
    components:
      - componentReasoningCore
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
    risks:
      - riskRunawayAgentToolLoops
      - riskEconomicDenialOfWallet
    mappings:
      owasp-top10-llm:
        - LLM10:2025
      mitre-atlas:
        - AML.M0004@5.0.1
      nist-ai-rmf:
        - MEASURE-2.6@1.0
        - MANAGE-2.1@1.0
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - availability
      - safety
    actorAccess:
      - agent
  - id: controlModelRegistryIntegrity
    title: Model Registry and Discovery Integrity
    description:
      - >
        Ensure that model registries, marketplace listings, and registry-published
        metadata (model cards, provenance records, evaluation claims, licensing
        assertions, version histories) are integrity-protected throughout their
        lifecycle — from initial onboarding through runtime consumer-pull. Implement
        cryptographic signing of model manifests and metadata, publisher identity
        verification, namespace governance to prevent typosquatting and takeover of
        well-known model namespaces, and consumer-side verification at pull time.
        Apply registry-side integrity gates regardless of whether the registry is
        public, private, sector-specific, or vendor-managed.
    category: controlsInfrastructure
    personas:
      - personaModelProvider
      - personaPlatformProvider
      - personaApplicationDeveloper
      - personaGovernance
    components:
      - componentModelRegistry
    risks:
      - riskModelSourceTampering
      - riskModelDeploymentTampering
      - riskInsecureIntegratedComponent
      - riskEvaluationBenchmarkManipulation
  - id: controlToolRegistryAndDiscoveryIntegrity
    title: Tool Registry and Discovery Integrity
    description:
      - >
        Ensure that tool registries, MCP server manifests, discovery endpoints, and
        tool metadata are integrity-protected throughout their lifecycle — from initial
        onboarding through runtime operation. Implement cryptographic signing of tool
        manifests and metadata, publisher identity verification, namespace governance to
        prevent typosquatting and tool shadowing, integrity baselines for registered
        tool definitions, runtime monitoring for unauthorized changes to tool
        descriptions or schemas, and re-approval workflows when tool metadata is modified
        after initial vetting.
      - >
        This control addresses a gap in the existing control set: integrity controls
        already cover model and data integrity ({{controlModelAndDataIntegrityManagement}}),
        routing infrastructure integrity ({{controlOrchestratorAndRouteIntegrity}}), and
        agent action observability ({{controlAgentObservability}}), but none explicitly
        address the integrity of tool discovery and registration infrastructure as its
        own surface. {{riskToolRegistryTampering}} and {{riskToolSourceProvenance}}
        describe threat models that depend on tool-metadata integrity; the mitigations
        they call for (provenance verification, known-good baselines, tamper detection)
        are not the primary focus of any current control.
    category: controlsInfrastructure
    personas:
      - personaAgenticProvider
      - personaPlatformProvider
      - personaApplicationDeveloper
    components:
      - componentToolRegistry
    risks:
      - riskToolRegistryTampering
      - riskToolSourceProvenance
  - id: controlAgentCapabilityNegotiation
    title: Agent Capability Negotiation Control
    description:
      - >
        Validate the tools and capabilities an agent acquires through runtime negotiation
        against an approved policy, including that each is the approved version, before they
        become reachable, preventing advertised capabilities from silently expanding the
        agent's reach. The objective is a governed admission decision.
      - >
        Apply this control at the handshake boundary, where an agent binds the tools exposed
        by a remote tooling or shared-service endpoint.
    guidance:
      - >
        Evaluate admission against an allowlist binding each approved capability's identity
        to the digest of its approved version, as pinned under
        {{controlThirdPartyCapabilityAdmission}}. Do not expose (fail closed) a capability
        outside the approved set or whose identity or digest does not match its pin; route it
        to that control's re-approval, not inline approval. Re-evaluate on renegotiation so a
        changed set is re-admitted, not inherited. Record each expose-or-withhold decision
        with the offered identity and digest, the pin relied on, the requesting principal and
        session, and the time.
      - >
        Remote tooling and shared-service endpoints include, for example, an MCP or A2A tool
        server. Capabilities have the scope the admission control named below gives them:
        tools, prompts, and instruction templates, each checked when offered during
        negotiation. A prompt or instruction template delivered outside negotiation is covered
        only by that control's admission and re-approval.
      - >
        This control is the runtime enforcement point. {{controlThirdPartyCapabilityAdmission}}
        admits, pins, and re-approves; this control enforces that pin at each handshake,
        re-admitting per session so an approved provider cannot silently expand its reach
        mid-session. A change to an approved capability's description, schema or declared
        metadata alters the digest, is not exposed, and triggers that control's re-approval. A
        behavior change behind an unchanged description is caught only by the periodic and
        trigger-driven re-review under {{controlToolServerVetting}}. It is distinct from
        {{controlAgentPluginPermissions}}, the static least-privilege upper bound enforced
        here; {{controlAgentPluginUserControl}}, which gates user approval of data-altering
        actions; and {{controlAgentInventoryManagement}}, the lifecycle authority over which
        endpoints may exist. Showing that this control enforced the pin depends on the records
        described above being committed and retained under {{controlAuditTrailCompleteness}}.
    category: controlsApplication
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
    components:
      - componentReasoningCore
      - componentTools
      - componentAgentConsentSurface
    risks:
      - riskRogueActions
      - riskInsecureIntegratedComponent
      - riskToolSourceProvenance
    mappings:
      owasp-top10-llm:
        - LLM06:2025
    lifecycleStage:
      - development
      - runtime
    impactType:
      - integrity
      - confidentiality
    actorAccess:
      - agent
      - service-provider
  - id: controlComponentIdentityAuthentication
    title: Component Identity Authentication
    description:
      - >
        Establish a distinct, authenticatable identity for each agent and each tool-serving
        endpoint, whether remote or locally exposed, ensuring that a principal acting in or
        on behalf of an AI system is authenticated before it is trusted and cannot be
        impersonated. The objective is that every non-human claimant presents a unique
        principal identifier with a verifiable authenticator bound to it, which the
        verifier confirms at connection time.
    guidance:
      - >
        Issue a unique principal identifier per agent or tool endpoint rather than reusing
        a shared service account, and bind it to a verifiable authenticator — a workload
        credential, a signed identity document, or a client certificate — so a counterparty
        can confirm the principal before exchanging instructions or data. Authenticate
        at connection time rather than inferring identity from a hostname,
        port, or co-location; a shared, ambient, or network-address-derived identity
        does not satisfy this control. Record each authenticate-pass or authenticate-fail
        decision with the claimed principal identifier, the counterparty, the authenticator and
        trust anchor relied on, and the time.
      - >
        Authentication strength and credential lifetime should be proportionate to the
        principal's authority and blast radius: higher-privilege agents and side-effecting
        tool endpoints warrant stronger authenticators and shorter-lived credentials,
        while low-impact, read-only endpoints may accept lighter-weight authentication.
        Implementers may satisfy the intent with SPIFFE/SVID workload identities, OAuth
        client-credential or token-exchange flows, mutual TLS with per-principal certificates,
        hardware-attested identities, or equivalent mechanisms; the control requires that
        a distinct principal be authenticated, not any particular cryptographic scheme.
      - >
        This control applies equally to agent-to-tool, agent-to-agent, and orchestrator-to-agent
        paths, independent of wire protocol (for example MCP, A2A, or vendor SDKs) or
        deployment form (remote or locally exposed). A locally exposed tool server is
        not implicitly trusted for binding to localhost; it is authenticated like any
        other endpoint.
      - >
        This control is distinct from {{controlAgentInventoryManagement}} (the lifecycle
        registry of which agents are authorized to exist), {{controlComponentIdentityProvenance}}
        (which verifies at each invocation that the counterparty is still the currently
        registered, non-revoked principal for its role: current standing, not identity
        establishment), {{controlAgentIntegrityManagement}} (which
        attests that a running agent matches its registered configuration), and {{controlAgentCredentialIsolation}}
        (which scopes issued credentials to a tenant): those answer whether a principal
        is registered, unmodified, and tenant-scoped, while this control establishes the
        authenticatable principal that makes those questions answerable. It is also distinct
        from {{controlInterComponentTransportSecurity}}, which protects the channel —
        transport security can authenticate an endpoint key but does not establish that
        the endpoint is a distinct, named principal. Per-principal authenticators, including
        per-principal client certificates, are this control's; the certificates that secure
        the transport channel itself are that control's. It is also distinct from
        {{controlAuthenticationSchemeHardening}}, which decides which schemes and credential
        types are acceptable, while this control authenticates a principal under an accepted scheme.
        It is distinct from {{controlFederatedUserAuthentication}}, which authenticates human
        users through a federated identity provider; this control authenticates non-human
        principals.
      - >
        This control is closest to {{controlComponentIdentityRegistration}}, which enrolls
        a component as a recognized, revocable client of the authorization server and
        issues no credential or authenticator (its client identifier is the record of
        enrollment). This control owns issuance: it issues the
        unique principal identifier, binds the verifiable authenticator to it, and verifies
        that authenticator at connection time. Where an enrollment protocol returns
        credentials during registration, issuing them is this control's function exercised
        at enrollment. The two hold independently — a principal can be authenticated against
        a trust anchor that never enrolled it as a client of any authorization server (for
        example an mTLS peer presenting a per-principal certificate chained to a trusted
        CA), and an enrolled component still presents an unverified credential until this
        control checks it at connect time. Showing that this control was enforced depends on
        the records described above being committed and retained under {{controlAuditTrailCompleteness}}.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaModelServing
      - personaGovernance
    components:
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
      - componentTools
      - componentModelServing
      - componentApplication
      - componentIdentityProvider
      - componentToolServer
    risks:
      - riskMCPTransportHijacking
      - riskAgentIdentitySpoofing
    lifecycleStage:
      - deployment
      - runtime
      - maintenance
    impactType:
      - integrity
      - confidentiality
      - accountability
    actorAccess:
      - external
      - agent
      - service-provider
  - id: controlDelegatedAuthorizationIntegrity
    title: Delegated Authorization Integrity
    category: controlsInfrastructure
    description:
      - >
        Ensure that when one component acts on behalf of another, the authority exercised is
        carried by a verifiable delegated-authorization grant that names the original
        principal, is scoped to the requested action, and can be re-evaluated independently at
        each intermediary in the chain. The objective is an end-to-end handoff with auditable
        provenance and scope, preventing an intermediary from silently broadening or
        impersonating the authority it was given.
    guidance:
      - >
        Favor a standards-based delegated-authorization framework (for example OAuth 2.0 token
        exchange with audience-restricted, short-lived access tokens and fine-grained scopes)
        rather than forwarding a caller's raw credential or a static long-lived secret. Bind
        the acting party, original principal, and permitted scope in each grant, so each
        intermediary, including remote tooling endpoints such as MCP or A2A tool servers, can
        evaluate it against policy before honoring it. The policy decision point evaluates the
        grant; the policy enforcement point at the intermediary enforces the decision. Both sit
        in trusted, deterministic components outside the model. Record each grant verify-pass
        or verify-fail decision with the acting party, original principal, scope and audience
        evaluated, grant and policy relied on, and the time. See
        {{ref:rfc-8693-token-exchange}}, {{ref:rfc-6749-oauth2}}, and
        {{ref:nist-sp-800-162-abac}}.
      - >
        This control is distinct from {{controlAgentPluginPermissions}} (bounds delegated
        authority to the intersection of the agent's and caller's permissions),
        {{controlAgentCredentialIsolation}} (keeps credentials within a tenant boundary),
        {{controlInterComponentTransportSecurity}} (protects the channel the grant rides
        over), and {{controlComponentIdentityProvenance}} (attests that the callee is the
        registered principal). Those assume a trustworthy grant exists; this control
        establishes the grant and its per-hop verifiability. It is also distinct from
        {{controlDelegatedAuthorityConfinement}}, which requires authority to be re-minted for
        each hop's recipient rather than forwarded. The two are independent: a chain can
        re-mint at every hop yet issue grants that cannot be independently re-evaluated at each
        intermediary. Showing that this control was enforced depends on the records described
        above being committed and retained under {{controlAuditTrailCompleteness}}.
