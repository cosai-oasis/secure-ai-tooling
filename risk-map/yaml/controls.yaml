  - id: controlMessageAndPayloadResourceLimits
    title: Message and Payload Resource Limits
    description:
      - >
        Bound the size and structural complexity of individual protocol messages so that
        no single message or stream can exhaust compute, memory, or bandwidth on a receiving
        component. This control governs per-message resource ceilings on the wire — maximum
        payload size ({{ref:cwe-400}}), maximum nesting and recursion depth ({{ref:cwe-674}})
        for structured payloads, and decompression-ratio limits ({{ref:cwe-409}}) — across
        all inter-component and remote-tooling channels (for example agent-to-tool, orchestration,
        and model-serving protocols).
      - >
        This control addresses what a single message is allowed to consume, as distinct
        from {{controlApplicationAccessManagement}}, which governs how often a caller
        may issue requests (rate limiting and quotas at the request boundary), and {{controlAgentExecutionBounds}},
        which caps agent reasoning and tool-call loops at the orchestration layer. It
        is also distinct from {{controlInterComponentTransportSecurity}}, which authenticates
        and encrypts the channel but does not bound the work a well-formed message can
        impose on its receiver. Rate limits restrain request frequency; these limits restrain
        the cost of any one message, including the first.
      - >
        Implementers can reject or truncate messages exceeding a configured size before
        full buffering, cap deserialization nesting and recursion depth to defeat deeply-nested
        and recursive payloads, and bound decompression ratios to defeat compression-bomb
        inputs. Where a protocol or framework ships without such ceilings, AI systems
        should set them explicitly rather than relying on transport or framework defaults,
        since agent and remote-tooling protocols frequently expose endpoints (including
        locally-exposed tool servers) that lack the hardened defaults of mature web stacks.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    components:
      - componentModelServing
      - componentTools
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
      - componentAgentToolTransport
      - componentToolInputHandling
