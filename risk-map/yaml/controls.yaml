  - id: controlSecretsAndKeyManagement
    title: Secrets and Key Management
    description:
      - >
        Ensure that secrets and cryptographic key material held at rest by AI system
        components — API keys, downstream service credentials, signing and encryption keys,
        and access tokens — are stored, brokered, and rotated through a dedicated
        secrets-management capability. The control has five parts: centralized custody,
        scoped short-lived credentials, encryption of key material, rotation and revocation,
        and classification-driven handling.
    guidance:
      - >
        **Centralized custody:** Hold secrets in a dedicated secret store or key-management
        service, not in plaintext configuration, container images, source repositories,
        environment variables, or memory dumps. Where a store serves several principals,
        scope retrieval so none can read another's secrets.
      - >
        **Scoped, short-lived credentials:** For credentials this component brokers or
        stores, issue narrowly scoped, short-lived credentials per task. Give every stored
        long-lived secret, such as a static downstream API key, a maximum lifetime, a
        rotation cadence set at issuance, and a named rotation owner.
      - >
        **Encryption of key material:** Protect stored keys with envelope encryption
        or hardware-backed key protection, and separate key-encrypting keys from the
        data they protect.
      - >
        **Rotation and revocation:** Support automated rotation on a defined cadence and
        immediate revocation, without redeploying the holding component, on suspected
        compromise of stored secret material or on component decommission.
      - >
        **Classification-driven handling:** Classify the secret and data material a
        component holds so that storage, encryption, and access decisions can be driven
        by sensitivity rather than applied uniformly.
      - >
        Orchestrators and tool servers (for example MCP or A2A tool endpoints) accumulate
        credentials for many downstream services and broker them across delegation hops,
        so one mishandled secret has a large blast radius.
      - >
        This control is distinct from {{controlInterComponentTransportSecurity}}, which
        protects credentials in transit; {{controlAgentCredentialIsolation}}, which keeps
        issued agent credentials within tenant boundaries during delegation; and
        {{controlModelAndDataAccessControls}}, which governs who may access models and
        datasets. Those assume well-custodied secrets; this control establishes that custody.
        This control owns the scope and lifetime assigned when a secret is issued and stored,
        and rotation and revocation on compromise of stored material. For transport
        certificates, {{controlInterComponentTransportSecurity}} issues, rotates and revokes;
        this control holds the private keys. {{controlSessionCredentialBindingAndLifecycle}}
        owns revocation on detected reuse or anomaly, session-identifier rotation, and the
        lifetime of a credential as presented and used.
        {{controlSenderConstrainedCredentials}} owns presentation-time reuse-resistance
        (proof-of-possession, sender-constraint).
    category: controlsInfrastructure
