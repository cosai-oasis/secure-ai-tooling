  - id: controlToolServerSupplyChainIntegrity
    title: Tool-Server Supply Chain Integrity
    description:
      - >
        Ensure that third-party and remote tool-server software is provenance-verified
        and integrity-gated before it is acquired, installed, or updated, so that the
        inventory and runtime controls that depend on it can trust what they are tracking.
        The objective is a verifiable chain of custody from publisher to deployed tool
        server, not an open question of which package an agent ended up running.
      - >
        Scope this control to the acquisition, installation, and update lifecycle of tool-server
        software (including MCP and other remote-tooling deployments). Apply, in proportion
        to the trust placed in the tool server and the sensitivity of the actions it can
        take:
      - - >
          Provenance verification of the publisher and source before adoption, using signed
          artifacts and build provenance (for example SLSA-style attestations, in-toto,
          or registry-native signing) rather than name or description alone.
        - >
          Package-integrity gating at install and update time, verifying checksums and
          signatures against the asserted publisher identity so that a substituted, tampered,
          or typosquatted package fails closed before it is deployed.
        - >
          Dependency transparency through a software bill of materials (SBOM) for the
          tool server and its transitive dependencies, reviewed against known-vulnerable
          and disallowed components.
        - >
          Update-channel integrity, so that updates are obtained over authenticated channels
          and re-verified with the same provenance and integrity checks applied at first
          install, preventing a trusted server from being silently replaced.
      - >
        This control governs the upstream supply-chain gate. It is distinct from {{controlAgentInventoryManagement}},
        which is the lifecycle authority over which tool servers are authorized to exist
        and detects shadow and zombie servers; this control is the provenance and package-integrity
        step that should gate entry into that inventory. It is distinct from {{controlModelAndDataIntegrityManagement}},
        which protects model, data, and training-code artifacts; this control protects
        a different artifact class -- the tool-server software an agent reaches out to.
        It is distinct from {{controlModelAndDataExecutionIntegrity}}, which verifies
        known-good artifacts at inference time, and from {{controlSecureByDefaultMLTooling}},
        which governs the security posture of selected tooling rather than the verifiability
        of its origin. It is also distinct from {{controlComponentIdentityProvenance}},
        which attests at invocation time that a running endpoint is the registered principal;
        this control establishes that the software behind that principal entered the environment
        through a verified supply chain.
      - >
        Consistent with a risk-appetite posture, organizations calibrate the strength
        of provenance evidence required and the strictness of install-time gating to the
        privilege and blast radius of each tool server, rather than applying a single
        uniform bar to all tooling.
    category: controlsInfrastructure
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaGovernance
    components:
      - componentTools
      - componentToolServer
      - componentToolRegistry
    risks:
