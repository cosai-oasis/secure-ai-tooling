  - id: controlOrchestratorAndRouteIntegrity
    title: Orchestrator and Route Integrity
    description:
      - >
        Implement signed route manifests, configuration integrity verification,
        and response provenance tracking to prevent routing manipulation and
        ensure request routing to authorized models.
    guidance:
      - >
        This control is distinct from {{controlInterComponentTransportSecurity}},
        which establishes authenticated, encrypted, and integrity-protected
        channels between components. Route integrity relies on that channel
        protection; a verified route does not itself make the channel carrying
        it authenticated, encrypted, or integrity-protected.
    category: controlsInfrastructure
