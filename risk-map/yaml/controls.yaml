  - id: controlSenderConstrainedCredentials
    title: Sender-Constrained Credentials
    description:
      - >
        Bind credentials used for inter-component and tool authentication to their legitimate
        holder, making possession of a credential value alone insufficient to authenticate.
        The objective is that the presenter must additionally prove control of a holder-bound
        key or context at use time.
    guidance:
      - >
        Implement this through proof-of-possession mechanisms such as DPoP-style application-layer
        binding ({{ref:rfc9449}}) and mutual-TLS certificate-bound access tokens
        ({{ref:rfc-8705-mtls}}), which bind the token to the client's key rather than the
        connection. Pair the binding with short credential lifetimes.
      - >
        This control is distinct from {{controlInterComponentTransportSecurity}}, which
        binds tokens to the TLS channel; holder-key binding is independent of the channel
        and survives hops and intermediaries. It is distinct from
        {{controlAgentCredentialIsolation}}, which scopes issuance and propagation to a
        tenant and governs which principals a credential is valid for; this control governs
        whether a presenter is the rightful holder. It is distinct from
        {{controlSessionCredentialBindingAndLifecycle}}, the lifecycle discipline in which
        holder binding is one input: this control supplies the binding, and that control
        sets the short lifetimes it is paired with.
      - >
        It is also distinct from {{controlDelegatedAuthorityConfinement}}, which governs
        propagation across a delegation chain, minting authority afresh for each hop's
        recipient; holder binding is a property of one credential, and either can be adopted
        without the other. It is distinct from {{controlSecretsAndKeyManagement}}, which
        governs custody, brokering, and rotation of held secrets and keys; this control
        governs presentation time, not where the secret is stored.
    category: controlsApplication
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaModelServing
      - personaApplicationDeveloper
    components:
      - componentTools
      - componentModelServing
      - componentReasoningCore
