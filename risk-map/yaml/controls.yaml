  - id: controlAgentHostSecureConfiguration
    title: Agent Host Secure Configuration
    description:
      - >
        Configure the host and client environments that run agents and remote tooling
        with security-relevant settings that resist tampering by unprivileged users and
        by agents acting with a user's authority. The objective is to ensure that
        protective configuration — including the human approval surface, tool-invocation
        gating, and least-privilege defaults — can be changed only by the role that owns it.
      - >
        This control governs the integrity of the configuration itself — whether protective
        settings can be turned off by someone, or by something acting for someone, who
        should not be able to.
    guidance:
      - >
        Implementation favors a hardened baseline whose security-relevant settings are
        owned by a privileged role and applied to running agent and tool-host instances,
        with changes to those settings restricted to that role and each change, applied or
        rejected, recorded for later review with the setting, its before and after values, the
        changing principal, the authorization relied on, and the time. Secure defaults should
        require explicit, authorized opt-out rather than
        being disablable from an unprivileged context, and configuration drift from the
        baseline should be detectable.
      - >
        User-writable settings are reachable by anything running with the user's
        authority, including a prompt-injected agent acting as the user. Ownership of
        protective settings by a privileged role, rather than by the user the agent
        runs as, is what keeps such an agent from editing away its own approval gate
        or tool restrictions.
      - >
        This control is distinct from {{controlRuntimeHostIsolation}}, which sandboxes
        the running process to bound its blast radius; this control keeps the protective
        settings (including that isolation) from being silently disabled. It is distinct
        from {{controlAgentPluginUserControl}},
        which establishes that user approval is sought for consequential agent actions
        — this control keeps that approval surface from being disabled — and from {{controlSecureByDefaultMLTooling}}
        (selecting/shipping tooling with secure defaults) and {{controlAgentPluginPermissions}}
        (which scopes the agent's action authority rather than the tamper-resistance of
        the settings that bound it). Showing that this control was enforced depends on the
        records described above being committed and retained under {{controlAuditTrailCompleteness}}.
    category: controlsApplication
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
