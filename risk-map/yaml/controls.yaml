  - id: controlInboundNetworkExposureAndSegmentation
    title: Inbound Network Exposure and Segmentation
    description:
      - >
        Constrain the inbound network reachability of AI-system services to the callers
        each requires, through exposure control and segmentation.
    guidance:
      - >
        **Inbound exposure:** Bind services to the narrowest interface that satisfies their
        role — a loopback or explicit internal interface rather than all interfaces.
        Locally-run tool servers and sidecars listen on secure-by-default interfaces and are
        not reachable from the broader network by default. Treat exposure as a deliberate,
        reviewable configuration decision rather than a default. Record each denied inbound
        connection and each change to an exposure or segmentation rule, with the source, the
        destination service, the rule relied on, and the time.
      - >
        **Segmentation:** Place services behind segmentation boundaries that scope
        reachability to authorized peers. Segment between tenant, trust, and environment
        boundaries so a compromised service cannot reach unrelated services: default-deny
        inbound, allowlisted ingress, denied lateral paths, consistent with a zero-trust
        posture.
      - >
        This control is distinct from {{controlNetworkEgressControl}}, which governs
        outbound reachability: this control governs who may reach a service, that control
        where a component may send. It is distinct from
        {{controlInterComponentTransportSecurity}}, which secures the channel once a
        connection is permitted; this control governs whether the service should have been
        reachable at all. It is distinct from {{controlIsolatedConfidentialComputing}}
        (hardware-layer isolation), {{controlSecureByDefaultMLTooling}} (tooling secure
        defaults generally; this is the network-exposure slice), and
        {{controlModelAndDataAccessControls}} (identity-scoped asset access, not network
        reachability). It is also distinct from {{controlAgenticZeroTrustPosture}}, which
        sets the design-time trust topology and requires assume-breach segmentation as a
        structural property; this control enforces inbound reachability and segmentation at
        the network layer within that topology. Showing that this control was enforced depends
        on the records described above being committed and retained under
        {{controlAuditTrailCompleteness}}.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
