  - id: controlToolServerSupplyChainIntegrity
    title: Tool-Server Supply Chain Integrity
    description:
      - >
        Ensure that third-party tool-server software the organization acquires and runs,
        including servers it hosts for remote access, is provenance-verified and
        integrity-gated before it is acquired, installed, or updated. The objective is a
        verifiable chain of custody from publisher to deployed tool server.
      - >
        This control governs the acquisition, installation, and update lifecycle of
        tool-server software, in four parts: provenance verification, package-integrity
        gating, dependency transparency, and software-update integrity.
    guidance:
      - >
        Calibrate provenance evidence and install-time gating strictness to each tool
        server's trust, action sensitivity, and blast radius, not a single uniform bar:
      - - >
          **Provenance verification** of publisher and source before adoption, using signed
          artifacts and build provenance (for example SLSA-style attestations, in-toto, or
          registry-native signing), not name or description alone.
        - >
          **Package-integrity gating** at install and update: verify checksums and signatures
          against the publisher identity approved for that server, not one the package
          asserts for itself, so a substituted, tampered, typosquatted, or differently-signed
          package fails closed before deployment.
        - >
          **Dependency transparency** through a software bill of materials (SBOM) for the
          server and its transitive dependencies, reviewed against known-vulnerable and
          disallowed components.
        - >
          **Software-update integrity**: obtain updates over authenticated channels and
          re-verify them with the same provenance and integrity checks as first install, so
          a trusted server cannot be silently replaced.
        - >
          **Decision records** for each verify-pass or verify-fail outcome: the server and
          package, the publisher identity and provenance evidence relied on, the principal or
          pipeline that ran the check, and the time.
      - >
        This control applies where the organization acquires and runs the tool-server
        software, such as a self-hosted MCP or other remote-tooling server. For a remote
        server a third party hosts, there is no package to install and this control does not
        apply; assurance there comes from the admission under {{controlToolServerVetting}} and
        the pin under {{controlThirdPartyCapabilityAdmission}}.
      - >
        This control is the upstream supply-chain gate the inventory and runtime controls
        depend on. It is distinct from {{controlToolServerVetting}}, which decides through
        documented review whether a provider or server is trustworthy enough to admit; this
        control verifies the software as acquired, installed, or updated, taking as the
        expected identity the publisher identity recorded by vetting's admission decision.
        Vetting may draw on this control's provenance evidence. A vetted server has not
        thereby had its package verified, and a verified package has not thereby been vetted.
        It is distinct from {{controlThirdPartyCapabilityAdmission}}, which admits and
        re-approves the capability set (tools, prompts, and instruction templates) and decides
        whether a changed capability may execute; this control owns the integrity and
        provenance of software updates. It is distinct from
        {{controlToolRegistryAndDiscoveryIntegrity}}, which owns the integrity of registry
        entries and tool metadata, including their tampering; this control is limited to the
        software package. It is distinct from {{controlAgentInventoryManagement}}, the
        lifecycle authority over which tool servers may exist, which detects shadow and zombie
        servers; this control's checks should gate entry into it. It is distinct from
        {{controlModelAndDataIntegrityManagement}}, which protects model, data, and
        training-code artifacts; {{controlModelAndDataExecutionIntegrity}}, which verifies
        known-good artifacts at inference time; {{controlSecureByDefaultMLTooling}}, which
        governs the security posture of selected tooling, not the verifiability of its origin;
        and {{controlComponentIdentityProvenance}}, which attests at invocation time that a
        running endpoint is the registered principal, where this control establishes that the
        software behind it entered through a verified supply chain. Showing that this control
        was enforced depends on the records described above being committed and retained under
        {{controlAuditTrailCompleteness}}.
    category: controlsInfrastructure
    personas:
