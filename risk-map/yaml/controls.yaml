  - id: controlAgentHostSecureConfiguration
    title: Agent Host Secure Configuration
    description:
      - >
        Configure the host and client environments that run agents and remote tooling
        so that security-relevant settings resist tampering by unprivileged users. The
        objective is to ensure that protective configuration — including the human approval
        surface, tool-invocation gating, and least-privilege defaults — remains in effect
        for its intended risk-appetite and is not silently weakened by a local actor who
        lacks the authority to change it.
      - >
        Implementation favors a hardened baseline whose security-relevant settings are
        owned by a privileged role and applied to running agent and tool-host instances,
        with changes to those settings restricted to that role and recorded for later
        review. Secure defaults should require explicit, authorized opt-out rather than
        being disablable from an unprivileged context, and configuration drift from the
        baseline should be detectable.
      - >
        This control governs the integrity of the configuration itself — whether protective
        settings can be turned off by someone who should not be able to. It is distinct
        from {{controlRuntimeHostIsolation}}, which sandboxes the running process to bound
        its blast radius; this control keeps the protective settings (including that isolation)
        from being silently disabled. It is distinct from {{controlAgentPluginUserControl}},
        which establishes that user approval is sought for consequential agent actions
        — this control keeps that approval surface from being disabled — and from {{controlSecureByDefaultMLTooling}}
        (selecting/shipping tooling with secure defaults) and {{controlAgentPluginPermissions}}
        (which scopes the agent's action authority rather than the tamper-resistance of
        the settings that bound it).
    category: controlsApplication
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
    components:
      - componentReasoningCore
      - componentTools
      - componentRuntimeHosting
      - componentAgentConsentSurface
    risks:
