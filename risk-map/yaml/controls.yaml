  - id: controlSessionCredentialBindingAndLifecycle
    title: Session and Credential Binding
    category: controlsInfrastructure
    description:
      - >
        Reduce the value of a stolen authentication token or session identifier by constraining
        where and how long it can be used, rotating session identifiers on privilege or context
        change and revoking a credential on detected reuse. This is the identity- and
        credential-layer concern from {{ref:cosai-agentic-identity}}. The objective is that a
        credential observed by an attacker is not replayable beyond its intended audience or
        indefinitely.
    guidance:
      - >
        Approaches include audience-bound tokens scoped to their intended recipient, so a
        credential issued for one endpoint cannot be replayed against another; short
        credential and session lifetimes scoped to a task, request, or session; rotation of
        session identifiers on privilege or context change; and prompt revocation and
        invalidation when reuse from an unexpected origin, device, or concurrent session is
        detected. Implementers may use OAuth audience restriction, rotating session
        identifiers, sender-constrained tokens, or any approach achieving the same property.
      - >
        This control applies wherever agents, remote tools, and shared services authenticate
        to one another, including locally-exposed tool-server endpoints sometimes treated as
        implicitly trusted. The remote-tooling protocol (for example MCP) is a deployment
        attribute, not the locus of the control.
      - >
        This control is distinct from:
      - - >
          {{controlInterComponentTransportSecurity}}, which secures the channel a credential
          travels over, including channel binding and message-level replay protection. This
          control limits where and for how long the credential is valid.
        - >
          {{controlAgentCredentialIsolation}}, which confines agent credentials to one tenant.
          This control governs reuse resistance regardless of tenancy.
        - >
          {{controlApplicationAccessManagement}}, which decides whether an authenticated
          principal is authorized for an action. This control governs the audience and
          lifetime of the credential itself, not the authorization of its principal.
        - >
          {{controlSecretsAndKeyManagement}}, which governs custody of held secret and key
          material, the lifetime and rotation cadence assigned to stored secrets at issuance,
          and rotation and revocation on compromise of stored material. This control governs
          the audience and lifetime of the credential as presented and used, including
          session-identifier rotation and revocation on detected reuse or anomaly.
        - >
          {{controlDelegatedAuthorityConfinement}}, which issues authority afresh for each
          hop's recipient. This control governs the binding and lifetime of any credential or
          session, delegated or not: a chain can re-mint authority at every hop and still
          issue long-lived, unbound tokens.
        - >
          {{controlSenderConstrainedCredentials}}, which supplies the proof-of-possession
          binding that makes a credential resistant to replay by a non-holder. This control is
          the lifecycle discipline in which holder binding is one input. Either can be adopted
          without the other.
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    risks:
      - riskCredentialAndTokenTheft
      - riskLongLivedSessionStateWeakness
    externalReferences:
      - id: cosai-agentic-identity
        title: 'CoSAI: Agentic Identity and Access Control'
        url: https://github.com/cosai-oasis/ws3-secure-design-patterns
        type: spec
    actorAccess:
      - external
      - api
      - agent
    impactType:
      - confidentiality
      - integrity
      - accountability
    lifecycleStage:
      - runtime
    components:
      - componentApplication
      - componentToolServer
      - componentAgentToolTransport
      - componentIdentityProvider
  - id: controlAuthenticationSchemeHardening
    title: Authentication Scheme Hardening
    category: controlsInfrastructure
    description:
      - >
        Select authentication and authorization schemes that bind each request to a verifiable,
        appropriately scoped principal. The objective is that every machine-to-machine
        and user-to-service authentication establishes who the caller is in a way the
        relying party can independently verify and attribute.
      - >
        This control governs the quality and trust properties of the authentication scheme
        itself — what counts as an acceptable credential.
    guidance:
      - >
        Schemes that frustrate this objective — HTTP basic auth, long-lived static API
        keys, and pass-through (token-passthrough) patterns where an upstream credential,
        including one relayed by a remote-tooling or shared-service intermediary such as
        an MCP or plugin tool server, is forwarded unverified to a downstream service —
        should be deprecated in favor of federated identity, short-lived tokens,
        proof-of-possession or channel-bound credentials, and per-principal rotation. Record
        each decision on whether a presented scheme or credential type is acceptable under
        the scheme policy, with the scheme and credential type, the policy relied on, and the time.
      - >
        This control is distinct from {{controlInterComponentTransportSecurity}}, which
        secures the channel the credential travels over and assumes a credential exists;
        from {{controlComponentIdentityProvenance}}, which verifies a presented identity
        is the registered principal for a role; and from {{controlAgentCredentialIsolation}},
        which scopes credentials to tenant boundaries once a strong scheme is in place.
        Those controls assume a sound authentication scheme; this control establishes
        one. It is distinct from {{controlComponentIdentityAuthentication}}, which makes the
        authenticate-pass or authenticate-fail decision for a non-human principal under an
        accepted scheme, and from {{controlFederatedUserAuthentication}}, which owns
        delegating human-user authentication to a federated identity provider and the accept
        or reject of the tokens it issues; this control governs only which schemes and
        credential types are acceptable under policy. It is distinct from
        {{controlDelegatedAuthorityConfinement}}, which requires
        authority to be re-minted for each hop's recipient; this control governs whether the
        credential a hop receives is verifiable and attributable, that control whether it was
        issued for that hop. Showing that this control was enforced depends on the records described above
        being committed and retained under {{controlAuditTrailCompleteness}}.
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    risks:
      - riskAgentIdentitySpoofing
    components:
      - componentApplication
      - componentToolServer
      - componentAgentToolTransport
      - componentIdentityProvider
      - componentAuthorizationPolicyEnforcementPoint
  - id: controlToolArgumentValidationAndSanitization
    title: Tool Argument Validation and Sanitization
    description:
      - >
        Validate and sanitize the arguments an agent passes to a tool, function, or backend
        service before they are executed.
      - >
        This control governs the values flowing through a tool call. The receiving tool
        or service is responsible for validating parameters independently of the calling
        agent's apparent intent.
    guidance:
      - >
        Apply conventional injection-prevention techniques scoped to the argument type,
        for example:
      - - >
          Constrain arguments to an expected schema, type, and allowlist of values or formats,
          not freeform strings where structured input is expected.
        - >
          Use parameterized or prepared interfaces so argument values cannot alter the
          structure of the operation they feed ({{ref:cwe-89}}).
        - >
          Canonicalize file-path arguments and bound them to a permitted root to prevent
          traversal ({{ref:cwe-22}}).
        - >
          Avoid passing argument values through a shell interpreter; where a system command is
          unavoidable, pass a non-interpreted argument vector, not a concatenated string
          ({{ref:cwe-77}}).
        - >
          Handle serialized payloads with restricted, type-bounded deserialization, or reject
          them ({{ref:cwe-502}}).
        - >
          Record each rejected or sanitized argument with the calling agent, the tool, the
          argument and the check it failed, and the time.
      - >
        Tool selection is not evidence that argument values are safe: injected content can
        steer an agent into emitting parameters that reach a backend as a shell command, file
        path, database query, or serialized object. The tool boundary is where classical
        injection defenses apply.
      - >
        This control is distinct from {{controlInputValidationAndSanitization}}, which
        screens adversarial queries reaching the model, and
        {{controlOutputValidationAndSanitization}}, which screens model output before
        consumption. It is also distinct from {{controlAgentPluginPermissions}}, which governs
        which tools an agent may invoke and with what authority: permissions decide whether a
        call is allowed, this control whether its arguments are safe to execute. They are
        complementary: a permitted tool can still be driven to harm with malicious arguments.
        Showing that this control was enforced depends on the records described above being
        committed and retained under {{controlAuditTrailCompleteness}}.
    category: controlsApplication
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
    components:
      - componentTools
      - componentOrchestrationInputHandling
      - componentToolInputHandling
    risks:
      - riskPromptInjection
      - riskRogueActions
