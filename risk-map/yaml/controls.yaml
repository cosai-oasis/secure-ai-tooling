      - runtime
    impactType:
      - confidentiality
      - integrity
    actorAccess:
      - external
      - service-provider
  - id: controlThirdPartyCapabilityAdmission
    title: Third-Party Capability Admission Control
    description:
      - >
        Ensure that the third-party CAPABILITIES an agent acquires — the set of tools
        and, in particular, prompt or instruction-template capabilities a provider exposes
        — are admitted against an approval policy before use, and that a material change
        to an already-approved capability requires re-approval before it takes effect.
        The objective is an admission decision at the capability-set level: only capabilities
        that have passed a current approval gate are eligible to execute. This addresses
        dependency-and-update ("rug-pull") compromise, where a capability benign at adoption
        is later swapped, re-versioned, or allowed to redefine its own description — and
        covers prompt capabilities that individual tool- and server-integrity controls
        do not.
      - >
        Favor a documented approval gate proportionate to the capability's privilege and
        blast radius: confirmation that the providing server has cleared {{controlToolServerVetting}}
        before a capability from it is admitted; pinning an approved capability to a specific
        reviewed version; a re-approval trigger on description, schema, permission, or
        version change; and constrained update channels so capability updates arrive through
        reviewable paths rather than being self-asserted at runtime.
      - >
        This control governs onboarding admission and re-approval of the capability set.
        It is distinct from {{controlToolServerVetting}}, which vets the provider/server;
        from {{controlToolServerSupplyChainIntegrity}}, which provenance-verifies the
        server software; from {{controlToolRegistryAndDiscoveryIntegrity}}, which protects
        registered tool manifests/metadata and their re-approval; and from {{controlAgentCapabilityNegotiation}},
        which enforces the approved set at each RUNTIME negotiation handshake — this control
        is the onboarding/change-control authority that populates what that runtime enforcement
        point checks.
    category: controlsInfrastructure
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaGovernance
    components:
      - componentTools
      - componentReasoningCore
      - componentOrchestrationInputHandling
