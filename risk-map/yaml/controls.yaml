  - id: controlAuthenticationSchemeHardening
    title: Authentication Scheme Hardening
    category: controlsInfrastructure
    description:
      - >
        Select authentication and authorization schemes that bind each request to a verifiable,
        appropriately scoped principal, and phase out weak or pass-through schemes that
        undermine accountability. The objective is that every machine-to-machine and user-to-service
        authentication establishes who the caller is in a way the relying party can independently
        verify and attribute. Schemes that frustrate this objective — HTTP basic auth,
        long-lived static API keys, and pass-through (token-passthrough) patterns where
        an upstream credential is forwarded unverified to a downstream service — should
        be deprecated in favor of federated identity, short-lived tokens, proof-of-possession
        or channel-bound credentials, and per-principal rotation. Pass-through is the
        dominant case this control targets in agentic deployments: where a remote-tooling
        or shared-service intermediary (e.g., an MCP or plugin tool server) sits between
        a caller and a backend, the scheme must re-establish and independently verify
        the principal at each hop rather than forwarding the caller's bearer credential
        unverified. This control governs the quality and trust properties of the authentication
        scheme itself — what counts as an acceptable credential. It is distinct from {{controlInterComponentTransportSecurity}},
        which secures the channel the credential travels over and assumes a credential
        exists; from {{controlComponentIdentityProvenance}}, which verifies a presented
        identity is the registered principal for a role; and from {{controlAgentCredentialIsolation}},
        which scopes credentials to tenant boundaries once a strong scheme is in place.
        Those controls assume a sound authentication scheme; this control establishes
        one.
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    risks:
      - riskAgentIdentitySpoofing
    mappings:
      nist-ai-rmf:
        - MEASURE-2.7@1.0
    components:
      - componentApplication
      - componentToolServer
      - componentAgentToolTransport
      - componentIdentityProvider
      - componentAuthorizationPolicyEnforcementPoint
  - id: controlToolArgumentValidationAndSanitization
    title: Tool Argument Validation and Sanitization
    description:
      - >
        Validate and sanitize the arguments an agent passes to a tool, function, or backend
        service before they are executed, so that structured parameters cannot be interpreted
        as unintended commands by the receiving system.
      - >
        The receiving tool or service is responsible for validating parameters independently
        of the calling agent's apparent intent. Tool selection by an agent is not evidence
        that the argument values are safe: an agent may be steered by injected content
        into emitting parameters that, once executed, reach a backend as a shell command,
        a file path, a database query, or a serialized object. The tool boundary is the
        point at which classical injection defenses apply.
      - >
        Apply conventional injection-prevention techniques scoped to the argument type,
        for example:
      - - >
          Constrain arguments to an expected schema, type, and allowlist of values or
          formats rather than accepting freeform strings where structured input is expected.
        - >
          Use parameterized or prepared interfaces (for example parameterized queries)
          so that argument values cannot alter the structure of the operation they feed
          ({{ref:cwe-89}}).
        - >
          Canonicalize and bound file-path arguments to a permitted root to prevent traversal
          outside the intended scope ({{ref:cwe-22}}).
        - >
          Avoid passing argument values through a shell interpreter; where a system command
          is unavoidable, pass arguments as a non-interpreted argument vector rather than
          a concatenated string ({{ref:cwe-77}}).
        - >
          Reject or safely handle serialized payloads using restricted, type-bounded deserialization
          ({{ref:cwe-502}}).
      - >
        This control governs the values flowing through a tool call. It is distinct from
        {{controlInputValidationAndSanitization}}, which screens adversarial queries reaching
        the model itself, and from {{controlOutputValidationAndSanitization}}, which screens
        model output before it is consumed. It is also distinct from {{controlAgentPluginPermissions}},
        which governs which tools an agent may invoke and with what authority — permissions
        decide whether a call is allowed, while this control decides whether the call's
        arguments are safe to execute. Permission scoping and parameter validation are
        complementary: a permitted tool can still be driven to harm with malicious arguments.
    category: controlsApplication
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
    components:
      - componentTools
      - componentOrchestrationInputHandling
      - componentToolInputHandling
    risks:
