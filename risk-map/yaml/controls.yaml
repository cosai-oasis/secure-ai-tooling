  - id: controlNetworkEgressControl
    title: Network Egress Control
    description:
      - >
        Constrain the OUTBOUND network reachability of AI-system components — model-serving
        endpoints, orchestration services, agents, and the tool servers they run — so
        that a compromised or misbehaving component cannot originate arbitrary external
        connections. The objective is to bound where a component may send traffic: preventing
        data exfiltration and command-and-control (C2) callbacks by governing egress against
        an allowlist of legitimate destinations rather than permitting open outbound access
        by default.
      - >
        Govern component-originated connections through an egress policy or forward proxy
        rather than allowing unrestricted external access: default-deny outbound with
        allowlisted destinations and ports scoped to what each component legitimately
        needs; egress filtering or proxying that constrains C2 reachability and bulk data
        egress (network-boundary data-loss prevention); and destination scoping for agents
        and tool servers so an agent cannot reach external endpoints beyond its task.
        Calibrate strictness to the sensitivity of the data a component handles and its
        blast radius.
      - >
        This control governs outbound reachability and exfiltration. It is distinct from
        {{controlInboundNetworkExposureAndSegmentation}}, which governs inbound exposure
        and segmentation (who may reach a service) — this control governs where a component
        may send. It is distinct from {{controlInterComponentTransportSecurity}} (protects
        the channel once a connection is permitted), {{controlModelAndDataAccessControls}}
        (principal access to assets, not network egress paths), and {{controlIsolatedConfidentialComputing}}
        (compute/memory isolation rather than the network).
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    components:
      - componentModelServing
      - componentTools
      - componentReasoningCore
      - componentToolNetworkPolicyEnforcementPoint
      - componentAgentNetworkPolicyEnforcementPoint
    risks:
      - riskModelExfiltration
      - riskInsecureIntegratedComponent
      - riskExcessiveNetworkExposure
