  - id: controlFederatedUserAuthentication
    title: Federated User Authentication
    category: controlsApplication
    description:
      - >
        Establish the identity of human users by delegating authentication to a trusted
        external identity provider. The objective is to ground every user-initiated
        session in a verifiable identity issued by an authoritative provider, giving
        downstream authorization, delegation, and audit decisions a trustworthy principal
        to act on.
      - >
        This control governs authentication of human users at the application boundary.
    guidance:
      - >
        Delegate authentication using federated standards (for example OIDC, OAuth 2.0,
        or SAML), rather than collecting, storing, and verifying user credentials within
        the AI application itself. Implementers should prefer an existing organizational
        or commercial identity provider over a bespoke authentication implementation,
        and should validate provider-issued tokens (signature, audience, expiry, issuer)
        on each session establishment so that a token issued for one application cannot
        be replayed against another. Record each accept or reject decision on a presented token
        with the user principal, the issuing provider, the audience checked, the validation
        result relied on, and the time.
      - >
        The protocol used and the deployment form (browser redirect, device-code flow,
        remote tooling such as MCP servers) are implementation attributes.
      - >
        Delegating authentication to an established provider reduces the application's
        exposure to credential-handling weaknesses (credential storage, password reset
        flows, multi-factor enrollment) and lets the application inherit the provider's
        identity assurance and session-management posture.
      - >
        This control is distinct from {{controlApplicationAccessManagement}}, which governs
        authorization and resource governance once a principal is established — this
        control answers "who is the human user" while access management answers "what
        is this principal allowed to do." It is also distinct from the machine-to-machine
        identity controls: {{controlComponentIdentityAuthentication}}, which authenticates
        non-human component and agent principals; {{controlComponentIdentityProvenance}},
        which verifies at invocation time that a caller is the currently registered
        principal for its role; and {{controlAgentCredentialIsolation}}, which scopes agent
        credentials to a tenant. It is also distinct from
        {{controlAuthenticationSchemeHardening}}, which governs which authentication schemes
        and credential types are acceptable under policy, while this control performs the
        federated authentication of the human user. Those controls assume a separate user-identity origin where
        a human initiates the request, which this control supplies. Where an agent acts on a user's behalf, the user identity established
        here is the authority that delegation controls such as {{controlAgentPluginPermissions}}
        narrow against. Showing that this control was enforced depends on the records described above being
        committed and retained under {{controlAuditTrailCompleteness}}.
    personas:
      - personaApplicationDeveloper
      - personaAgenticProvider
      - personaGovernance
    risks:
      - riskCredentialAndTokenTheft
    mappings:
      mitre-atlas:
        - AML.M0019@5.0.1
