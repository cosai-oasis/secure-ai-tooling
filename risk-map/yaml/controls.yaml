      - runtime
    impactType:
      - integrity
      - confidentiality
    actorAccess:
      - agent
      - service-provider
  - id: controlComponentIdentityAuthentication
    title: Component Identity Authentication
    description:
      - >
        Establish a distinct, authenticatable identity for each agent and each remote
        tool-serving endpoint, so that a principal acting in or on behalf of an AI system
        is authenticated before it is trusted and cannot be impersonated. The objective
        is a first-class identity primitive for non-human principals — not a shared, ambient,
        or network-address-derived identity — that downstream registry, integrity, and
        authorization controls can rely on.
      - >
        Issue a unique principal identifier per agent or tool endpoint rather than reusing
        a shared service account, and bind it to a verifiable authenticator — a workload
        credential, a signed identity document, or a client certificate — so a counterparty
        can confirm the principal before exchanging instructions or data. Authenticate
        at connection and invocation time rather than inferring identity from a hostname,
        port, or co-location. This applies equally to agent-to-tool, agent-to-agent, and
        orchestrator-to-agent paths, independent of wire protocol (for example MCP, A2A,
        or vendor SDKs) or deployment form (remote or locally exposed). A locally exposed
        tool server is not implicitly trusted for binding to localhost; it is authenticated
        like any other endpoint.
      - >
        This is the identity-establishment layer that several adjacent controls presuppose.
        It is distinct from {{controlAgentInventoryManagement}} (the lifecycle registry
        of which agents are authorized to exist), {{controlComponentIdentityProvenance}}
        (which verifies at invocation time that a caller is the currently registered,
        non-revoked principal for its role), {{controlAgentIntegrityManagement}} (which
        attests that a running agent matches its registered configuration), and {{controlAgentCredentialIsolation}}
        (which scopes issued credentials to a tenant): those answer whether a principal
        is registered, unmodified, and tenant-scoped, while this control establishes the
        authenticatable principal that makes those questions answerable. It is closest
        to {{controlComponentIdentityRegistration}}, which enrolls a component as a recognized,
        revocable client of the authorization server so that an authenticator can be issued
        to it — the issuance-side precondition. This control shares that establishment
        step but is distinguished by verification: it confirms the bound authenticator
        at connection time. The two hold independently — a principal can be authenticated
        against a trust anchor that never enrolled it as a client of any authorization
        server (for example an mTLS peer presenting a per-principal certificate chained
        to a trusted CA), and a registered component still presents an unverified credential
        until this control checks it at connect time. It is also distinct from {{controlInterComponentTransportSecurity}},
        which protects the channel —
        transport security can authenticate an endpoint key but does not establish that
        the endpoint is a distinct, named principal.
      - >
        Authentication strength and credential lifetime should be proportionate to the
        principal's authority and blast radius: higher-privilege agents and side-effecting
        tool endpoints warrant stronger authenticators and shorter-lived credentials,
        while low-impact, read-only endpoints may accept lighter-weight authentication.
        Implementers may satisfy the intent with SPIFFE/SVID workload identities, OAuth
        client-credential or token-exchange flows, mutual TLS with per-principal certificates,
        hardware-attested identities, or equivalent mechanisms; the control requires that
        a distinct principal be authenticated, not any particular cryptographic scheme.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaModelServing
      - personaGovernance
    components:
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
      - componentTools
      - componentModelServing
      - componentApplication
      - componentIdentityProvider
      - componentToolServer
    risks:
      - riskStaleAgentIdentityBinding
      - riskZombieShadowMCPServers
      - riskMCPTransportHijacking
      - riskAgenticDelegationConfusedDeputy
    mappings:
      nist-ai-rmf:
        - MEASURE-2.7@1.0
    lifecycleStage:
      - deployment
      - runtime
      - maintenance
    impactType:
      - integrity
      - confidentiality
      - accountability
    actorAccess:
      - external
      - agent
      - service-provider
  - id: controlDelegatedAuthorizationIntegrity
    title: Delegated Authorization Integrity
    category: controlsInfrastructure
    description:
      - >
        Ensure that when one component acts on behalf of another, the authority being
        exercised is carried by a verifiable delegated-authorization grant that names
        the original principal, is scoped to the requested action, and can be re-evaluated
        independently at each intermediary in the chain. The objective is an end-to-end
        authorization handoff whose provenance and scope are auditable across every hop,
        so an intermediary cannot silently broaden or impersonate the authority it was
        given.
      - >
        Favor a standards-based delegated-authorization framework (for example OAuth 2.0
        with token exchange, audience-restricted and short-lived access tokens, and fine-grained
        scopes) rather than forwarding a caller's raw credential or a static long-lived
        secret across intermediaries. Delegated grants should bind the acting party, the
        original principal, and the permitted scope so that each intermediary, including
        remote tooling and shared-service endpoints such as MCP or A2A tool servers, can
        validate the grant against its own policy point before honoring it. Where this
        control coordinates with a policy decision point, the delegated grant is the assertion
        that the policy enforcement point evaluates.
      - >
        This control addresses how authorization is delegated and carried end-to-end.
        It is distinct from {{controlAgentPluginPermissions}}, which bounds the effective
        authority of a delegated action to the intersection of the agent's and caller's
        permissions; from {{controlAgentCredentialIsolation}}, which keeps credentials
        within a tenant boundary; from {{controlInterComponentTransportSecurity}}, which
        protects the channel the grant rides over; and from {{controlComponentIdentityProvenance}},
        which attests that the callee is the registered principal. Those controls assume
        an authorization grant exists and is trustworthy; this control establishes the
        grant and its per-hop verifiability. See {{ref:rfc-8693-token-exchange}}, {{ref:rfc-6749-oauth2}},
        and {{ref:nist-sp-800-162-abac}}.
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
    risks:
      - riskAgenticDelegationConfusedDeputy
      - riskRogueActions
      - riskExcessiveDataHandling
    externalReferences:
      - id: rfc-8693-token-exchange
        title: RFC 8693 — OAuth 2.0 Token Exchange
        url: https://datatracker.ietf.org/doc/html/rfc8693
        type: spec
      - id: rfc-6749-oauth2
        title: RFC 6749 — The OAuth 2.0 Authorization Framework
        url: https://datatracker.ietf.org/doc/html/rfc6749
        type: spec
      - id: nist-sp-800-162-abac
        title: 'NIST SP 800-162: Guide to Attribute Based Access Control (ABAC) Definition
          and Considerations'
        url: https://csrc.nist.gov/pubs/sp/800/162/upd2/final
        type: spec
    actorAccess:
      - agent
      - service-provider
      - api
    impactType:
      - accountability
      - confidentiality
      - integrity
    lifecycleStage:
      - deployment
      - runtime
    components:
      - componentReasoningCore
      - componentApplication
      - componentToolServer
      - componentIdentityProvider
      - componentAuthorizationPolicyDecisionPoint
      - componentAuthorizationPolicyEnforcementPoint
      - componentFederationProxy
    mappings:
      nist-ai-rmf:
        - MEASURE-2.7@1.0
  - id: controlFederatedUserAuthentication
    title: Federated User Authentication
    category: controlsApplication
    description:
      - >
        Establish the identity of human users by delegating authentication to a trusted
        external identity provider using federated standards (for example OIDC, OAuth
        2.0, or SAML), rather than collecting, storing, and verifying user credentials
        within the AI application itself. The objective is to ground every user-initiated
        session in a verifiable identity issued by an authoritative provider, so that
        downstream authorization, delegation, and audit decisions have a trustworthy principal
        to act on. Delegating authentication to an established provider reduces the application's
        exposure to credential-handling weaknesses (credential storage, password reset
        flows, multi-factor enrollment) and lets the application inherit the provider's
        identity assurance and session-management posture.
      - >
        This control governs authentication of human users at the application boundary.
        It is distinct from {{controlApplicationAccessManagement}}, which governs authorization
        and resource governance once a principal is established — this control answers
        "who is the human user" while access management answers "what is this principal
        allowed to do." It is also distinct from the machine-to-machine identity controls
        {{controlComponentIdentityProvenance}} and {{controlAgentCredentialIsolation}},
        which authenticate non-human component and agent principals; those controls assume
        a separate user-identity origin where a human initiates the request, which this
        control supplies. Where an agent acts on a user's behalf, the user identity established
        here is the authority that delegation controls such as {{controlAgentPluginPermissions}}
        narrow against.
      - >
        The protocol used (OIDC, OAuth 2.0, SAML) and the deployment form (browser redirect,
        device-code flow, remote tooling such as MCP servers) are implementation attributes.
        Implementers should prefer an existing organizational or commercial identity provider
        over a bespoke authentication implementation, and should validate provider-issued
        tokens (signature, audience, expiry, issuer) on each session establishment so
        that a token issued for one application cannot be replayed against another.
    personas:
      - personaApplicationDeveloper
      - personaAgenticProvider
      - personaGovernance
    risks:
      - riskAgentIdentitySpoofing
    lifecycleStage:
      - deployment
      - runtime
    actorAccess:
      - external
      - user
    impactType:
      - confidentiality
      - accountability
    components:
      - componentApplication
      - componentApplicationInputHandling
      - componentIdentityProvider
    mappings:
      nist-ai-rmf:
        - MEASURE-2.7@1.0
  - id: controlComponentIdentityRegistration
    title: Component Identity Registration
    category: controlsApplication
    description:
      - >
        Ensure that each component participating in authenticated inter-component flows
        — agents, remote tool servers, and shared-service endpoints — is established as
        a recognized client identity with the authorization server before credentials
        are issued to it. The objective is that every machine principal calling or being
        called holds an identity the authorization server can name, authenticate, and
        revoke, rather than acting under ambient trust or a shared, unattributable credential.
      - >
        Registration binds a component to a distinct client identity at the identity provider,
        scoped to the component's role. Where a component cannot be enrolled ahead of
        time — for example a tool server discovered at runtime — a programmatic enrollment
        mechanism such as OAuth 2.0 Dynamic Client Registration ({{ref:rfc7591-dcr}})
        lets the component obtain its own credentials through a governed, attributable
        path instead of falling back to a static or shared secret.
      - >
        This control should follow least-privilege and zero-trust posture: a component's
        registered identity scopes the credentials it can be issued, and registration
        should be gated on the component first being authorized to exist (its inventory
        entry), so that an unregistered or decommissioned component cannot obtain a usable
        client identity.
      - >
        Boundary: this control governs how a component is enrolled as an authenticable
        client identity — the issuance side of authentication. It is distinct from {{controlAgentInventoryManagement}},
        which is the governance registry of what is authorized to exist (registration
        consumes that authority, it does not replace it); from {{controlComponentIdentityProvenance}},
        which verifies at invocation time that a caller is the currently registered, non-revoked
        principal (registration is what makes a principal registrable in the first place);
        from {{controlAgentCredentialIsolation}}, which scopes issued credentials to tenant
        boundaries; and from {{controlInterComponentTransportSecurity}}, which protects
        the channel those credentials travel over. Registration establishes the identity;
        those controls bound, attest, and transport it. It is closest to {{controlComponentIdentityAuthentication}}:
        registration is the enrollment that makes a component a known, revocable client
        the authorization server can issue an authenticator to, while that control verifies
        the bound authenticator at connection time and defines the identity primitive
        it verifies. The two hold independently — a component can be authenticated against
        a trust anchor it was never registered into (for example a per-principal certificate
        chained to a trusted CA), and a registered component's issued credential stays
        unverified at use until that control checks it.
    personas:
      - personaApplicationDeveloper
      - personaAgenticProvider
      - personaPlatformProvider
    risks:
      - riskAgentIdentitySpoofing
    mappings:
      nist-ai-rmf:
        - MEASURE-2.7@1.0
    lifecycleStage:
      - development
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
      - accountability
    actorAccess:
      - agent
      - service-provider
      - external
    externalReferences:
      - type: spec
        id: rfc7591-dcr
        title: 'RFC 7591: OAuth 2.0 Dynamic Client Registration Protocol'
        url: https://www.rfc-editor.org/rfc/rfc7591
    components:
      - componentReasoningCore
      - componentToolServer
      - componentTools
      - componentIdentityProvider
      - componentToolRegistry
  - id: controlDelegatedAuthorityConfinement
    title: Delegated Authority Confinement
    description:
      - >
        Ensure that authority propagating across a delegation chain is re-established
        at each hop for the specific party acting and the action requested, never by forwarding
        or reusing a token issued for an earlier hop. The objective is attributable, narrowable
        authority at every hop — authority minted for its own recipient and scoped to
        the intersection of the caller's authority and the requested action — so that
        a credential captured or over-scoped at one hop cannot be replayed to reach broader
        authority downstream, and each action can be attributed to the actor that took
        it rather than only to the original subject.
      - >
        Establish authority afresh at each hop — for example through OAuth 2.0 Token Exchange
        ({{ref:rfc-8693-token-exchange}}) or an on-behalf-of flow — bound to the current
        actor and audience-restricted to the intended recipient (RFC 8707 resource indicators),
        rather than presenting an inbound token unchanged to a downstream resource. The
        default posture is to reject token passthrough: a resource accepts only tokens
        issued specifically for it and neither honors nor forwards tokens minted for another
        audience. Carry original-caller and intermediate-actor identities forward as an
        actor chain so downstream policy and audit can attribute an action to the full
        delegation path rather than a single subject; because a compromised intermediary
        can truncate or misstate the chain it presents, have the terminal resource validate
        the chain against the expected delegation topology rather than trust a self-consistent
        chain at face value. Narrow scope and lifetime at each issuance to what the hop
        needs. Where no central authorization server is available, equivalent signed delegation
        assertions that bind actor, audience, scope, and chain position satisfy the intent.
      - >
        This control governs how authority propagates across hops. It is distinct from
        {{controlDelegatedAuthorizationIntegrity}}, which requires the delegated grant
        to be verifiable and independently re-evaluable at each intermediary: that control
        defines what a trustworthy grant looks like, while this one requires re-minting
        authority per hop rather than forwarding it. The two are independent — a system
        can re-mint at every hop yet issue tokens that name only the immediate caller
        and cannot be independently re-evaluated (satisfying this control but not that
        one), or forward a fully verifiable grant unchanged across hops (satisfying that
        control but not this one). It is distinct from {{controlSenderConstrainedCredentials}},
        which makes an individual credential hard to replay through proof-of-possession
        binding — a property of one token, whereas this control concerns the propagation
        discipline across the chain. It is further distinct from {{controlAgentPluginPermissions}},
        which bounds the action scope an actor may exercise once acting, and {{controlComponentIdentityProvenance}},
        which verifies a callee is the registered principal.
    category: controlsApplication
    personas:
      - personaAgenticProvider
      - personaPlatformProvider
      - personaApplicationDeveloper
      - personaGovernance
