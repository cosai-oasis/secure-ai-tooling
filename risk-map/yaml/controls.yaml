  - id: controlSenderConstrainedCredentials
    title: Sender-Constrained Credentials
    description:
      - >
        Bind credentials used for inter-component and tool authentication to their legitimate
        holder so that possession of a credential value alone is insufficient to authenticate.
        The objective is that the presenter must additionally prove control of a holder-bound
        key or context at use time.
      - >
        Implement this through proof-of-possession mechanisms such as DPoP-style application-layer
        binding ({{ref:rfc9449}}) and mutual-TLS-bound access tokens, and pair the binding
        with short credential lifetimes.
      - >
        This control is distinct from {{controlInterComponentTransportSecurity}}, which
        binds tokens to the TLS channel at the transport layer; sender-constrained credentials
        bind to a holder key independently of the channel, so the binding survives across
        hops and intermediaries. It is also distinct from {{controlAgentCredentialIsolation}},
        which scopes issuance and propagation to a tenant and governs which principals
        a credential is valid for; this control governs whether a presenter is the rightful
        holder.
    category: controlsApplication
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaModelServing
      - personaApplicationDeveloper
    components:
      - componentTools
      - componentModelServing
      - componentReasoningCore
      - componentOrchestrationInputHandling
      - componentIdentityProvider
    risks:
