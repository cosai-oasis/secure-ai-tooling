  - id: controlModelAndDataIntegrityManagement
    title: Model and Data Integrity Management
    description:
      - >
        Ensure that all data, models, and code used to produce AI models are verifiably
        integrity-protected during development and deployment.
    guidance:
      - >
        Implement repository trust policies, cryptographic signatures, attestation
        frameworks, and offline verification capabilities to ensure integrity
        and authenticity of models and artifacts.
      - >
        This control covers model, data, and training-code artifacts. It is distinct
        from {{controlToolServerSupplyChainIntegrity}}, which gates the acquisition,
        installation, and update of tool-server software, and from
        {{controlToolServerVetting}}, which decides whether a tool-server provider
        is trustworthy enough to admit. It is also distinct from
        {{controlModelAndDataExecutionIntegrity}}: this control protects artifacts
        through development and deployment (signing, attestation, repository trust)
        and produces the signatures and attestations that control checks, whereas
        that control verifies artifacts against known-good sources at inference or
        load time and governs controlled modification of the running system, including
        the signed-model check at load time.
    category: controlsInfrastructure
    personas:
      - personaModelProvider
      - personaDataProvider
      - personaModelServing
    components:
      - componentModelServing
      - componentModelEvaluation
      - componentModelTrainingTuning
      - componentModelStorage
      - componentModelRegistry
    risks:
      - riskAdapterPEFTInjection
      - riskCovertChannelsInModelOutputs
      - riskDataPoisoning
      - riskEvaluationBenchmarkManipulation
      - riskFederatedDistributedTrainingPrivacy
      - riskMaliciousLoaderDeserialization
      - riskModelSourceTampering
      - riskModelExfiltration
      - riskOrchestratorRouteHijacking
      - riskPromptResponseCachePoisoning
      - riskRetrievalVectorStorePoisoning
      - riskToolSourceProvenance
      - riskStaleAgentIdentityBinding
      - riskAgenticToolSupplyChain
    mappings:
      mitre-atlas:
        - AML.M0013@5.0.1
        - AML.M0014@5.0.1
      nist-ai-rmf:
        - MEASURE-2.3@1.0
    lifecycleStage:
      - data-preparation
      - model-training
      - deployment
      - runtime
    impactType:
      - integrity
      - accountability
    actorAccess:
      - supply-chain
      - privileged
      - infrastructure-provider
  - id: controlModelAndDataExecutionIntegrity
    title: Model and Data Execution Integrity
    description:
      - >
        Ensure that the code and model results from training and development are of known
        provenance and lineage and not modified from known-good sources in unexpected ways
        at inference time.
    guidance:
      - >
        Examples include:
      - - >
          Validating expected code and model signatures / hashes at inference-time, and
          recording each verify-pass or verify-fail and each load, allow, or deny decision
          with the artifact, the expected signature or hash relied on, the host, and the
          time.
        - >
          Limiting and immutably recording all modifications to runtime AI system components
          via oversight processes.
        - >
          Other integrity controls appropriate to the deployment context.
      - >
        This control verifies the model and code artifacts of a running AI system
        against known-good sources at inference or load time, and governs controlled
        modification of the running system. It owns the signed-model check at load
        time. It is distinct from {{controlModelAndDataIntegrityManagement}}, which
        protects artifacts through development and deployment (signing, attestation,
        repository trust) and produces the signatures and attestations this control
        checks. It is also distinct from {{controlToolServerSupplyChainIntegrity}},
        which gates the acquisition, installation, and update of tool-server software
        before it is deployed; this control does not cover the provenance of
        tool-server software. Showing that this control was enforced depends on the records
        described above being committed and retained under {{controlAuditTrailCompleteness}}.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
    components:
      - componentModelServing
      - componentModelStorage
      - componentTheModel
    risks:
      - riskAdapterPEFTInjection
      - riskModelDeploymentTampering
      - riskMaliciousLoaderDeserialization
      - riskModelSourceTampering
