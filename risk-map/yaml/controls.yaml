  - id: controlIsolatedConfidentialComputing
    title: Isolated and Confidential Computing
    description:
      - >
        Protect critical workloads and resources from host operators, infrastructure
        administrators, and co-tenants by admitting a workload only after its isolated
        environment is verified, and running it within hardware-enforced isolation
        boundaries or on physically isolated computing systems.
      - >
        This control governs hardware- and physical-layer isolation of the compute and
        memory that hold critical workloads, and the verification of that isolated
        environment before a workload is admitted to it.
    guidance:
      - >
        Examples include CPU and TPU-based confidential computing technologies
        (TEEs, secure enclaves), system isolation, secure scheduling, and side-channel
        monitoring to prevent cross-tenant information leakage.
      - Pair enclave/TEE isolation with remote attestation so that the isolated
        environment can be cryptographically verified before it is trusted.
        Attestation extends the protection beyond passive isolation to defend
        against compromised host hardware, malicious infrastructure administrators,
        and co-tenancy threats by proving that the workload is running in a genuine,
        unmodified isolated environment. Record each admission and verification outcome (admit
        or deny, verify-pass or verify-fail) with the workload, the attestation evidence and
        reference measurements or policy relied on, the host or enclave, and the time. For
        a physically isolated system, verification means confirming the system's identity
        and configuration against an approved baseline before the workload is placed on it.
      - "Account for the resulting trust boundary: when a workload runs in an enclave,
        the host system, host OS, firmware, and hypervisor lie outside that boundary,
        so privileged host-based software cannot directly read or modify the protected
        workload. Secrets and keys are released only into the verified isolated environment,
        so they are not exposed at rest on the host. An isolated or separate system bounds
        what code running inside it can reach on shared infrastructure, but does not sandbox
        that code within its own boundary. Isolation does not remove every path: side-channel leakage (see
        {{riskAcceleratorAndSystemSideChannels}}) and certain physical hardware attacks
        remain outside the enclave's mitigation and should be addressed by complementary
        controls."
      - >
        This control is distinct from {{controlRuntimeHostIsolation}}, which confines a
        running process with OS- and process-level isolation on a host it shares; this
        control places the workload beyond the reach of that host, including its privileged
        software. It is distinct from {{controlInboundNetworkExposureAndSegmentation}} and
        {{controlNetworkEgressControl}}, which constrain network reachability to and from a
        component rather than the isolation of its compute and memory. It is also distinct
        from {{controlInterComponentTransportSecurity}}, which authenticates, encrypts, and
        integrity-protects the channels between components; this control isolates the
        compute and memory that hold the workload and does not itself protect those channels.
        Showing that this control was enforced depends on the records described above being committed and
        retained under {{controlAuditTrailCompleteness}}.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    components:
