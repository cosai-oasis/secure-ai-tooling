        url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - id: controlAuditTrailCompleteness
    title: Audit Trail Completeness
    description:
      - >-
        Ensure that every record which should have entered the trail held in {{componentAuditRecordRepository}}
        did enter it and remains for as long as it should. A gap nothing reports is indistinguishable
        from an absence of activity and will be read as one. The objective is that absence becomes
        reportable; sequence numbers, heartbeats, and writer manifests are realizations of that
        signal, not the requirement.
      - >-
        **Verified commitment on the write path.** A record has entered the trail only when the
        repository has said so. The store authenticates itself as the write destination and returns
        an acknowledgement of durable commitment attributable to that identity, so a success response
        from an endpoint that cannot present the repository's identity is not a commitment. This
        raises the privilege required for write-path redirection, where an emitter's destination
        is reconfigured or impersonated so records are accepted and discarded: rewriting the destination
        address no longer suffices, though rewriting the emitter's trust anchors too still succeeds
        — a residual the continuity expectation below catches.
      - >-
        **A stated contract for failure and expiry.** For each class of event the store states
        what a failure to commit means — whether the recorded operation blocks until its record
        is durable, or proceeds with the failure recorded and alerted — and a minimum retention
        period, with capacity provisioned so ordinary volume does not consume it. NIST SP 800-53
        assigns the first to the organization under AU-5 and treats storage capacity as an obligation
        of the medium under AU-4 ({{ref:nist-sp-800-53r5}}). Where regulation sets that period
        it is a floor, not a target: the EU AI Act requires providers and deployers to keep logs
        under their control for at least six months ({{ref:eu-ai-act-2024}}). Within that floor,
        expiring or overwriting the oldest records is not an available response to pressure —
        AU-5 offers it as one, and it is exactly the mechanism an adversary uses to flood the
        store until records of interest age out. Exhaustion falls back to the stated commit posture;
        early expiry is an administrative action under {{controlAuditRecordRepositoryIndependence}}.
      - >-
        **A continuity expectation held across writers.** The store requires of each writer a
        signal from which continuity can be judged and holds that expectation itself, so a sequence
        break, an out-of-order arrival, or a writer gone quiet is reportable rather than a silent
        hole. This is the half of the trail no emitter can attest to: a writer terminated, silenced,
        or redirected cannot report its own absence, because from its own vantage point a suppressed
        emitter is indistinguishable from an idle one. The roster of expected writers is administrative
        state of the store, so roster changes fall under the self-recording property of {{controlAuditRecordRepositoryIndependence}};
        otherwise deregistering a writer silently retires its expectation. Where the writers are
        agents, the roster is reconciled against {{controlAgentInventoryManagement}}.
      - >-
        Neither {{controlInterComponentTransportSecurity}} nor {{controlComponentIdentityAuthentication}}
        supplies commitment: a channel can be perfectly protected, its peer properly identified
        as a caller, to an endpoint that discards what it receives. The emitter-side work of carrying
        a continuity signal sits with {{controlAIInfrastructureObservability}}, whose scope is
        per-request ordering rather than per-writer continuity, and {{controlAgentObservability}},
        which does not reach ordering at all; this control depends on neither widening.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaGovernance
    components:
      - componentAuditRecordRepository
    risks:
