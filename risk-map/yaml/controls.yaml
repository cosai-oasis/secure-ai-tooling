  - id: controlAgenticZeroTrustPosture
    title: Agentic Zero-Trust Posture
    description:
      - >
        Design agentic systems so that every component boundary — between orchestrator
        and agent, agent and tool server, tool server and downstream API — is treated
        as an explicit, verified trust boundary. No component may assume trust from co-location,
        adjacency, or prior authentication in a different segment. This posture, grounded
        in zero-trust architecture principles ({{ref:nist-sp-800-207}}), applies at design
        time to the system's trust topology; the individual mechanisms that enforce it
        at runtime (transport authentication, credential scoping, registry-bound identity)
        belong to the operational controls that implement it.
      - >
        The posture has three structural properties that must be present by design. First,
        explicit boundary verification: trust at each component boundary is asserted by
        a credential or attestation checked at call time against an authoritative registry
        or policy engine — not inferred from network position, localhost binding, or a
        certificate that proves only key possession. Second, assume-breach segmentation:
        the system is designed so that compromise of any one segment (an agent process,
        a tool server, the orchestration plane) cannot propagate laterally beyond that
        segment; segment boundaries are enforced by distinct identity domains, scoped
        credentials, and policy enforcement points that do not transit compromised segments.
        Third, defense-in-depth layering: multiple independent control layers (transport
        security, identity verification, permission narrowing, observability) are stacked
        so failure of any one layer is not a system-wide breach.
      - >
        This control addresses the architectural posture — the design decision about what
        the system's trust topology must be. It is distinct from the controls that implement
        individual layers of that posture: {{controlAgentPluginPermissions}} enforces
        least-privilege narrowing and caller-authorization checks at individual delegation
        hops; {{controlInterComponentTransportSecurity}} establishes authenticated, encrypted
        channels; {{controlComponentIdentityProvenance}} binds runtime identity to the
        authoritative registry at invocation time; {{controlAgentCredentialIsolation}}
        scopes credentials to tenant boundaries. Adopting this posture commits the organization
        to structuring those operational controls around an explicit trust topology rather
        than deploying them individually while leaving implicit trust gaps at co-located
        or adjacent components.
    category: controlsGovernance
    personas:
      - personaGovernance
      - personaAgenticProvider
      - personaPlatformProvider
    components:
      - componentReasoningCore
      - componentTools
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
      - componentModelServing
    risks:
      - riskAgenticDelegationConfusedDeputy
      - riskCrossTenantCredentialPropagation
      - riskShadowAndUnknownAgents
      - riskMCPTransportHijacking
      - riskInsecureIntegratedComponent
      - riskRogueActions
    mappings:
      mitre-atlas:
        - AML.M0028@5.0.1
      nist-ai-rmf:
        - GOVERN-1.2@1.0
        - MAP-1.5@1.0
    externalReferences:
      - type: spec
        id: nist-sp-800-207
        title: 'NIST Special Publication 800-207: Zero Trust Architecture'
        url: https://doi.org/10.6028/NIST.SP.800-207
  - id: controlAIInfrastructureObservability
    title: AI Infrastructure Observability
    description:
      - >
        Maintain centralized, tamper-evident telemetry across the AI system infrastructure
        — hosts, model-serving endpoints, API gateways, client connections, and orchestration
        transport paths — so that compliance obligations can be demonstrated and security
        incidents can be reconstructed after the fact.
      - >
        This control addresses the infrastructure and platform layer of observability:
        the log streams, distributed traces, and audit records produced by the components
        the AI system runs on and through. It is distinct from {{controlAgentObservability}},
        which addresses behavioral telemetry of individual agents — their actions, tool
        invocations, and reasoning. A system can have complete agent-level logs and still
        lack the infrastructure-layer evidence needed to answer whether a serving endpoint
        was substituted, which clients connected to a model gateway, or what network activity
        accompanied an incident.
      - >
        Effective implementation provides: structured, queryable log streams from serving
        infrastructure and host-level event sources; distributed trace correlation across
        request paths that cross component boundaries (gateways, load balancers, serving
        endpoints, application tiers); log retention policies calibrated to applicable
        compliance and forensic requirements; and integrity protections (write-once storage,
        cryptographic log chaining, or equivalent) that prevent after-the-fact alteration
        of audit records. The instrumentation should be sufficient to reconstruct the
        infrastructure-side sequence of events for any request that traversed the system.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaGovernance
    components:
      - componentModelServing
      - componentApplication
      - componentOrchestrationInputHandling
