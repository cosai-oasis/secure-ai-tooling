  - id: controlInformedAgentConsentSurface
    title: Informed Agent Consent Surface
    description:
      - >
        Ensure that a human-in-the-loop approval of a security-relevant agent or tool
        action is an informed decision: the approver both sees the decision-relevant
        facts and can act on them. Where a person is the authorising party, the consent
        surface renders what is being requested and its consequences completely and
        unambiguously, with no truncation, hidden content, or confusable characters left
        undisclosed; the approved action is the action executed.
      - >
        This control governs the quality of the agent consent surface — both the provenance
        content it renders and its intelligibility.
    guidance:
      - >
        Render the machine-resolved tool identity, registered origin or publisher, and
        the marshalled inputs at the approval point — not the tool's self-described label,
        which is the channel an attacker controls — so that a lookalike or shadowed tool
        is distinguishable before the action runs. This is the agentic analogue of anti-phishing
        origin display.
      - >
        Render the approval through a trusted path, so that what the approver sees is
        what is signed: present the complete, untruncated inputs, expose content that
        would otherwise be hidden or collapsed, and disclose confusable or non-printing
        characters rather than rendering them as look-alikes. Render the consequence of
        the action alongside its inputs, such as what data it alters, what it sends
        and to whom, and whether it can be undone, so the decision rests on effect and
        not only on a label. Record each approve or reject decision with the approving
        principal, the tool identity, inputs, and consequence as displayed, and the time.
      - >
        Approval should not degrade into a reflexive click-through. Keep the prompt
        intelligible and calibrate its salience and frequency to the risk
        of the action, so high-consequence requests stay distinguishable and do not lose
        effect through habituation (consent fatigue). Safe execution should not depend
        on the human absorbing every prompt. Whether an action needs approval at all,
        including whether routine, low-risk actions are batched, defaulted, or
        pre-approved by policy, is decided by {{controlAgentPluginUserControl}}; this
        control does not batch or default consent. When its surface is shown, it is shown
        in full.
      - >
        This control is distinct from {{controlAgentPluginUserControl}}, which governs
        whether human approval is required at all, and from {{controlUserTransparencyAndControls}},
        which governs general disclosure of AI risks and user control over data use; those
        establish that a gate exists, and whether it applies, while this ensures that when
        the gate is shown it presents a complete, intelligible, non-fatiguing,
        provenance-accurate decision. Showing that this control was enforced depends on the
        records described above being committed and retained under {{controlAuditTrailCompleteness}}.
