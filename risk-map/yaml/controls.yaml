  - id: controlAgenticZeroTrustPosture
    title: Agentic Zero-Trust Posture
    description:
      - >
        Design agentic systems to treat every component boundary — between orchestrator
        and agent, agent and tool server, tool server and downstream API — as an explicit,
        verified trust boundary. This posture, grounded in zero-trust
        architecture principles ({{ref:nist-sp-800-207}}), applies at design time to
        the system's trust topology: no implicit trust at any boundary, with trust
        established per boundary by verification. The posture comprises three structural
        properties, a decomposition specific to this framework, that must be present by
        design: explicit boundary verification, assume-breach segmentation, and
        defense-in-depth layering.
    guidance:
      - >
        **Explicit boundary verification:** Trust at each component boundary is
        established by verification, never assumed. No component assumes trust from
        co-location, adjacency, network position, localhost binding, prior authentication
        in a different segment, or a certificate that proves only key possession. How
        identity is checked at invocation is the concern of {{controlComponentIdentityProvenance}}.
      - >
        **Assume-breach segmentation:** The system is designed so that compromise of any
        one segment (an agent process, a tool server, the orchestration plane) cannot
        propagate laterally beyond that segment; segment boundaries are enforced by distinct
        identity domains, scoped credentials, and policy enforcement points that do not
        transit compromised segments.
      - >
        **Defense-in-depth layering:** Multiple independent control layers (transport
        security, identity verification, permission narrowing, observability) are stacked
        so failure of any one layer is not a system-wide breach.
      - >
        The individual mechanisms that enforce this posture at runtime (transport authentication,
        credential scoping, registry-bound identity) belong to the operational controls
        that implement it. This control addresses the architectural posture — the design
        decision about what the system's trust topology must be. It is distinct from
        the controls that implement individual layers of that posture: {{controlAgentPluginPermissions}}
        enforces least-privilege narrowing and caller-authorization checks at individual
        delegation hops; {{controlInterComponentTransportSecurity}} establishes authenticated,
        encrypted channels; {{controlComponentIdentityProvenance}} binds runtime identity
        to the authoritative registry at invocation time; {{controlAgentCredentialIsolation}}
        scopes credentials to tenant boundaries; and {{controlInboundNetworkExposureAndSegmentation}}
        and {{controlRuntimeHostIsolation}} enforce assume-breach segmentation at the network
        and host layers. Adopting this posture commits the organization
        to structuring those operational controls around an explicit trust topology rather
        than deploying them individually while leaving implicit trust gaps at co-located
        or adjacent components. The risks this control links are the ones the absence of
        this posture leaves structurally open; they are reduced when the operational
        controls named above are deployed.
    category: controlsGovernance
    personas:
      - personaGovernance
      - personaAgenticProvider
      - personaPlatformProvider
    components:
      - componentReasoningCore
      - componentTools
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
      - componentModelServing
    risks:
      - riskAgenticDelegationConfusedDeputy
      - riskCrossTenantCredentialPropagation
      - riskShadowAndUnknownAgents
      - riskMCPTransportHijacking
      - riskInsecureIntegratedComponent
      - riskRogueActions
    mappings:
      nist-ai-rmf:
        - GOVERN-1.2@1.0
    externalReferences:
      - type: spec
        id: nist-sp-800-207
        title: 'NIST Special Publication 800-207: Zero Trust Architecture'
        url: https://doi.org/10.6028/NIST.SP.800-207
  - id: controlAIInfrastructureObservability
    title: AI Infrastructure Observability
    description:
      - >
        Maintain tamper-evident telemetry across the AI system infrastructure as foundational
        evidence for compliance, security oversight, and forensic reconstruction.
      - >
        This control addresses the infrastructure and platform layer of observability:
        the log streams, distributed traces, and audit records produced by the components
        the AI system runs on and through.
    guidance:
      - >
        The infrastructure in scope includes hosts, model-serving endpoints, API gateways,
        client connections, and orchestration transport paths. The telemetry lets an
        organization demonstrate compliance obligations and reconstruct security incidents
        after the fact.
      - >
        Effective implementation provides: structured, queryable log streams from serving
        infrastructure and host-level event sources; distributed trace correlation across
        request paths that cross component boundaries (gateways, load balancers, serving
        endpoints, application tiers); log retention policies calibrated to applicable
        compliance and forensic requirements; and integrity protections (write-once storage,
        cryptographic log chaining, or equivalent) that make after-the-fact alteration
        of audit records evident. The instrumentation should be sufficient to reconstruct the
        infrastructure-side sequence of events for any request that traversed the system.
      - >
        Collection may be centralized, or distributed across stores where data scale or
        system segmentation makes a single repository impractical. Distributed stores share
        a common retention, integrity, and access-control policy, are monitored so that a
        source that stops reporting is detected, and can be queried together for correlation.
        The requirement is that the telemetry stay complete, correlatable, and tamper-evident,
        not that it follow a particular collection topology.
      - >
        This control is distinct from {{controlAgentObservability}}, which addresses
        behavioral telemetry of individual agents (actions, tool invocations, reasoning);
        complete agent-level logs do not answer whether a serving endpoint was substituted,
        which clients connected to a model gateway, or what network activity accompanied an
        incident. It is distinct from {{controlAuditTrailIntegrityVerification}}, which checks
        on a cadence, against an externally held reference, that the integrity structure of
        committed audit records still holds; this control requires the telemetry to carry that
        structure. It is distinct from {{controlAuditTrailCompleteness}}, which requires the
        audit record repository to hold a per-writer continuity expectation, so a sequence
        break, an out-of-order arrival, or a writer gone quiet is reportable and reported. This
        control's ordering is per-request, and its source monitoring for distributed
        collection is pipeline health: it detects that a telemetry source it collects from has
        stopped reporting. It does not judge whether an audit-record writer's records reached
        the repository; that is record continuity, judged against the repository's per-writer
        expectation. Where an audit writer is also a source this control collects from, both
        may fire on the same event, for different purposes. The writer emits the continuity
        signal under the control that owns it; this control emits it only for infrastructure
        sources it instruments. Requiring that signal and judging audit-record writer
        continuity against it is the repository's, and neither control depends on the other
        widening its scope.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaGovernance
    components:
      - componentModelServing
      - componentApplication
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
    risks:
