  - id: controlAIComponentPatchManagement
    title: AI Component Patch Management
    description:
      - >
        Maintain a tested, staged, and version-enforced update lifecycle for deployed
        AI-system components, including model serving infrastructure, orchestration frameworks,
        and remote tool servers such as MCP servers. Where {{controlVulnerabilityManagement}}
        identifies vulnerabilities in production, this control closes the detect-to-remediate
        loop by ensuring identified vulnerabilities result in applied patches rather than
        advisory notices.
      - >
        The discipline has two interdependent parts. Update management: validate fixes
        and version upgrades in a pre-production environment before promoting to production,
        and apply them through staged or canary rollouts so a regression introduced by
        a patch is contained before it propagates to the full deployment. Version enforcement:
        maintain a registry of deployed component versions — drawing on the inventory
        established by {{controlModelAndDataInventoryManagement}} and {{controlAgentInventoryManagement}}
        — and apply policies that block or quarantine instances running versions with
        documented vulnerabilities, so detection drives mandatory remediation within a
        defined response window rather than remaining advisory.
      - >
        This control applies to the AI-specific components classical patch-management
        processes often miss: MCP tool server instances managed outside conventional software
        asset management, model serving infrastructure deployed in cloud or container
        environments, and orchestration framework dependencies. Each can carry exploitable
        vulnerabilities that accumulate silently when no update-management process governs
        them.
      - >
        This control is the remediation counterpart to {{controlVulnerabilityManagement}}
        (detection and monitoring) and is distinct from {{controlIncidentResponseManagement}}
        (response to active incidents) and {{controlSecureByDefaultMLTooling}} (selecting
        secure-by-default tooling at initial deployment). Rollback of a faulty update
        during an active incident belongs to {{controlIncidentResponseManagement}}; the
        standing update cadence and version enforcement described here operate in normal
        operations.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaGovernance
