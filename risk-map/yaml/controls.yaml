  - id: controlToolServerVetting
    title: Tool Server Vetting and Approval
    category: controlsGovernance
    description:
      - >
        Ensure that remote and third-party tool servers are admitted to an agentic system
        only after passing a documented security review, so that the set of reachable
        tool providers reflects an explicit vetting decision rather than ad-hoc discovery.
        This is the pre-admission gate: a candidate tool server (an MCP, A2A, or other
        remote-tooling endpoint) is assessed against the organization's security criteria
        and the review outcome is recorded before the server becomes invocable, consistent
        with {{ref:mcp-security-best-practices}}.
      - >
        Vetting criteria typically cover the provider's ownership, provenance, and supplier-trust
        chain — including a preference for first-party, provider-hosted endpoints over
        unaffiliated third parties — the declared tool surface and its side effects, authentication
        posture, and known-vulnerability history; the depth of review scales with the
        server's privilege and blast radius. Enterprise deployments may operationalize
        the approved set through managed configuration so clients reach only servers that
        cleared review; centralizing the approved set is an implementation convenience,
        not the objective — the load-bearing element is the documented review gate.
      - >
        This is the supplier-vetting equivalent of classical third-party vendor security
        assessment applied to the tool-provider supply chain. It is distinct from {{controlThirdPartyCapabilityAdmission}},
        which admits and re-approves the capability SET (including prompt capabilities)
        a vetted provider exposes — this control vets whether the provider/server is trustworthy
        at all. It is distinct from {{controlToolServerSupplyChainIntegrity}} (provenance
        of the server SOFTWARE package), {{controlAgentInventoryManagement}} (the runtime
        registry that records the admission decision), {{controlModelAndDataIntegrityManagement}}
        (artifact tamper-verification), {{controlComponentIdentityProvenance}} (invocation-time
        attestation that a caller is the registered principal), and {{controlToolRegistryAndDiscoveryIntegrity}}
        (integrity-protection of registered tool manifests and metadata — vetting decides
        whether a provider earns registration; that control protects the registry entry's
        integrity thereafter).
    personas:
      - personaGovernance
      - personaApplicationDeveloper
      - personaAgenticProvider
      - personaPlatformProvider
    components:
      - componentToolServer
      - componentToolRegistry
    risks:
      - riskInsecureIntegratedComponent
