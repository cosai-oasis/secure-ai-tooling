  - id: controlSessionCredentialBindingAndLifecycle
    title: Session and Credential Binding
    category: controlsInfrastructure
    description:
      - >
        Reduce the value of a stolen authentication token or session identifier by constraining
        who can use it, where, and for how long, so that interception of a credential
        does not by itself yield a usable impersonation. This is the identity- and credential-layer
        concern from {{ref:cosai-agentic-identity}}: it governs how the credential itself
        is shaped, distinct from how the channel carrying it is secured.
      - >
        The objective is that a credential observed by an attacker is not independently
        replayable indefinitely. Approaches that satisfy this intent include: audience-bound
        tokens scoped to their intended recipient, so a credential issued for one endpoint
        cannot be replayed against another; short credential and session lifetimes scoped
        to a single task, request, or session; rotation of session identifiers on privilege
        or context change; and prompt revocation and session invalidation when reuse from
        an unexpected origin, device, or concurrent session is detected. Where a credential
        must additionally resist replay by a party other than its rightful holder — not
        merely its intended audience — {{controlSenderConstrainedCredentials}} supplies
        the proof-of-possession / holder-of-key binding primitive; this control is the
        surrounding lifecycle discipline within which that holder-binding is one input,
        alongside audience scoping, lifetime, rotation, and revocation. The control is
        mechanism-agnostic — implementers may use OAuth audience restriction, rotating
        session identifiers, sender-constrained tokens, or other approaches that achieve
        the same property.
      - >
        This control applies wherever agents, remote tools, and shared services authenticate
        to one another, including locally-exposed tool-server endpoints that are sometimes
        treated as implicitly trusted. The remote-tooling protocol in use (for example
        MCP or other agent-to-tool protocols) is an attribute of the deployment, not the
        locus of the control.
      - >
        This control is distinct from adjacent controls along clear boundaries. {{controlInterComponentTransportSecurity}}
        secures the channel a credential travels over — including channel binding and
        message-level replay protection for inter-component messages — whereas this control
        shapes the credential so it remains unusable to a third party even off that channel.
        {{controlAgentCredentialIsolation}} governs tenant scoping of agent credentials
        (are they structurally confined to one tenant?), whereas this control governs
        reuse resistance regardless of tenancy. {{controlApplicationAccessManagement}}
        governs whether an authenticated principal is authorized for an action, whereas
        this control governs whether a presented credential genuinely belongs to its claimed
        holder. {{controlDelegatedAuthorityConfinement}} governs authority re-minting
        across delegation hops — that authority is issued afresh for each hop's recipient
        rather than forwarded unchanged — whereas this control governs the binding and
        lifetime of a credential or session regardless of whether delegation is involved;
        a chain can re-mint authority at every hop yet still issue long-lived, unbound
        tokens at each hop, or a single non-delegated credential can be bound, short-lived,
        and rotated with no hop-to-hop propagation in play. {{controlSenderConstrainedCredentials}}
        supplies the specific proof-of-possession / holder-of-key mechanism that makes
        one credential resistant to replay by a non-holder, whereas this control is the
        broader session and credential lifecycle discipline — audience-binding, short
        lifetimes, rotation, and anomaly-triggered revocation — within which holder-binding
        is one input rather than a restatement; a deployment can adopt sender-constrained
        tokens without ever rotating or revoking them, or rotate and time-box its credentials
        without proof-of-possession binding.
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    risks:
      - riskCredentialAndTokenTheft
      - riskLongLivedSessionStateWeakness
    externalReferences:
      - id: cosai-agentic-identity
        title: 'CoSAI: Agentic Identity and Access Control'
        url: https://github.com/cosai-oasis/ws3-secure-design-patterns
        type: spec
    actorAccess:
