  - id: controlResourceAuthorizationEnforcement
    title: Resource Authorization Enforcement
    description:
      - >
        Ensure that every request to read or act on a protected resource is enforced
        against the requesting principal's verified identity and role at an explicit
        policy enforcement point. Enforcement for each object, tool, and data resource is
        consistent — regardless of whether the caller is a user, a service, or an agent —
        limiting each principal to the resources its role and context entitle it to.
    guidance:
      - >
        Evaluate authorization per resource instance, not merely per endpoint or resource
        type, so a valid identity for one object does not confer access to sibling objects of
        the same type (the classical broken-object-level-authorization, or BOLA, failure).
        Follow least-privilege and privilege-separation so the permission scope granted to a
        service or tool integration is the minimum its function requires.
      - >
        Enforcement points at the resource boundary admit or deny each call by checking it
        against the authorization decision supplied to them (the PDP output in
        {{ref:nist-sp-800-162-abac}}), not the calling service's discretion. Record each
        admit or deny decision with the principal, specific resource instance and action,
        policy decision relied on, and the time.
      - >
        Remote tooling and shared-service integrations (MCP tool servers, plugin backends,
        orchestration endpoints) are in scope: grant each narrow, resource-scoped permissions
        enforced on every call, not broad ambient authority. Agent-initiated calls are the
        agent case of this same per-object enforcement.
      - >
        This control governs per-object authorization enforcement at the resource. It depends
        on {{controlExternalizedAuthorizationDecisioning}}, which supplies the externalized
        policy decision its enforcement points consult; it does not itself require that
        decision to be externalized, administered, or evaluated (decision vs enforcement). It
        is distinct from {{controlTrustedPolicyEnforcementPoint}}, which requires the decision
        point and the enforcement point both to live in components the model cannot
        influence. It is distinct from {{controlApplicationAccessManagement}} (coarse identity
        gating + quotas), {{controlAgentPluginPermissions}} (which tools/actions an agent may
        invoke), {{controlAgentCredentialIsolation}} (tenant scoping), and
        {{controlComponentIdentityProvenance}} (who the principal is); those establish
        identity and coarse gating, while this control decides whether the established
        principal may reach the specific resource instance. It is also distinct from
        {{controlAuditRecordRepositoryIndependence}}, which separates append, read, and delete
        authority over the audit record, places the store's administrative plane outside the
        recorded trust domain, and has that plane record its own administrative actions; the
        least-privilege and privilege-separation here bound permission scope at application
        resources, not authority over the audit record's storage. Showing that this control
        was enforced depends on its decision records being committed and retained under
        {{controlAuditTrailCompleteness}}.
    category: controlsApplication
    personas:
      - personaApplicationDeveloper
