  - id: controlAIComponentPatchManagement
    title: AI Component Patch Management
    description:
      - >
        Maintain a tested, staged, and version-tracked update lifecycle for deployed
        AI-system components, including model serving infrastructure, orchestration frameworks,
        and remote tool servers, with enforcement on escalation. The discipline has two
        interdependent parts: update management and version enforcement.
    guidance:
      - >
        **Update management:** validate fixes and upgrades in pre-production before
        promotion, and roll them out in stages or canaries so a patch regression is contained
        before it reaches the full deployment.
      - >
        **Version enforcement:** maintain a registry of deployed component versions, drawing
        on the inventory established by {{controlModelAndDataInventoryManagement}} and
        {{controlAgentInventoryManagement}}, and remediate documented vulnerabilities on
        risk-tiered timelines, with severity, exploitability, and exposure setting the
        deadline, consistent with {{ref:nist-sp-800-40r4}}. Blocking or quarantining instances
        still running a vulnerable version is the escalation when a timeline is missed or the
        vulnerability is actively exploited, so detection drives mandatory remediation, not
        advisory notices. Record each remediate, escalate, block or quarantine decision with
        the instance, version, vulnerability and tier, deadline relied on, and time.
      - >
        This control applies to AI-specific components classical patch management often
        misses: MCP tool server instances outside conventional software asset management,
        model serving infrastructure in cloud or container environments, and orchestration
        framework dependencies, whose exploitable vulnerabilities accumulate silently without
        an update process.
      - >
        This control is the remediation counterpart to {{controlVulnerabilityManagement}},
        which identifies and monitors vulnerabilities in production; this control closes the
        detect-to-remediate loop. It is distinct from {{controlIncidentResponseManagement}}
        (response to active incidents, including rollback of a faulty update during one) and
        {{controlSecureByDefaultMLTooling}} (selecting secure-by-default tooling at initial
        deployment); the standing update cadence here operates in normal operations. Showing
        that this control was enforced depends on the records described above being committed
        and retained under {{controlAuditTrailCompleteness}}.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaGovernance
    components:
      - componentModelServing
      - componentTools
      - componentOrchestrationInputHandling
      - componentOrchestrationOutputHandling
    risks:
      - riskInsecureIntegratedComponent
    externalReferences:
      - id: nist-sp-800-40r4
        title: 'NIST SP 800-40 Rev. 4: Guide to Enterprise Patch Management Planning:
          Preventive Maintenance for Technology'
        url: https://csrc.nist.gov/pubs/sp/800/40/r4/final
        type: spec
    mappings:
      nist-ai-rmf:
