  - id: controlMessageAndPayloadResourceLimits
    title: Message and Payload Resource Limits
    description:
      - >
        Bound the size and structural complexity of individual protocol messages, ensuring that
        no single message or stream can exhaust compute, memory, or bandwidth on a receiving
        component. This control governs per-message resource ceilings on the wire — maximum
        payload size ({{ref:cwe-400}}), maximum nesting and recursion depth ({{ref:cwe-674}})
        for structured payloads, and decompression-ratio limits ({{ref:cwe-409}}).
    guidance:
      - >
        Implementers can reject or truncate messages above a configured size before full
        buffering, cap deserialization nesting and recursion depth, and bound decompression
        ratios. Where a protocol or framework ships without such ceilings, AI systems should
        set them explicitly rather than rely on defaults, since agent and remote-tooling
        protocols frequently expose endpoints (including locally-exposed tool servers) that
        lack the hardened defaults of mature web stacks. Record each message rejected or
        truncated at a ceiling with the sender, the receiving component, the limit exceeded,
        and the time.
      - >
        These ceilings apply across all inter-component and remote-tooling channels (for
        example agent-to-tool, orchestration, model-serving).
      - >
        This control is distinct from {{controlApplicationAccessManagement}}, which governs
        how often a caller may issue requests (rate limiting, quotas), and
        {{controlAgentExecutionBounds}}, which caps agent reasoning and tool-call loops. It is
        distinct from {{controlInterComponentTransportSecurity}}, which authenticates and
        encrypts the channel but does not bound the work a well-formed message imposes. Rate
        limits restrain request frequency; these limits restrain the cost of any one message,
        including the first. Showing that this control was enforced depends on the records
        described above being committed and retained under {{controlAuditTrailCompleteness}}.
    category: controlsInfrastructure
    personas:
