  - id: controlThirdPartyCapabilityAdmission
    title: Third-Party Capability Admission Control
    description:
      - >
        Ensure that the third-party tools, prompts, and instruction templates an agent
        acquires (its capabilities) are admitted against an approval policy before first use
        and re-approved before a material change takes effect. The objective is
        capability-set-level admission: a capability offered through runtime discovery
        executes only after a current approval gate, and one delivered by any other route is
        covered by the approval policy alone.
    guidance:
      - >
        **Admission:** Favor a documented approval gate proportionate to the capability's
        privilege and blast radius: confirm the providing server has cleared
        {{controlToolServerVetting}}, and pin each approved capability to a reviewed version,
        recorded as its identity plus a digest over its description, input and output schema
        and declared metadata as reviewed, so the pin can be checked at runtime. Record each
        approve, reject, and re-approval decision with the capability identity and digest,
        the providing server, the approving principal, the review evidence, and the time.
      - >
        **Re-approval on material change:** Trigger re-approval on description, schema,
        permission, or version change, and route capability-set changes through a reviewable
        path, not runtime self-assertion. A change offered at runtime outside that path is
        caught by the pin check at the negotiation handshake and returned here.
      - >
        This control addresses dependency-and-update ("rug-pull") compromise, where a
        capability benign at adoption is later swapped, re-versioned, or allowed to redefine
        its own description, prompts and instruction templates included. The pin detects
        changes to description, schema and declared metadata; a behavior change behind an
        unchanged description is addressed by the re-review under {{controlToolServerVetting}}.
      - >
        This control owns onboarding admission, pinning, and re-approval of the capability
        set. It is distinct from {{controlToolServerVetting}}, which judges the
        provider/server; {{controlToolServerSupplyChainIntegrity}}, which provenance-verifies
        tool-server software the organization acquires and runs and owns the integrity of its
        updates, while this control owns the review path for capability-set changes; and
        {{controlToolRegistryAndDiscoveryIntegrity}}, which integrity-protects registered tool
        manifests and metadata and detects changes to them. A detected change to registered
        metadata, or a pin mismatch at a handshake, triggers this control's re-approval, and
        this control decides whether the changed capability may execute. It is distinct from
        {{controlAgentCapabilityNegotiation}}, which enforces the approved pin at each runtime
        handshake (comparing identity and digest, withholding a mismatch, triggering
        re-approval here); this control admits, pins, and re-approves what that enforcement
        point checks. Showing that this control was enforced depends on the records described
        above being committed and retained under {{controlAuditTrailCompleteness}}.
    category: controlsInfrastructure
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaGovernance
