  - id: controlInboundNetworkExposureAndSegmentation
    title: Inbound Network Exposure and Segmentation
    description:
      - >
        Constrain the INBOUND network reachability of AI-system services so that each
        service is exposed only to the callers that require it. Bind services to the narrowest
        interface that satisfies their role — a loopback or explicit internal interface
        rather than all interfaces — and place them behind network segmentation boundaries
        that scope reachability to authorized peers.
      - >
        Apply this at the host and network layer: secure-by-default listening interfaces
        for locally-run tool servers and sidecars so they are not reachable from the broader
        network by default; segmentation between tenant, trust, and environment boundaries
        so a compromised service cannot reach unrelated services; and default-deny inbound
        with allowlisted ingress and denied lateral paths, consistent with a zero-trust
        posture. Treat exposure as a deliberate, reviewable configuration decision rather
        than a default.
      - >
        This control governs inbound exposure and the segmentation around it. It is distinct
        from {{controlNetworkEgressControl}}, which governs OUTBOUND reachability (egress
        filtering against data exfiltration and command-and-control) — this control governs
        who may reach a service, that control governs where a component may send. It is
        distinct from {{controlInterComponentTransportSecurity}}, which secures and authenticates
        the channel once a connection is permitted (TLS/mTLS, origin validation, DNS-rebinding
        defense); that control assumes a connection has reached the service, while this
        control governs whether it should have been reachable at all. It is distinct from
        {{controlIsolatedConfidentialComputing}} (hardware-layer compute/memory isolation),
        {{controlSecureByDefaultMLTooling}} (secure defaults of tooling generally — this
        is the network-exposure slice), and {{controlModelAndDataAccessControls}} (identity-scoped
        asset access, not network reachability).
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
