        url: https://www.rfc-editor.org/rfc/rfc9449
  - id: controlExternalizedAuthorizationDecisioning
    title: Externalized Authorization Decisioning
    description:
      - >
        Ensure that authorization decisions are made by a policy decision point that is
        separated from the points that enforce them, so that what an agent, tool, or service
        is allowed to do is governed by an explicit, administrable policy rather than
        by logic embedded ad hoc in each enforcement site. Decisions are evaluated per
        request at the granularity of the specific resource and parameters requested —
        not at coarse session scope. Decoupling decision from enforcement keeps authorization
        consistent and auditable across delegation hops, tool invocations, and service-to-service
        calls as the set of agents and tools changes at runtime.
      - >
        Implementation centers on three roles from the {{ref:nist-sp-800-162-abac}} /
        {{ref:nist-sp-800-207-zero-trust}} reference model: a policy administration point
        where rules are authored and versioned as data; a policy decision point that evaluates
        each request against those rules and the relevant request context (caller identity,
        delegated authority, resource, action, and requested parameters — for example
        expressed as Rich Authorization Requests, RFC 9396); and policy enforcement points
        co-located with each resource that consult the decision point before allowing
        an action. Expressing policy in a dedicated authorization policy language keeps
        rules reviewable and testable independently of application code.
      - >
        This control is mechanism-agnostic. Implementers may use a general-purpose policy
        engine, a relationship- or attribute-based authorization service, or capability-token
        issuance gated on policy state, provided the decision is externalized from the
        enforcement site and driven by administrable policy. Where the decision point
        is operated centrally, that centralization is an availability and blast-radius
        trade-off to manage, not the control objective itself.
      - >
        This control governs how the authorization decision is made and administered.
        It is distinct from {{controlResourceAuthorizationEnforcement}}, which enforces
        that decision per object at the resource boundary — this control supplies the
        externalized decision those enforcement points consult (decision vs enforcement);
        and from {{controlTrustedPolicyEnforcementPoint}}, which requires the decider
        be a deterministic component the model cannot influence. It is distinct from {{controlAgentPluginPermissions}}
        (the least-privilege policy content this control externalizes), {{controlApplicationAccessManagement}}
        (identity and coarse enforcement at the application boundary), and {{controlComponentIdentityProvenance}}
        (which establishes which principal is calling while this control decides what
        it may do).
    category: controlsApplication
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaGovernance
    components:
      - componentOrchestrationInputHandling
      - componentTools
      - componentApplication
      - componentAuthorizationPolicyDecisionPoint
      - componentAuthorizationPolicyEnforcementPoint
