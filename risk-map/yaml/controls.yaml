  - id: controlSecretsAndKeyManagement
    title: Secrets and Key Management
    description:
      - >
        Ensure that secrets and cryptographic key material held by AI system components
        — API keys, downstream service credentials, signing and encryption keys, and access
        tokens — are stored, brokered, and rotated through a dedicated secrets-management
        capability rather than embedded in component configuration, source, or environment.
      - >
        This control addresses the custody and lifecycle of secret material, which is
        acutely exposed in agentic and remote-tooling deployments: orchestrators and tool
        servers (for example MCP or A2A tool endpoints) accumulate credentials for many
        downstream services and broker them across delegation hops, so a single mishandled
        secret has a large blast radius.
      - >
        Centralized custody: Hold secrets in a dedicated secret store or key-management
        service rather than in plaintext configuration, container images, source repositories,
        environment variables, or memory dumps. Where a shared secret store serves multiple
        principals or agents, scope retrieval so that one principal cannot read another's
        secrets.  Scoped, short-lived credentials: Prefer narrowly-scoped, short-lived
        credentials that are issued per task or session, so that captured secrets expire
        quickly and cannot be reused beyond their intended scope. This governs how secrets
        are issued and held to bound their at-rest scope and lifetime; the complementary
        presentation-time reuse-resistance — proof-of-possession or sender-constraint,
        and session-level anti-replay — is addressed by {{controlSenderConstrainedCredentials}}
        and {{controlSessionCredentialBindingAndLifecycle}}.  Encryption of key material:
        Protect stored keys with envelope encryption or hardware-backed key protection,
        and separate key-encrypting keys from the data they protect.  Rotation and revocation:
        Support automated rotation on a defined cadence and immediate revocation on suspected
        compromise or component decommission, without requiring redeployment of the holding
        component.  Classification-driven handling: Classify the secret and data material
        a component holds so that storage, encryption, and access decisions can be driven
        by sensitivity rather than applied uniformly.
      - >
        This control governs the secret and key material a component holds at rest. It
        is distinct from {{controlInterComponentTransportSecurity}}, which protects credentials
        in transit on the channel; from {{controlAgentCredentialIsolation}}, which governs
        whether issued agent credentials stay within tenant boundaries during delegation;
        and from {{controlModelAndDataAccessControls}}, which governs who may access models
        and datasets. Those controls assume secrets are well-custodied; this control establishes
        that custody.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    components:
