  - id: controlExternalizedAuthorizationDecisioning
    title: Externalized Authorization Decisioning
    description:
      - >
        Ensure that authorization decisions are made by a policy decision point separated
        from the points that enforce them, placing what an agent, tool, or service is allowed
        to do under an explicit, administrable policy. Decisions are evaluated per request at
        the granularity of the specific resource and parameters requested.
      - >
        This control governs how the authorization decision is made and administered.
    guidance:
      - >
        Implementation centers on three roles from the {{ref:nist-sp-800-162-abac}} /
        {{ref:nist-sp-800-207-zero-trust}} reference model: a policy administration point
        where rules are authored and versioned as data; a policy decision point that evaluates
        each request against those rules and its context (caller identity, delegated
        authority, resource, action, and requested parameters — for example as Rich
        Authorization Requests ({{ref:rfc-9396-rar}})); and policy enforcement points
        co-located with each resource that consult the decision point before allowing an
        action. Evaluate per request, not at coarse session scope. A dedicated policy language
        keeps rules reviewable and testable independently of application code. Record each
        permit or deny decision with the caller, resource and action, request context and
        policy version relied on, and the time.
      - >
        Any mechanism qualifies (a general-purpose policy engine, a relationship- or
        attribute-based authorization service, or capability-token issuance gated on policy
        state), provided the decision is externalized from the enforcement site and driven by
        administrable policy, not logic embedded in each site. Central operation of the
        decision point is an availability and blast-radius trade-off, not the objective.
      - >
        Decoupling decision from enforcement keeps authorization consistent across delegation
        hops, tool invocations, and service-to-service calls as agents and tools change, and
        the recorded decisions make it auditable.
      - >
        This control is distinct from {{controlResourceAuthorizationEnforcement}}, which
        enforces the decision per object at the resource boundary (this control supplies the
        externalized decision those enforcement points consult; decision vs enforcement); and
        from {{controlTrustedPolicyEnforcementPoint}}, which constrains the locus of both
        roles: decision point and enforcement point each sit in trusted, deterministic
        components outside the model's influence. It is distinct from
        {{controlAgentPluginPermissions}} (the least-privilege policy content this control
        externalizes), {{controlApplicationAccessManagement}} (identity and coarse enforcement
        at the application boundary), and {{controlComponentIdentityProvenance}} (which
        establishes which principal is calling, while this control decides what it may do).
        Showing that this control was enforced depends on the records described above being
        committed and retained under {{controlAuditTrailCompleteness}}.
    category: controlsApplication
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaGovernance
    components:
