  - id: controlToolServerVetting
    title: Tool Server Vetting and Approval
    category: controlsGovernance
    description:
      - >
        Ensure that remote and third-party tool servers are admitted to an agentic system
        only after passing a documented security review, ensuring that the set of reachable
        tool providers reflects a current, explicit vetting decision.
    guidance:
      - >
        This control is the admission gate: a candidate tool server (an MCP, A2A,
        or other remote-tooling endpoint) is assessed against the organization's security
        criteria and the review outcome (admit, deny, or withdraw), including the publisher
        identity approved for the server, the criteria and evidence relied on, the reviewing
        principal, and the time, is recorded before the server becomes invocable,
        consistent with {{ref:mcp-security-best-practices}}. This admission record is the
        authoritative record of the approved publisher identity; downstream checks verify
        against it.
      - >
        Vetting criteria typically cover the provider's ownership, provenance, and supplier-trust
        chain — including a preference for first-party, provider-hosted endpoints over
        unaffiliated third parties — the declared tool surface and its side effects, authentication
        posture, and known-vulnerability history; the depth of review scales with the
        server's privilege and blast radius. Enterprise deployments may operationalize
        the approved set through managed configuration, centralized or distributed, that
        limits client access to only servers that cleared the enterprise review process;
        the documented review gate, not the configuration mechanism, is the objective.
      - >
        An admission decision is not permanent. Re-review an admitted server periodically
        and on trigger events such as a change of provider ownership, newly disclosed
        vulnerability history, or a lapse in supplier trust, and withdraw admission where
        the server no longer meets the criteria.
      - >
        This control is the supplier-vetting equivalent of classical third-party vendor
        security assessment (the supply chain risk management family, SR, of
        {{ref:nist-sp-800-53r5}}) applied to the tool-provider supply chain.
      - >
        This control is distinct from {{controlThirdPartyCapabilityAdmission}}, which
        admits and re-approves the capability set (including prompt capabilities) a
        vetted provider exposes — this control vets whether the provider/server is trustworthy
        at all. Its re-review is the only check that catches a behavior change behind a
        byte-identical capability description, which the pin check at the
        {{controlAgentCapabilityNegotiation}} handshake and the pin under
        {{controlThirdPartyCapabilityAdmission}} cannot see. It is distinct from
        {{controlToolServerSupplyChainIntegrity}} (provenance of the server software package
        where the organization acquires and runs it, which it verifies against the publisher
        identity approved here; for a remote server the organization does not host, assurance
        comes from this control's admission and the pin under
        {{controlThirdPartyCapabilityAdmission}}, and that control does not apply),
        {{controlAgentInventoryManagement}} (the lifecycle authority over which endpoints may
        exist, not the record of the approved publisher identity),
        {{controlModelAndDataIntegrityManagement}}
        (tamper-verification of model, data, and training-code artifacts), {{controlComponentIdentityProvenance}} (invocation-time
        attestation that a caller is the registered principal), and {{controlToolRegistryAndDiscoveryIntegrity}}
        (integrity-protection of registered tool manifests and metadata — vetting decides
        whether a provider earns registration; that control protects the registry entry's
        integrity thereafter). Showing that this control was enforced depends on the records described above
        being committed and retained under {{controlAuditTrailCompleteness}}.
    personas:
      - personaGovernance
      - personaApplicationDeveloper
      - personaAgenticProvider
      - personaPlatformProvider
