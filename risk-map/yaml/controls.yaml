  - id: controlAuditTrailIntegrityVerification
    title: Audit Trail Integrity Verification
    description:
      - >-
        Protect the integrity of records committed to the trail in
        {{componentAuditRecordRepository}} for as long as they are retained, ensuring that
        unauthorized modification or deletion of a committed record is detected, with detection
        bounded by the externally held reference point the trail is verified against. This control has
        two parts: a tamper-evident record structure, and independent verification of that structure
        on a defined cadence.
    guidance:
      - >-
        **Tamper-evident record structure.** Records are held so that altering or removing one after
        the fact leaves a discrepancy a reader can find: write-once media, cryptographic chaining of
        each record to its predecessors, or an equivalent binding a later edit cannot silently
        satisfy. The cryptographic form is AU-9(3) ({{ref:nist-sp-800-53r5}}).
      - >-
        **Independent verification on a cadence.** A verifier that does not run under the authority
        of the recorded workloads checks the structure on a defined schedule, not only during an
        investigation, and a verification failure raises an alert on the same path as a security
        incident. A principal holding full authority over the store can rewrite the trail and its
        structure together into a self-consistent whole, so the verifier checks against a reference
        point held outside that authority and committed to periodically; this bounds how far back
        such a rewrite can reach undetected. Publishing a hash-chain head or Merkle tree root to an
        independent witness is the common realization; an independently retained copy or an outside
        countersignature serves the same purpose for a trail structured otherwise.
      - >-
        Detectability is not detection — an integrity structure nothing verifies produces no
        evidence, and a flat log file offers nothing to verify at all.
      - >-
        The tamper-evident structure restates for the repository the requirement
        {{controlAIInfrastructureObservability}} places on the telemetry it covers. The restatement
        is deliberate: a verification obligation needs a stated object, and this control adds the
        verification that requirement lacks. This control and {{controlAuditTrailCompleteness}}
        divide the trail's failure modes: records altered or deleted while they were durable, detected
        against the witnessed structure, and records that never became durable or were lost to a
        retention or expiry failure. Removal of a committed record before its minimum retention,
        including through an unauthorized change to the retention schedule, is detected as
        deletion of a committed record under this control. It differs from
        {{controlAuditRecordRepositoryIndependence}}: independence determines who could have
        rewritten the trail, this control whether anyone did — which is why the verifier and the
        reference point sit outside the authority independence establishes, and why that reference
        is what makes independence's self-recording property checkable. {{controlThreatDetection}}
        and {{controlIncidentResponseManagement}} consume the trail as evidence and depend on this
        control for the evidentiary value of what they read.
