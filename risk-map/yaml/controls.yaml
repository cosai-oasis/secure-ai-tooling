  - id: controlDelegatedAuthorityConfinement
    title: Delegated Authority Confinement
    description:
      - >
        Ensure that authority propagating across a delegation chain is re-established at
        each hop for the specific party acting and the action requested: minted for and
        bound to its own recipient, narrowed at each issuance to the requested action, and
        attributable to the actor that took each action rather than only to the original
        subject.
    guidance:
      - >
        Establish authority afresh at each hop, for example through OAuth 2.0 Token Exchange
        ({{ref:rfc-8693-token-exchange}}) or an equivalent per-hop issuance naming the
        current acting party. Bind it to the current actor and audience-restrict it to the
        intended recipient (resource indicators, {{ref:rfc-8707-resource-indicators}}),
        rather than forwarding or reusing a token issued for an earlier hop or presenting an
        inbound token unchanged downstream. Reject token passthrough by default: a resource
        accepts only tokens issued specifically for it and neither honors nor forwards tokens
        minted for another audience. Carry original-caller and intermediate-actor identities
        forward as an actor chain so downstream policy and audit can attribute an action to
        the full delegation path. Because a compromised intermediary can truncate or misstate
        the chain it presents, have the terminal resource validate the chain against the
        expected delegation topology rather than trusting a self-consistent chain. Narrow
        scope and lifetime at each issuance to what the hop needs. Where no central
        authorization server exists, signed delegation assertions binding actor, audience,
        scope, and chain position satisfy the intent.
      - >
        Recipient-bound authority means a credential captured or over-scoped at one hop
        cannot be replayed for broader authority downstream.
      - >
        This control governs how authority propagates across hops. It is distinct from
        {{controlDelegatedAuthorizationIntegrity}}, which requires the grant to be verifiable
        and independently re-evaluable at each intermediary; this one requires re-minting per
        hop rather than forwarding. The two are independent — a system can re-mint at every
        hop yet issue grants that cannot be independently re-evaluated (satisfying this
        control but not that one). It is distinct from
        {{controlSenderConstrainedCredentials}}, which makes one credential hard to replay
        through proof-of-possession binding, not the propagation discipline across the chain;
        from {{controlSessionCredentialBindingAndLifecycle}}, which governs audience binding
        and lifetime of any credential or session (a chain can re-mint at every hop and still
        issue long-lived, unbound tokens, and a short-lived, audience-bound token can still be
        forwarded unchanged); and from {{controlAuthenticationSchemeHardening}}, which governs
        whether a presented credential is verifiable and attributable at all, whereas this
        control requires that it was issued for the hop presenting it, so forwarding a
        verifiable token unchanged fails here. It is further distinct from
        {{controlAgentPluginPermissions}}, which owns the intersection of the agent's
        permissions and the caller's authorization as the bound on agent action (this control
        narrows each issued credential to what the hop needs and does not compute that
        intersection), and {{controlComponentIdentityProvenance}}, which verifies a callee is
        the registered principal.
