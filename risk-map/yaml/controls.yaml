  - id: controlAuditTrailIntegrityVerification
    title: Audit Trail Integrity Verification
    description:
      - >-
        Ensure that records already committed to the trail in {{componentAuditRecordRepository}}
        can be shown not to have changed since they were written, for as long as they are retained.
        This has two parts, and the second is the one usually missing: the trail carries a structure
        that makes alteration detectable, and something actually checks it. Detectability is not
        detection — an integrity structure nothing verifies produces no evidence, and a flat log
        file offers nothing to verify at all.
      - >-
        **The structure this control verifies.** Records are held so that altering or removing
        one after the fact leaves a discrepancy a reader can find: write-once media, cryptographic
        chaining of each record to its predecessors, or an equivalent binding a later edit cannot
        silently satisfy — the cryptographic form is AU-9(3) ({{ref:nist-sp-800-53r5}}). This
        restates for the repository the requirement {{controlAIInfrastructureObservability}} places
        on the telemetry it covers, and the restatement is deliberate rather than an oversight:
        a verification obligation with no stated object is empty. What earns this control its
        place is the property below.
      - >-
        **Verification on a cadence, against an externally held reference.** The structure is
        checked on a defined schedule rather than only during an investigation, by a verifier
        that does not run under the authority of the workloads being recorded, and a verification
        failure raises an alert on the same path as a security incident. Because a principal holding
        full authority over the store can rewrite the trail and its structure together into a
        self-consistent whole, the objective is a reference point held outside that authority
        and committed to periodically, bounding how far back such a rewrite can reach undetected.
        Publishing a hash-chain head or Merkle tree root to an independent witness is the common
        realization; an independently retained copy or an outside countersignature serves the
        same objective for a trail structured otherwise.
      - >-
        This control and {{controlAuditTrailCompleteness}} divide the trail's failure modes: records
        altered while they were durable, and records that never became durable or did not survive.
        It differs from {{controlAuditRecordRepositoryIndependence}}: independence determines
        who could have rewritten the trail, this control whether anyone did — which is why the
        verifier and the reference point sit outside the authority independence establishes, and
        why that reference is what makes independence's self-recording property checkable. {{controlThreatDetection}}
        and {{controlIncidentResponseManagement}} consume the trail as evidence and depend on
        this control for the evidentiary value of what they read.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaGovernance
    components:
