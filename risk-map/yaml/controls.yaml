  - id: controlTrustedPolicyEnforcementPoint
    title: Trusted Policy Enforcement Point
    category: controlsApplication
    description:
      - >
        Make the security-critical authorization and constraint-enforcement decision at
        a trusted, deterministic enforcement point rather than at the model. The model
        is influenceable by untrusted content reaching its context (for example via {{riskPromptInjection}}),
        so a system that relies on the model to authorize an action or hold a guardrail
        can be steered into actions the requester was never entitled to take. Treat the
        model's output as a request to be checked, not an authority to be trusted: a separate
        enforcement component decides whether a requested operation is permitted and rejects
        or constrains anything outside policy before any side effect occurs.
      - >
        This realizes the classical policy enforcement point / policy decision point separation
        (NIST SP 800-162) in an agentic setting — the enforcement decision lives in a
        component the attacker cannot reach through the model's context window. The role
        is locus-defined and protocol-independent: it applies wherever a model's output
        gates a privileged operation, whether the call rides over MCP, A2A, an in-process
        tool interface, or any other remote-tooling channel.
      - >
        This control governs WHERE the enforcement decision is placed. It is distinct
        from {{controlExternalizedAuthorizationDecisioning}} and {{controlResourceAuthorizationEnforcement}},
        which assume a trustworthy enforcement point and specify how the decision is externalized
        and enforced; this control establishes that the model is not that point. It is
        distinct from {{controlAgentPluginPermissions}} (which bounds the action scope
        an agent is granted) and {{controlInputValidationAndSanitization}} (which filters
        adversarial input to the model rather than relocating authorization out of it).
        See {{ref:cosai-mcp-security}}.
    personas:
      - personaApplicationDeveloper
      - personaAgenticProvider
      - personaPlatformProvider
    components:
      - componentTools
      - componentReasoningCore
      - componentOrchestrationInputHandling
      - componentAuthorizationPolicyEnforcementPoint
      - componentToolInputHandling
