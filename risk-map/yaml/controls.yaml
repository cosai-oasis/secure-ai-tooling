  - id: controlAuditTrailCompleteness
    title: Audit Trail Completeness
    description:
      - >-
        Ensure that every record which should have entered the trail held in
        {{componentAuditRecordRepository}}, including the decision records of enforcement points,
        did enter it and remains for as long as it should. The
        objective is that absence becomes reportable and reported. This control has three parts: verified
        commitment on the write path, a stated contract for failure and expiry, and a continuity
        expectation held across writers.
    guidance:
      - >-
        **Verified commitment on the write path.** A record has entered the trail only when the
        repository acknowledges it. The store authenticates itself as the write destination and
        returns an acknowledgement of durable commitment attributable to that identity; a success
        response from an endpoint that cannot present the repository's identity is not a
        commitment. This defeats write-path redirection by address rewrite alone, where an
        emitter's destination is reconfigured or impersonated so records are accepted and
        discarded. An adversary who also rewrites the emitter's trust anchors still diverts
        records; the continuity expectation can surface the silence unless that adversary also
        supplies the continuity signal.
      - >-
        **A stated contract for failure and expiry.** For each class of event the store states
        what a failed commit means (the recorded operation blocks until its record is durable, or
        proceeds with the failure recorded and alerted) and a minimum retention period, with
        capacity provisioned so ordinary volume does not consume it. Decision records produced by
        enforcement controls (admit or deny, approve or reject, verify pass or fail) are a class
        of event the trail commits and retains. Their failure posture is stated per class: by
        default a deny or reject is not silently dropped, and whether a failed commit blocks the
        decision or lets it proceed with the failure alerted is an explicit per-class choice,
        because an enforcement point that fails open on a deny leaves the consequential decision
        unrecorded. Their minimum retention is set by the deploying organization's accountability
        obligations. NIST SP 800-53 assigns the failure posture to the organization under AU-5
        and storage capacity to the medium under AU-4 ({{ref:nist-sp-800-53r5}}). A regulatory
        retention period is a floor, not a target: the EU AI Act requires providers and deployers
        to keep logs under their control for at least six months ({{ref:eu-ai-act-2024}}).
        Within that floor, overwriting the oldest records is not an acceptable response to
        storage pressure,
        although AU-5 permits it, because flooding a store until records of interest age out is
        an attack technique; on exhaustion the store falls back to its stated commit posture.
        Early expiry is an administrative action; this control depends on
        {{controlAuditRecordRepositoryIndependence}} to govern it.
      - >-
        **A continuity expectation held across writers.** The store requires of each writer a
        signal from which continuity can be judged and holds that expectation itself. The writer
        emits the signal under the control that owns that writer; the store requires and judges
        it, so a sequence break, an out-of-order arrival, or a writer gone quiet is reportable
        rather than a silent hole. A continuity break raises an alert on a path outside the
        writer's control, following the alerting pattern
        {{controlAuditTrailIntegrityVerification}} uses for a verification failure, without
        depending on that control. Sequence numbers,
        heartbeats, and writer manifests realize the signal; they are not the requirement. This
        is the half of the trail no emitter can attest to: a suppressed emitter is
        indistinguishable from an idle one from its own vantage point, so only the store's
        expectation can notice a writer terminated, silenced, or redirected. The expectation does
        not detect a compromised emitter that fabricates heartbeats or sequence numbers; a signal
        the writer cannot mint for itself narrows that case, and what remains is residual. The
        roster of expected writers includes non-agent writers (enforcement points, decision
        points, identity and registry services), not only agents. It is administrative state of
        the store; this control depends on the self-recording property of
        {{controlAuditRecordRepositoryIndependence}} for roster changes, since otherwise
        deregistering a writer silently retires its expectation. A non-agent writer is reconciled
        against the decision points declared for the owning control's deployment, exposing an
        enforcement point that was never registered; agent writers are reconciled against
        {{controlAgentInventoryManagement}}, on which this control depends for that case.
      - >-
        Neither {{controlInterComponentTransportSecurity}} nor
        {{controlComponentIdentityAuthentication}} supplies commitment: a protected channel to a
        properly identified peer can still end at an endpoint that discards what it receives.
        {{controlAIInfrastructureObservability}} emits the continuity signal only for
        infrastructure sources it instruments, its scope being per-request ordering rather than
        per-writer continuity, and {{controlAgentObservability}} does not reach ordering at all;
        this control depends on neither widening. Detecting that a telemetry source has stopped
        reporting into the collection pipeline is {{controlAIInfrastructureObservability}}'s, as
        pipeline health; judging an audit-record writer's continuity against the repository's
        expectation is this control's, as record continuity. Where an audit writer is also a
        source {{controlAIInfrastructureObservability}} collects from, both may fire on the same
        event, for different purposes. This control and {{controlAuditTrailIntegrityVerification}}
        divide the trail's failure modes: this control addresses records that never became
        durable or were lost to a retention or expiry failure; that control addresses records
        altered while durable. Deletion of a committed record, detected against the independently
        held reference point, including removal before minimum retention through an unauthorized
        change to the retention schedule, is that control's and not this one's.
