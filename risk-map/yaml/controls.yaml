  - id: controlRuntimeHostIsolation
    title: Runtime Host Isolation
    description:
      - >
        Run serving, orchestration, and tool-server processes under OS- and process-level
        isolation on any host, confining each to a least-privilege execution context (the
        host privileges, other host processes, and resources its task requires) and denying
        a compromised or vulnerable process any escalation path to the host or
        lateral-movement path to other workloads on it.
      - >
        This is a host-hardening posture, applied whether or not the process is trusted at
        deploy time.
    guidance:
      - >
        Implementations may use containerization or microVM boundaries; OS namespaces and
        control groups; syscall filtering (seccomp); mandatory access control profiles
        (AppArmor, SELinux); dropped Linux capabilities; non-root, per-process service
        accounts; and read-only or scoped filesystem and network views. The primitives are
        deployment attributes; the control is the property that a process executes with only
        the host privileges its task warrants.
      - >
        In scope: model-serving processes, orchestration runtimes, and tool servers wherever
        hosted, whether co-resident with the agent or client or on a dedicated or third-party
        tool-hosting substrate (for example, MCP servers in either placement), and any process
        that executes model-generated code, such as an agent's code-execution or shell tool.
      - >
        This control is distinct from {{controlIsolatedConfidentialComputing}}, which
        provides hardware-level isolation (TEEs, secure enclaves) against privileged-host and
        cross-tenant access; {{controlAgentHostSecureConfiguration}}, which keeps protective
        host settings from being tampered with (this control isolates the running process,
        that control keeps the isolation and other protections from being disabled);
        {{controlSecureByDefaultMLTooling}}, which governs selection and secure-default
        configuration of tooling, not the runtime host boundary; and
        {{controlAgentPluginPermissions}}, which constrains an agent's logical tool/action
        scope, not the host privileges of the process serving a tool. It is also distinct
        from {{controlAgenticZeroTrustPosture}}, which sets the design-time trust topology and
        requires assume-breach segmentation; this control is the host-layer enforcement of
        that segmentation for running processes.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
