        title: CoSAI — MCP Security Considerations
        url: https://github.com/cosai-oasis/ws1-supply-chain
  - id: controlInformedAgentConsentSurface
    title: Informed Agent Consent Surface
    description:
      - >
        Ensure that a human-in-the-loop approval of a security-relevant agent or tool
        action is an INFORMED decision — the approver both sees the decision-relevant
        facts and can act on them — rather than a reflexive click-through. Where a person
        is the authorising party, the consent surface must render what is being requested
        and its consequences unambiguously, so approval is meaningful.
      - >
        Render the machine-resolved tool identity, registered origin or publisher, and
        the marshalled inputs at the approval point — not the tool's self-described label,
        which is the channel an attacker controls — so that a lookalike or shadowed tool
        is distinguishable before the action runs. This is the agentic analogue of anti-phishing
        origin display.
      - >
        Keep the prompt intelligible and calibrate its salience and frequency to the risk
        of the action, so high-consequence requests stay distinguishable and do not lose
        effect through habituation (consent fatigue). Safe execution should not depend
        on the human absorbing every prompt; routine, low-risk authorisations may be batched,
        defaulted, or policy-pre-approved so scarce attention is reserved for consequential
        decisions.
      - >
        This control governs the quality of the agent consent surface — both the provenance
        content it renders and its intelligibility. It is distinct from {{controlAgentPluginUserControl}},
        which governs whether human approval is required at all, and from {{controlUserTransparencyAndControls}},
        which governs general disclosure of AI risks and user control over data use; those
        establish that a gate exists, while this ensures the gate presents an intelligible,
        non-fatiguing, provenance-accurate decision.
    category: controlsApplication
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaEndUser
    components:
      - componentAgentConsentSurface
      - componentApplicationConsentSurface
      - componentToolServer
      - componentTools
