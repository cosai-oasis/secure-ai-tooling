  - id: controlUntrustedContextContainment
    title: Untrusted Context Containment
    description:
      - >
        Treat model-external content that enters an AI system's context — tool and function-call
        responses, retrieved documents, tool and resource schema descriptions, and other
        third-party data — as untrusted, and contain the actions the model may take in
        response, preventing such content from driving privileged or side-effecting behavior
        on its own. This control governs the trust treatment and action-gating of untrusted
        context.
    guidance:
      - >
        Where feasible, label context by provenance and require a higher assurance step
        (independent authorization, user confirmation via {{controlAgentPluginUserControl}},
        or a policy check) before content originating outside a trust boundary can trigger a
        side-effecting action. Record each allow, block, or escalate decision with the
        trigger's provenance label, the action requested, the assurance step required and its
        outcome, the principal, and the time.
      - >
        This control is the residual-risk posture for the absence of a true instruction/data
        boundary inside the model: models share one token channel for instructions and data,
        so untrusted context cannot be made structurally inert and containment shifts to the
        surrounding system.
      - >
        This control is distinct from {{controlInputValidationAndSanitization}}, which
        filters adversarial user queries to the model; {{controlAgentPluginPermissions}},
        which sets the least-privilege upper bound and confused-deputy checks on agent
        authority; and {{controlAgentObservability}}, which records what an agent did. It is
        distinct from {{controlAgentPluginUserControl}}, which requires user approval for
        data-altering actions; this control decides which actions triggered by
        untrusted-origin content need an assurance step, and approval is one step it can
        require. It supplies the trust-labelling and action-gating layer on which those
        controls' decisions act. Showing that this control was enforced depends on the records
        described above being committed and retained under {{controlAuditTrailCompleteness}}.
    category: controlsApplication
    personas:
