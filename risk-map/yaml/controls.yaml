  - id: controlIsolatedConfidentialComputing
    title: Isolated and Confidential Computing
    description:
      - >
        Use technologies that minimize the risk of 3rd-party access to critical resources
        via hardware isolation invariants and/or physically isolated computing systems.
      - >
        Examples include including CPU and TPU-based confidential computing technologies
        (TEEs, secure enclaves), system isolation, secure scheduling, and side-channel
        monitoring to prevent cross-tenant information leakage.
      - Pair enclave/TEE isolation with remote attestation so that the isolated
        environment can be cryptographically verified before it is trusted.
        Attestation extends the protection beyond passive isolation to defend
        against compromised host hardware, malicious infrastructure administrators,
        and co-tenancy threats by proving that the workload is running in a genuine,
        unmodified isolated environment.
      - "Account for the resulting trust boundary: when a workload runs in an enclave,
        the host system, host OS, firmware, and hypervisor lie outside that boundary,
        so privileged host-based software attacks do not reach the protected workload.
        Certain physical hardware attacks remain outside the enclave's mitigation and
        should be addressed by complementary controls."
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    components:
      - componentModelServing
      - componentModelTrainingTuning
      - componentMemory
      - componentReasoningCore
      - componentIsolationRuntime
    risks:
