  - id: controlComponentIdentityRegistration
    title: Component Identity Registration
    category: controlsApplication
    description:
      - >
        Ensure that each component participating in flows mediated by an authorization
        server — agents, remote tool servers, and shared-service endpoints — is enrolled
        as a recognized, revocable client of that authorization server, and that only a
        component authorized to exist can be enrolled, ensuring the authorization server
        can name and revoke every such client it serves.
      - >
        This control governs enrollment only: whether a component is a known client of the
        authorization server, the role that recognition is scoped to, and whether it has
        been revoked.
    guidance:
      - >
        Registration binds a component to a distinct client identity at the identity provider,
        scoped to the component's role, rather than leaving it to act under ambient trust
        or a shared, unattributable credential. Where a component cannot be enrolled ahead of
        time — for example a tool server discovered at runtime — a programmatic enrollment
        mechanism such as OAuth 2.0 Dynamic Client Registration ({{ref:rfc7591-dcr}})
        lets the component enroll through an attributable path instead of falling back to
        a static or shared secret. Runtime enrollment is gated rather than open: the request
        must carry an initial access credential issued for that component, or a signed
        statement (for example a software statement) tied to the component's inventory
        approval, and the authorization server rejects a request carrying neither, so that
        a server nobody approved cannot enroll itself. Record each enroll or reject decision
        with the requesting component, the initial access credential or software statement and
        inventory entry relied on, the client identity enrolled, and the time.
      - >
        This control should follow least-privilege and zero-trust posture: a component's
        registered identity scopes the credentials it can be issued, and every enrollment,
        ahead of time or at runtime, should be gated on the component first being authorized
        to exist (its inventory entry), so that an unregistered or decommissioned component
        cannot obtain a usable client identity.
      - >
        This control is distinct from {{controlAgentInventoryManagement}},
        which is the governance registry of what is authorized to exist (registration
        consumes that authority, it does not replace it); from {{controlComponentIdentityProvenance}},
        which verifies at each invocation that the counterparty is still the currently
        registered, non-revoked principal (enrollment and its revocation are the standing
        that check reads);
        from {{controlAgentCredentialIsolation}}, which scopes issued credentials to tenant
        boundaries; and from {{controlInterComponentTransportSecurity}}, which protects
        the channel those credentials travel over. Registration enrolls the client and issues
        no credential or authenticator; the client identifier returned at enrollment (for
        example a DCR client_id) is the record of enrollment, not a principal identifier or
        authenticator. Those controls bound, attest, and transport the identity
        that {{controlComponentIdentityAuthentication}} issues.
      - >
        This control is closest to {{controlComponentIdentityAuthentication}}:
        registration is the enrollment that makes a component a known, revocable client
        of the authorization server and issues no credential or authenticator, while that
        control issues the unique principal identifier, binds the verifiable authenticator
        to it, and verifies it at connection time. The client identifier returned at
        enrollment (for example a DCR client_id) is the enrollment record; where enrollment
        also returns a credential, issuing it is that control's function exercised at
        enrollment. Registration applies only to components in flows mediated
        by an authorization server; a principal outside such flows is covered by that
        control alone. The two hold independently — a component can be authenticated against
        a trust anchor it was never registered into (for example a per-principal certificate
        chained to a trusted CA), and an enrolled component's credential stays unverified
        at use until that control checks it. Showing that this control was enforced depends on
        the records described above being committed and retained under {{controlAuditTrailCompleteness}}.
    personas:
      - personaApplicationDeveloper
      - personaAgenticProvider
      - personaPlatformProvider
    risks:
      - riskAgentIdentitySpoofing
      - riskZombieShadowMCPServers
    lifecycleStage:
      - development
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
      - accountability
    actorAccess:
      - agent
      - service-provider
      - external
