  - id: controlNetworkEgressControl
    title: Network Egress Control
    description:
      - >
        Constrain the outbound network reachability of AI-system components to the
        destinations each legitimately requires.
    guidance:
      - >
        In scope: model-serving endpoints, orchestration services, agents, and the tool
        servers they run. Constraining egress keeps a compromised or misbehaving component
        from originating arbitrary external connections, including data exfiltration and
        command-and-control (C2) callbacks.
      - >
        Govern component-originated connections through an egress policy or forward proxy,
        not unrestricted external access: default-deny outbound with allowlisted
        destinations and ports scoped to each component's needs; egress filtering or
        proxying that constrains C2 reachability and bulk data egress (network-boundary
        data-loss prevention); and destination scoping so an agent or tool server cannot
        reach external endpoints beyond its task. Calibrate strictness to the sensitivity
        of the data a component handles and its blast radius. Record each denied outbound
        connection with the originating component, the destination, the policy rule relied
        on, and the time.
      - >
        This control is distinct from {{controlInboundNetworkExposureAndSegmentation}},
        which governs inbound exposure and segmentation: this control governs where a
        component may send. It is distinct from {{controlInterComponentTransportSecurity}}
        (protects the channel once permitted), {{controlModelAndDataAccessControls}}
        (principal access to assets, not egress paths), and
        {{controlIsolatedConfidentialComputing}} (compute/memory isolation, not the network).
        Showing that this control was enforced depends on the records described above being
        committed and retained under {{controlAuditTrailCompleteness}}.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
