  - id: controlRuntimeHostIsolation
    title: Runtime Host Isolation
    description:
      - >
        Run remote-tooling and serving processes — including locally or co-resident tool
        servers (such as MCP servers), model-serving processes, and orchestration runtimes
        — under OS- and process-level isolation, so that a compromised or vulnerable process
        cannot reach host privileges, sibling processes, or resources beyond what its
        task requires.
      - >
        The objective is to bound the blast radius of a compromised runtime process to
        a least-privilege execution context, containing privilege-escalation and lateral-movement
        paths from the process to the underlying host. This is a host-configuration and
        hardening posture, applied independently of whether the process is trusted at
        deploy time.
      - >
        Implementations may draw on OS isolation primitives appropriate to the deployment
        context: containerization or microVM boundaries; OS namespaces and control groups;
        syscall filtering (seccomp); mandatory access control profiles (AppArmor, SELinux);
        dropped Linux capabilities; non-root, per-process service accounts; and read-only
        or scoped filesystem and network views. The specific primitives are deployment
        attributes; the control is the property that a runtime process executes with only
        the host privileges its task warrants.
      - >
        This control governs the OS/process isolation tier. It is distinct from {{controlIsolatedConfidentialComputing}},
        which provides hardware-level isolation (TEEs, secure enclaves) against privileged-host
        and cross-tenant access; from {{controlAgentHostSecureConfiguration}}, which keeps
        protective host settings from being tampered with — this control isolates the
        running process, that control keeps the isolation and other protections from being
        disabled; from {{controlSecureByDefaultMLTooling}}, which governs selection and
        secure-default configuration of tooling rather than the runtime host boundary;
        and from {{controlAgentPluginPermissions}}, which constrains an agent's logical
        tool/action scope rather than the host privileges of the process that serves a
        tool. Those controls assume processes may still be compromised; this control bounds
        what a compromised process can do to its host.
    category: controlsInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
    components:
      - componentTools
      - componentModelServing
      - componentApplication
      - componentIsolationRuntime
      - componentToolHosting
      - componentRuntimeHosting
    risks:
      - riskInsecureIntegratedComponent
      - riskUntrustedHostToolRuntimeExposure
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
      - availability
    actorAccess:
      - external
      - agent
      - service-provider
    mappings:
      nist-ai-rmf:
        - MEASURE-2.7@1.0
  - id: controlResourceAuthorizationEnforcement
    title: Resource Authorization Enforcement
    description:
      - >
        Ensure that every request to read or act on a protected resource is authorized
        against the requesting principal's verified identity and role at an explicit policy
        enforcement point, rather than left to the calling service's discretion. Authorization
        for each object, tool, and data resource is enforced consistently — regardless
        of whether the caller is a user, a service, or an agent — so that a principal
        can reach only the resources its role and context entitle it to.
      - >
        Authorization is evaluated per resource instance, not merely per endpoint or resource
        type, so that holding a valid identity for one object does not confer access to
        sibling objects of the same type (the classical broken-object-level-authorization,
        or BOLA, failure). Decisions are made against claims asserted by the identity
        provider — role membership, group, or attributes — using role- or attribute-based
        access control, and follow least-privilege and privilege-separation so the permission
        scope granted to a service or tool integration is the minimum its function requires.
      - >
        Enforcement points at the resource boundary admit or deny each call by consulting
        an externalized policy decision (NIST SP 800-162 PEP/PDP/PIP/PAP). Remote tooling
        and shared-service integrations — MCP tool servers, plugin backends, orchestration
        endpoints — are in scope: each should be granted narrow, resource-scoped permissions
        enforced on every call rather than inheriting broad ambient authority. Agent-initiated
        calls are the agent case of this same per-object enforcement, not a separate control.
      - >
        This control governs per-object authorization ENFORCEMENT at the resource. It
        is distinct from {{controlExternalizedAuthorizationDecisioning}}, which supplies
        the externalized policy decision this control's enforcement points consult (decision
        vs enforcement), and from {{controlTrustedPolicyEnforcementPoint}}, which requires
        that enforcement live in a component the model cannot influence. It is distinct
        from {{controlApplicationAccessManagement}} (coarse identity gating + quotas),
        {{controlAgentPluginPermissions}} (which tools/actions an agent may invoke), {{controlAgentCredentialIsolation}}
        (tenant scoping), and {{controlComponentIdentityProvenance}} (who the principal
        is) — those establish identity and coarse gating, while this control decides whether
        the established principal may reach the specific resource instance.
    category: controlsApplication
    personas:
      - personaApplicationDeveloper
      - personaAgenticProvider
      - personaPlatformProvider
      - personaModelServing
      - personaGovernance
    components:
      - componentApplication
      - componentTools
      - componentOrchestrationInputHandling
      - componentMemory
      - componentDataStorage
      - componentAuthorizationPolicyEnforcementPoint
      - componentAuthorizationPolicyDecisionPoint
    risks:
      - riskBrokenAuthorizationEnforcement
      - riskAgenticDelegationConfusedDeputy
      - riskRogueActions
      - riskAuditTrailTampering
    mappings:
      nist-ai-rmf:
        - MEASURE-2.7@1.0
      owasp-top10-llm:
        - LLM06:2025
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
      - privacy
      - accountability
    actorAccess:
      - external
      - api
      - user
      - agent
      - privileged
  - id: controlUntrustedContextContainment
    title: Untrusted Context Containment
    description:
      - >
        Treat model-external content that enters an AI system's context — tool and function-call
        responses, retrieved documents, tool and resource schema descriptions, and other
        third-party data — as untrusted, and contain the actions the model may take in
        response so that such content cannot drive privileged or side-effecting behavior
        on its own. This is the residual-risk posture for the absence of a true instruction/data
        boundary inside the model: because current language models share a single token
        channel for instructions and data, untrusted context cannot be made structurally
        inert as instructions at the model layer, so containment shifts to the surrounding
        system.
      - >
        This control governs the trust treatment and action-gating of untrusted context.
        It is distinct from {{controlInputValidationAndSanitization}}, which filters adversarial
        user queries to the model; from {{controlAgentPluginPermissions}}, which sets
        the least-privilege upper bound and confused-deputy checks on agent authority;
        and from {{controlAgentObservability}}, which records what an agent did. Containment
        composes with those controls rather than replacing them: it provides the trust-labelling
        and action-gating layer on which permission and observability decisions act. Where
        feasible, label context by provenance and require a higher assurance step — independent
        authorization, user confirmation via {{controlAgentPluginUserControl}}, or a policy
        check — before content that originated outside a trust boundary can trigger a
        side-effecting action.
