        url: https://generalanalysis.com/blog/supabase-mcp-blog
  - id: riskConsentFatigue
    title: Consent Fatigue in Human Approval Gates
    shortDescription:
      - >
        Human approval gates degrade as a safety control when agents prompt for consent
        so frequently that users habituate and approve actions without evaluating them,
        allowing dangerous operations to proceed.
    longDescription:
      - >
        Agentic and remote-tooling systems often place a human-in-the-loop approval gate
        in front of consequential actions, treating user consent as the last line of defense
        before an action executes. Consent Fatigue is the failure mode of that gate: when
        the volume, frequency, or uniformity of approval prompts exceeds what a person
        can meaningfully evaluate, users habituate to the prompt and approve reflexively.
        The protective value of the gate collapses because the human is no longer exercising
        judgment — the consent surface still functions mechanically, but the decision
        behind each approval has become a rubber stamp.
      - >
        This is the agentic-dress form of a classical usable-security problem: warning
        fatigue, alert habituation, and the click-through phenomenon long documented for
        browser security warnings, OS permission dialogs, and SOC alert queues. The established
        lesson is that a human cannot serve as a reliable fail-safe for a control that
        fires constantly; effectiveness decays with exposure. The AI-specific amplifier
        is autonomy and tool breadth: an agent can decompose a single user intent into
        many tool calls, each potentially gated, producing prompt volumes no traditional
        application generated, and the prompts are often semantically opaque (a tool name
        and arguments) so the user cannot cheaply distinguish a routine action from a
        dangerous one.
      - >
        The locus is the consent/elicitation surface, not the agent's reasoning or the
        transport. It is distinct from {{riskRogueActions}}, which is the agent taking
        an unintended action; here the agent may be behaving as designed and the failure
        is that the human gate meant to catch a bad action waves it through. It is distinct
        from {{riskRunawayAgentToolLoops}}, which uses human approval as one possible
        bound; Consent Fatigue is the risk that the approval lever itself is unreliable
        as a bound. The underlying condition is a consent surface that issues high-volume,
        low-context, undifferentiated approval requests and relies on sustained human
        vigilance to remain effective.
      - >
        Potential impacts include execution of dangerous or irreversible operations (data
        deletion, fund transfers, privileged configuration changes) that a vigilant user
        would have rejected, erosion of the accountability story for agent actions (an
        approval was recorded but was not a considered decision), and false assurance
        that a human-in-the-loop control is providing protection it no longer provides.
    category: risksRuntimeInputSecurity
    personas:
      - personaEndUser
      - personaPlatformProvider
      - personaApplicationDeveloper
      - personaAgenticProvider
    controls:
      - controlAgentPluginUserControl
      - controlAgentPluginPermissions
      - controlInformedAgentConsentSurface
    examples:
      - >
        Field studies of browser security-warning effectiveness ({{ref:akhawe-felt-2013-alice-in-warningland}})
        and of security-decision-UI habituation ({{ref:bravo-lillo-2013-your-attention-please}})
        document that repeated exposure to a similar-looking prompt trains users toward
        faster, more reflexive approval and measurably reduces attention to the specific
        content of a later prompt — the mechanism this risk generalizes from browser/OS
        security dialogs to agentic tool-call approval. The same pattern applies when
        an agent gates many low-context tool calls behind per-action approval: repetition
        erodes the checkpoint's effectiveness even though each individual prompt is technically
        present.
    tourContent:
      introduced:
        - >
          Introduced during development when an agent's approval gate is designed to prompt
          per-action without scoping, batching, or risk-tiering, making high-volume undifferentiated
          prompting the default user experience.
      exposed:
        - >
          Exposed at runtime once a user has been conditioned by repeated prompts and
          approves a consequential action reflexively, allowing it to execute without
          genuine evaluation.
      mitigated:
        - >
          Mitigated by designing consent to be meaningful rather than frequent: risk-tiering
          prompts so only consequential or irreversible actions interrupt the user, batching
          and scoping approvals, surfacing the concrete consequence of an action in human
          terms, and applying least-privilege so fewer actions require an approval at
          all.
    lifecycleStage:
      - development
      - runtime
    impactType:
      - integrity
      - safety
      - accountability
    actorAccess:
      - agent
      - user
    mappings:
      stride:
        - ElevationOfPrivilege
      owasp-top10-llm:
        - LLM06:2025
    externalReferences:
      - type: paper
        id: akhawe-felt-2013-alice-in-warningland
        title: 'Alice in Warningland: A Large-Scale Field Study of Browser Security Warning
          Effectiveness'
        url: https://www.usenix.org/conference/usenixsecurity13/technical-sessions/presentation/akhawe
      - type: paper
        id: bravo-lillo-2013-your-attention-please
        title: 'Your Attention Please: Designing Security-Decision UIs to Make Genuine
          Risks Harder to Ignore'
        url: https://cups.cs.cmu.edu/soups/2013/proceedings/a6_Bravo-Lillo.pdf
  - id: riskAgenticToolSupplyChain
    title: Agentic Tool Supply Chain Compromise
    shortDescription:
      - >
        Compromise of the build, packaging, and dependency chain of the server-side code
        that backs an agent's tools, where unsigned or unverified artifacts and vulnerable
        or unpinned dependencies execute with the tool's privileges.
    longDescription:
      - >
        Agents invoke tools that are backed by server-side code — most visibly Model Context
        Protocol (MCP) servers, but equally A2A endpoints, plugin runtimes, and any remote-tooling
        service the agent calls. That code is built, packaged, and deployed through a
        supply chain: source repositories, dependency resolvers, build pipelines, and
        artifact registries. When an artifact is admitted to execution without provenance
        verification or signature checking, when its transitive dependencies are not screened
        for known vulnerabilities, or when dependencies resolve through floating version
        ranges rather than hash-pinned references, an attacker who compromises any link
        in that chain runs code with the tool's privileges the next time the agent invokes
        it.
      - >
        This is the classical software supply-chain compromise pattern in agentic dress.
        The relevant reference frame is the same one used for any build pipeline: SLSA
        provenance levels, software composition analysis (SCA) over the dependency graph,
        binary or admission authorization that refuses unsigned artifacts, software bills
        of materials (SBOM), and hash-pinned, reproducible dependency resolution. The
        protocol an agent uses to reach the tool, and whether the server runs locally
        or remotely, are attributes of the deployment, not the identity of the defect.
      - >
        This risk operates at the tool's CODE and DEPENDENCY integrity layer — the artifact
        that runs when a tool is invoked. It is distinct from {{riskToolSourceProvenance}},
        which operates one layer up at tool discovery and metadata: a tool can have a
        perfectly trustworthy manifest and publisher identity while the server binary
        behind it was built from a poisoned dependency. It is also distinct from {{riskModelSourceTampering}},
        which is the same defect class applied to the MODEL artifact (code, weights, training
        dependencies) rather than to agentic tool/server code. {{riskAgenticToolSupplyChain}}
        is structurally analogous to {{riskModelSourceTampering}}: both are integrity
        failures in a build-and-dependency chain consumed without verification, but they
        target different artifacts and different consuming personas.
      - >
        A successful compromise typically manifests downstream as {{riskRogueActions}}
        — the agent invokes a tool that now behaves maliciously — or as {{riskInsecureIntegratedComponent}}
        when the injected vulnerability is a generic software flaw exploited at runtime.
        Because dependency chains are transitive, a single poisoned upstream package can
        reach many tool servers, giving this risk supply-chain blast radius rather than
        per-tool scope.
    category: risksSupplyChainAndDevelopment
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
    controls:
      - controlModelAndDataIntegrityManagement
      - controlSecureByDefaultMLTooling
    examples:
      - >
        The CxZero MCP risk taxonomy ({{ref:checkmarx-2025-mcp-emerging-risks}}) called
        out unsigned MCP server code and vulnerable server dependencies among the top
        emerging MCP security risks, recommending binary authorization, software composition
        analysis, and hash-based dependency pinning as the mitigation set.
      - >
        The torchtriton dependency-confusion compromise of the PyTorch nightly build ({{ref:pytorch-2022-torchtriton-compromise}})
        is the classical precedent for this pattern: a malicious package substituted into
        a floating dependency range executed attacker code on resolution. The same mechanism
        applies unchanged to the dependency chains of agentic tool servers.
    tourContent:
      introduced:
        - >
          This risk is introduced when the server-side code backing an agent's tools is
          built or deployed without artifact signing and provenance verification, without
          composition analysis of its dependency graph, or with dependencies resolved
          through floating version ranges rather than hash-pinned references.
      exposed:
        - >
          The risk is exposed at tool invocation, when the agent calls a tool whose backing
          artifact or one of its transitive dependencies has been tampered with upstream,
          executing the compromised code with the tool's privileges.
      mitigated:
        - >
          Mitigation applies classical supply-chain integrity to tool/server artifacts:
          binary or admission authorization that refuses unsigned or unverified code,
          software composition analysis to surface vulnerable dependencies, SBOM generation,
          and hash-pinned, reproducible dependency resolution rather than version ranges.
    mappings:
      mitre-atlas:
        - AML.T0010.002@5.0.1
      stride:
        - Tampering
      owasp-top10-llm:
        - LLM03:2025
    lifecycleStage:
      - development
      - deployment
    impactType:
      - integrity
      - confidentiality
      - availability
    actorAccess:
      - supply-chain
    externalReferences:
      - type: editorial
        id: checkmarx-2025-mcp-emerging-risks
        title: 11 Emerging AI Security Risks with MCP (Model Context Protocol)
        url: https://checkmarx.com/zero-post/11-emerging-ai-security-risks-with-mcp-model-context-protocol/
      - type: advisory
        id: pytorch-2022-torchtriton-compromise
        title: Compromised PyTorch-nightly dependency chain (torchtriton)
        url: https://pytorch.org/blog/compromised-nightly-dependency/
  - id: riskImplicitCrossBoundaryTrust
    title: Implicit Cross-Boundary Trust
    shortDescription:
      - >
        An agentic system grants ambient trust across a client, remote-tooling, or third-party
        service boundary instead of verifying authority at each boundary, so a compromise
        on one side is implicitly trusted by the others and propagates through transitive-trust
        chains.
    longDescription:
      - >
        Agentic deployments chain multiple parties across trust boundaries: an orchestrator
        or client, one or more remote tool servers (for example MCP or A2A endpoints),
        and the downstream third-party APIs those servers call. Implicit Cross-Boundary
        Trust is the design condition in which trust is granted by position in the chain
        rather than verified at each boundary — the client implicitly trusts whatever
        a server returns, the server implicitly trusts the client's requests, and the
        third-party service implicitly trusts the server's calls. Because authority is
        ambient rather than checked per boundary, a compromise of any single element is
        accepted as trustworthy by the elements adjacent to it.
      - >
        This is the agentic form of a classical implicit-trust (non-zero-trust) architecture.
        Zero-trust architecture ({{ref:nist-sp-800-207-zero-trust}}) and attribute-based
        policy enforcement ({{ref:nist-sp-800-162-abac}}, PEP/PDP/PIP/PAP) were defined
        precisely to remove this assumption by forcing per-request verification at every
        boundary instead of trusting an internal zone; {{ref:cwe-653}} (Insufficient Compartmentalization)
        captures the same failure to keep security domains separated. The AI-specific
        amplifier is that the trust chain is assembled dynamically at runtime — agents
        discover and connect to tool servers on the fly, so the set of trusted parties
        is not fixed or pre-vetted — and the LLM autonomously decides to cross boundaries
        based on reasoning over untrusted content, so ambient authority is exercised without
        a human verifying each hop.
      - >
        The exposure is present wherever an agentic system establishes trust by connection
        or chain position rather than by per-boundary verification: wherever a client
        accepts tool output or server-supplied instructions as trusted without bounding
        their authority; wherever a remote tool server acts on client requests without
        confirming the request is within the client's authorized scope; wherever a third-party
        call inherits the server's standing credentials rather than a request-scoped,
        verified authorization; and wherever no policy decision point evaluates each cross-boundary
        action against the originating caller's authority. Any of these lets trust flow
        transitively, so a single compromised node yields lateral movement and privilege
        escalation across the whole chain.
      - >
        This risk is the trust-model design root that the corpus's more specific delegation
        risks specialize. It is distinct from {{riskAgenticDelegationConfusedDeputy}},
        which is the failure to validate the caller's authorization at one delegation
        boundary; here the defect is architectural and chain-wide — trust is granted ambiently
        across every boundary, of which the confused deputy is one symptom. It is distinct
        from {{riskCrossTenantCredentialPropagation}}, which is specifically about unscoped
        credentials crossing tenant boundaries through the identity layer; this risk concerns
        implicit trust in the request/response and call path regardless of tenancy. It
        is distinct from {{riskInsecureIntegratedComponent}}, which concerns software
        vulnerabilities in an integrated component; here each component may be individually
        sound, yet the system is breached because the boundaries between them are unverified
        by design.
      - >
        Potential impacts include lateral movement from a single compromised tool server
        or client into otherwise-isolated services, privilege escalation along transitive-trust
        chains, unauthorized cross-boundary data access and actions, and a blast radius
        that spans every party the chain reaches. Consequences include accountability
        gaps (no boundary can attribute which party's authority was actually exercised),
        compliance failures, and the collapse of containment guarantees the architecture
        was assumed to provide.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaAgenticProvider
      - personaPlatformProvider
      - personaApplicationDeveloper
      - personaEndUser
    controls:
      - controlAgentPluginPermissions
      - controlAgentCredentialIsolation
      - controlIsolatedConfidentialComputing
      - controlAgentObservability
    examples:
      - >
        A coding-assistant agent connects a client to a remote MCP tool server that itself
        calls a downstream third-party API using a single standing credential. Because
        the client trusts whatever the server returns and the server's third-party call
        carries ambient authority, a prompt-injected instruction routed through the server
        is executed against the third-party service with the server's full standing access
        — a request the originating user was never authorized to make — illustrating trust
        granted by chain position rather than verified per boundary.
      - >
        In a multi-agent workflow, an orchestrator trusts a peer tool agent's responses
        without bounding their authority. The peer agent, compromised through a poisoned
        tool description, returns instructions the orchestrator acts on against an internal
        service. No boundary between orchestrator, peer, and internal service re-verified
        authority, so a single compromised node moved laterally across the chain. This
        pattern is documented, not purely hypothetical: Microsoft's incident-response
        research describes poisoned MCP tool descriptions hijacking agents that act on
        a user's behalf through exactly this implicit-trust chain ({{ref:thehackernews-2026-mcp-poisoned-tool-descriptions}}),
        grounded in a real seed incident — the first documented malicious MCP server found
        in the wild silently BCC'd outgoing emails to an attacker, abusing the implicit
        trust its caller placed in it. This is research-grounded analysis of an emerging
        pattern with one real confirmed instance, not yet a fully realized multi-agent
        cascading-trust breach — cited honestly as such rather than overstated.
    tourContent:
      introduced:
        - >
          Introduced during design and deployment when the agentic architecture establishes
          trust by connection or chain position — client to remote tool server to third-party
          service — without a per-boundary verification step (no policy decision point
          evaluating each cross-boundary action against the originating caller's authority).
      exposed:
        - >
          Exposed at runtime when any node in the chain is compromised or fed malicious
          content and the adjacent nodes accept its requests or responses as trusted,
          allowing the compromise to propagate transitively across boundaries the architecture
          assumed were isolated.
      mitigated:
        - >
          Mitigated by applying zero-trust principles to every agentic boundary: verify
          the originating caller's authority at each hop rather than trusting chain position,
          scope credentials and effective permissions to the intersection of the caller's
          and the node's authority per request, isolate components to bound blast radius,
          and observe cross-boundary actions to detect authority exercised beyond the
          expected scope.
    mappings:
      stride:
        - ElevationOfPrivilege
        - Spoofing
      owasp-top10-llm:
        - LLM06:2025
    lifecycleStage:
      - development
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
      - accountability
    actorAccess:
      - agent
      - external
      - service-provider
    externalReferences:
      - type: spec
        id: nist-sp-800-207-zero-trust
        title: 'NIST SP 800-207: Zero Trust Architecture'
        url: https://csrc.nist.gov/pubs/sp/800/207/final
      - type: spec
        id: nist-sp-800-162-abac
        title: 'NIST SP 800-162: Guide to Attribute Based Access Control (ABAC) Definition
          and Considerations'
        url: https://csrc.nist.gov/pubs/sp/800/162/final
      - type: cwe
        id: cwe-653
        title: 'CWE-653: Improper Isolation or Compartmentalization'
        url: https://cwe.mitre.org/data/definitions/653.html
      - type: news
        id: thehackernews-2026-mcp-poisoned-tool-descriptions
        title: Microsoft Warns of Poisoned MCP Tool Descriptions Hijacking AI Agents
        url: https://thehackernews.com/2026/06/microsoft-warns-poisoned-mcp-tool.html
  - id: riskCredentialAndTokenTheft
    title: Credential and Token Theft
    shortDescription:
      - >
        Secret material such as OAuth tokens, API keys, and service credentials is exposed
        through insecure storage, handling, or transmission, letting an attacker who obtains
        it impersonate a legitimate identity, access protected resources, or escalate
        privilege.
    longDescription:
      - >
        Credential and Token Theft is the classical secret-confidentiality failure ({{ref:cwe-522}})
        cast in agentic and remote-tooling dress. Agents, orchestration layers, and tool
        servers (for example MCP, A2A, or UCP endpoints) hold and forward large numbers
        of secrets — short-lived bearer and OAuth access tokens, long-lived API keys,
        and service-account credentials — in order to authenticate to downstream tools
        and services on a caller's behalf. When that secret material is stored in cleartext
        ({{ref:cwe-312}}), embedded in configuration or environment variables, written
        to logs, cached in process memory without scrubbing, or transmitted over channels
        that do not protect confidentiality, an attacker who reads it can replay it directly.
        Because a bearer token is presented as proof of identity, possession is sufficient:
        the holder of a stolen token is indistinguishable from the legitimate principal
        until the token is revoked.
      - >
        The mechanism is theft of the secret itself, independent of how the secret was
        acquired. Acquisition vectors include reading secrets at rest (disk, container
        image, environment, source repository, or backup), harvesting them from logs and
        error traces, scraping them from process memory or core dumps, and capturing them
        from insufficiently protected transmission. The impact class is impersonation:
        with a valid token the attacker authenticates as the victim principal, reuses
        its authorization, and may pivot to higher privilege if the stolen credential
        is over-scoped or long-lived. The breach is hard to detect because every downstream
        request carries a structurally valid credential and the legitimate identity remains
        enrolled.
      - >
        This risk is the credential-confidentiality counterpart to several adjacent identity
        risks and is deliberately scoped to the secret as an asset. It is distinct from
        {{riskMCPTransportHijacking}}, which covers attacks on the transport channel itself
        (man-in-the-middle, session hijacking, replay): transport hijacking is one acquisition
        vector for a token in transit, whereas this risk centers on the secret's confidentiality
        across its whole lifecycle, including at rest and in handling where no transport
        is involved. It is distinct from {{riskCrossTenantCredentialPropagation}}, which
        covers the blast radius of shared or insufficiently tenant-scoped credentials
        spreading laterally after a compromise; that risk concerns propagation of legitimately
        issued credentials, this one concerns theft of a secret from insecure storage
        or handling. It is distinct from {{riskStaleAgentIdentityBinding}} and {{riskShadowAndUnknownAgents}},
        which concern identity-lifecycle binding and registration rather than the confidentiality
        of secret material. It is distinct from {{riskSensitiveDataDisclosure}}, which
        covers the model disclosing sensitive data through its outputs; here the stolen
        asset is an authentication credential used as an access and impersonation primitive,
        not disclosed content.
      - >
        Potential impacts include unauthorized access to downstream tools and services
        under the stolen credential's full authority, exfiltration or manipulation of
        whatever data and systems the token can reach, and privilege escalation where
        the stolen credential is over-scoped or long-lived. Because the credential itself
        is valid, the compromise is difficult to detect and can persist until the token
        is explicitly revoked or expires.
    category: risksRuntimeDataSecurity
    personas:
      - personaAgenticProvider
      - personaPlatformProvider
      - personaApplicationDeveloper
      - personaEndUser
    controls:
      - controlAgentCredentialIsolation
      - controlInterComponentTransportSecurity
      - controlSessionCredentialBindingAndLifecycle
    examples:
      - >
        An MCP or remote-tool server persists the OAuth access tokens it brokers for downstream
        APIs in a world-readable config file or an unscrubbed environment variable. A
        local-privilege attacker or a co-tenant process reads the file and replays the
        bearer token against the downstream API, authenticating as the legitimate agent
        until the token expires or is revoked. CVE-2021-41077 is a real-world precedent
        for this exact asset class: a Travis CI build-time flaw let a forked public repository's
        pull request pull the parent repository's encrypted secret environment variables
        — decrypted and injected into the build environment — out via crafted build commands,
        exposing signing keys, access credentials, and API tokens across thousands of
        open-source projects ({{ref:cve-2021-41077}}).
      - >
        An agent framework logs full request headers, including Authorization bearer tokens
        and API keys, at debug verbosity. The logs are shipped to a shared observability
        backend with broad read access; an operator outside the trust boundary harvests
        long-lived API keys from the log stream and uses them to impersonate the service.
        requests-oauthlib, a widely-used Python OAuth client library, is a documented
        real instance of this exact mechanism: it logs Authorization/bearer-token headers
        unredacted at DEBUG verbosity ({{ref:requests-oauthlib-issue-536}}) — a library-level
        vulnerability class rather than a reported breach with a named victim, but a real,
        verifiable precedent for the flaw.
    tourContent:
      introduced:
        - >
          Introduced during development and deployment when secrets are embedded in configuration,
          environment variables, container images, or source repositories, when credentials
          are over-scoped or long-lived, and when logging or memory handling is not designed
          to keep secret material out of persistent or shared sinks.
      exposed:
        - >
          Exposed at runtime when an attacker reads secret material from storage, logs,
          process memory, or transmission and replays it. Because a stolen bearer token
          or API key is self-authenticating, the attacker operates as the victim principal
          and the legitimate identity remains valid throughout.
      mitigated:
        - >
          Mitigated by brokering secrets from a managed secret store rather than embedding
          them, issuing short-lived and narrowly scoped credentials, binding tokens to
          a transport or sender identity so a captured token cannot be replayed elsewhere,
          scrubbing secrets from logs and memory, and enforcing prompt rotation and revocation
          so the window of a usable stolen credential is small.
    mappings:
      stride:
        - Spoofing
        - InformationDisclosure
        - ElevationOfPrivilege
    lifecycleStage:
      - development
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
    actorAccess:
      - external
      - agent
      - privileged
    externalReferences:
      - type: cwe
        id: cwe-522
        title: 'CWE-522: Insufficiently Protected Credentials'
        url: https://cwe.mitre.org/data/definitions/522.html
      - type: cwe
        id: cwe-312
        title: 'CWE-312: Cleartext Storage of Sensitive Information'
        url: https://cwe.mitre.org/data/definitions/312.html
      - type: cve
        id: cve-2021-41077
        title: 'CVE-2021-41077: Travis CI Secrets-in-Environment-Variables Exposure'
        url: https://thehackernews.com/2021/09/travis-ci-flaw-exposes-secrets-of.html
      - type: news
        id: requests-oauthlib-issue-536
        title: Access tokens leaked in logs when using DEBUG level
        url: https://github.com/requests/requests-oauthlib/issues/536
  - id: riskCredentialAtRestExposure
    title: Credential At-Rest Exposure
    shortDescription:
      - >
        Recovery or theft of secrets and cryptographic key material from where an AI-system
        component stores them at rest — plaintext configuration, environment variables,
        container images, source repositories, memory or crash dumps, or an insufficiently
        protected secret store — yielding usable authority to downstream services, model-serving
        endpoints, and shared infrastructure.
    longDescription:
      - >
        AI systems and agentic platforms accumulate a large, heterogeneous set of secrets:
        API keys for model-serving endpoints, OAuth tokens for tool servers and MCP resources,
        database credentials for retrieval stores, signing keys for artifact integrity,
        and inter-component mTLS certificates. Credential At-Rest Exposure occurs when
        an adversary recovers one or more of these secrets from a storage location rather
        than intercepting them in transit — the attack surface is the storage layer, not
        the channel. Recovery vectors include plaintext values in source repositories
        and dotfiles, secrets embedded in container image layers, environment variables
        captured from process memory, unencrypted or world-readable configuration, crash
        dumps that include heap contents, over-permissioned or improperly sealed secret-store
        entries, and backup archives or object-storage buckets with excessive read permissions.
      - >
        The agentic amplifier is concentrated blast radius. A classical secrets breach
        typically compromises one service's credentials; an orchestrator, MCP server,
        or agentic-platform component routinely brokers credentials for many downstream
        services at once, so a single recovery event can authenticate the adversary to
        the full set of services the component interoperates with, across all tenants
        or workloads it serves. The underlying secret-recovery technique is classical;
        the AI-specific amplifier is the concentration of authority in one high-value
        location.
      - >
        Detection is characteristically delayed. Secrets recovered from static storage
        leave no runtime signal at the moment of recovery; the first observable event
        is typically downstream misuse. Without credential-use monitoring tied to the
        expected calling identity, the interval between recovery and detection can span
        weeks or months.
      - >
        This risk is distinct from {{riskCrossTenantCredentialPropagation}}, which addresses
        a valid, insufficiently tenant-scoped credential propagating across tenant boundaries;
        this risk addresses the prior step — recovering the secret from its storage location,
        independent of tenancy. It is distinct from {{riskSensitiveDataDisclosure}}, which
        addresses the model disclosing sensitive data through inference outputs; this
        is exfiltration of a stored secret from the holder side, not inference-time disclosure.
        It is distinct from {{riskModelExfiltration}} (asset = the model artifact, not
        credential material). It is distinct from {{riskStaleAgentIdentityBinding}} and
        {{riskShadowAndUnknownAgents}}, which address identity-lifecycle failures after
        issuance, not recovery of the secret value from storage.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaModelServing
      - personaEndUser
    controls:
      - controlSecretsAndKeyManagement
      - controlAgentCredentialIsolation
      - controlModelAndDataAccessControls
      - controlIsolatedConfidentialComputing
      - controlSecureByDefaultMLTooling
    examples:
      - >
        The CircleCI breach (January 2023) ({{ref:circleci-2023-breach-postmortem}}) exfiltrated
        customer secrets — environment variables, tokens, and keys — after attackers used
        a malware-infected engineer laptop to steal a valid session token and reach production
        systems where the datastore encryption key was also accessible at runtime.
      - >
        The Codecov supply-chain breach (April 2021) ({{ref:codecov-2021-supply-chain-breach}})
        modified the Bash Uploader script to exfiltrate environment variables — CI/CD
        secrets, API tokens, credentials — from every pipeline that sourced it, harvesting
        secrets held at rest in CI configuration.
      - >
        GitGuardian's State of Secrets Sprawl 2024 ({{ref:gitguardian-2024-secrets-sprawl}})
        found over 12.8M new secrets committed to public GitHub repositories in 2023,
        a persistent at-rest exposure class exploited by automated scanners.
    tourContent:
      introduced:
        - >
          Introduced during development and deployment when secrets are stored beyond
          the minimum necessary principal set — plaintext in repos, unencrypted config,
          image layers, or secret-store paths with excessive read permissions.
      exposed:
        - >
          Exposed at deployment and runtime when infrastructure access controls, secret-store
          permissions, or image/repository scanning fail to detect improperly stored credentials,
          and persists when rotation does not cover all storage locations a secret resides
          in.
      mitigated:
        - >
          Mitigated by centralizing secrets in a dedicated store with least-privilege
          access, scanning repos and images for committed credentials, enforcing short-lived
          lifetimes that bound the post-recovery window, and isolating high-value stores
          within confidential-computing boundaries.
