        title: runc container breakout via /proc/self/exe overwrite (CVE-2019-5736)
        url: https://nvd.nist.gov/vuln/detail/CVE-2019-5736
  - id: riskUnsandboxedCodeExecution
    title: Unsandboxed Execution of Model-Generated Code
    shortDescription:
      - >
        Code and commands emitted by a model are executed on the host with the full privileges
        of the invoking user instead of inside a confined, least-privilege sandbox, so
        even non-malicious but hallucinated or buggy generations can damage the host environment,
        read or destroy local data, or pivot to adjacent systems.
    longDescription:
      - >
        AI systems increasingly generate executable artifacts — shell commands, scripts,
        SQL, or program code ({{ref:cwe-94}}) — that are then run to satisfy a user request
        or to complete an agent's task. Unsandboxed Execution of Model-Generated Code
        occurs when that execution happens directly in the host environment with the ambient
        privileges of the calling user or service account, rather than within an isolation
        boundary (container, microVM, restricted subprocess, or capability-confined runtime)
        that bounds what the generated code may touch.
      - >
        This risk is a host-hardening and execution-isolation failure, not an output-validation
        failure. The triggering artifact does not need to be adversarial: model output
        is non-deterministic and may contain hallucinations, logic errors, or unsafe operations
        (recursive deletes, overly broad globs, destructive migrations) that a reviewed
        human-authored change would not contain. Because the execution context grants
        full user privileges ({{ref:cwe-250}}) and no sandbox interposes, a single faulty
        generation can corrupt or delete data, exhaust or reconfigure the host, or expose
        credentials reachable from that privilege level. Where the generation is additionally
        attacker-influenced (for example via prompt injection), the same missing isolation
        boundary is what converts a manipulated instruction into host compromise.
      - >
        Generalized beyond any single tooling protocol, the locus is the execution sandbox
        (or its absence) on the host where a model-driven or remote-tooling workflow runs
        generated code. Classical practice confines such execution with least-privilege
        service accounts, OS-level sandboxing (seccomp, namespaces, containers, microVMs),
        filesystem and network egress restrictions, and ephemeral throwaway environments.
        The AI-specific dimension is that the code author is a probabilistic model invoked
        at runtime without human review of each generation, so the blast radius of the
        execution context — not the trustworthiness of a specific author — becomes the
        controlling factor.
      - >
        This risk is distinct from {{riskInsecureModelOutput}}, which covers unvalidated
        model output reaching a user or downstream system; here the concern is that the
        output is executed as code and the host lacks an isolation boundary to contain
        the result. It is distinct from {{riskRogueActions}}, which covers manipulation
        or over-permissioning of the agent's action selection; this risk concerns the
        privilege and confinement of the host process that runs whatever code is produced,
        and applies even when the action selected is benign. It is distinct from {{riskRunawayAgentToolLoops}},
        which covers resource exhaustion through recursive tool-calling rather than the
        host-execution privilege boundary.
      - >
        Potential impacts include destruction or corruption of local data and configuration,
        disclosure of credentials or secrets reachable at the execution privilege level,
        lateral movement to systems the host can reach, and reduced host availability.
        Impact severity scales directly with the privileges of the execution context,
        which is why confinement and least-privilege execution are the controlling mitigations.
    category: risksRuntimeOutputSecurity
    personas:
      - personaApplicationDeveloper
      - personaAgenticProvider
      - personaPlatformProvider
      - personaEndUser
    controls:
      - controlIsolatedConfidentialComputing
      - controlAgentPluginPermissions
    examples:
      - >
        A developer-assistant agent generates and runs a shell command to clean up a build
        directory. A hallucinated path expansion causes the command to recurse above the
        intended directory and delete unrelated files, because the command ran with the
        developer's full account privileges inside the working host rather than in a scoped,
        read-only-by-default sandbox with an explicit writable path allowlist. This is
        not a hypothetical: in July 2025 an AI coding CLI issued a directory-creation
        command that silently failed, then proceeded as if the directory existed and issued
        file-move operations against that hallucinated path state, destroying files outside
        the intended scope with full ambient filesystem privilege and no sandbox or dry-run
        confirmation ({{ref:winbuzzer-2025-gemini-cli-file-deletion}}) — the tool's own
        postmortem response described the failure as "gross incompetence." A separate
        agent deleted a live production database during an explicit code freeze with no
        sandbox or confirmation boundary in place ({{ref:fortune-2025-replit-database-deletion}}),
        corroborating that unsandboxed ambient-privilege execution is an active, not merely
        theoretical, failure mode across multiple agent products.
    tourContent:
      introduced:
        - >
          Introduced during development and deployment when a model-driven or remote-tooling
          workflow is wired to execute generated code or commands using the ambient privileges
          of the host user or service account, with no isolation boundary (container,
          microVM, restricted subprocess) interposed between the generated artifact and
          the host.
      exposed:
        - >
          Exposed at runtime whenever the model emits executable output — whether through
          a benign hallucination or an attacker-influenced generation — and that output
          is run in the unconfined host context, allowing it to act with the caller's
          full privileges.
      mitigated:
        - >
          Mitigated by executing all model-generated code inside a least-privilege, confined
          runtime (container, microVM, or capability-restricted subprocess) with filesystem,
          network-egress, and privilege restrictions; using ephemeral throwaway execution
          environments; and gating destructive operations behind explicit human confirmation
          rather than relying on the trustworthiness of the generated artifact.
    mappings:
      stride:
        - ElevationOfPrivilege
        - Tampering
      owasp-top10-llm:
        - LLM05:2025
    lifecycleStage:
      - development
      - deployment
      - runtime
    impactType:
      - integrity
      - availability
      - confidentiality
      - safety
    actorAccess:
      - agent
      - user
      - external
    externalReferences:
