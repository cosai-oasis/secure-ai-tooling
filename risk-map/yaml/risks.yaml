        id: mcp-spec-2025-11-25-transports
        title: 'Model Context Protocol specification (2025-11-25): Transports'
        url: https://modelcontextprotocol.io/specification/2025-11-25/basic/transports
  - id: riskShadowAndUnknownAgents
    title: Shadow and Unknown Agents
    shortDescription:
      - >
        Unregistered agents operate with inherited or valid credentials outside
        identity lifecycle controls, creating persistent blind spots in agentic
        systems.
    longDescription:
      - >
        In dynamic agentic environments, agents can be created ad-hoc or spawned
        through orchestration layers without central registration. Shadow and
        Unknown Agents describes the risk when these unregistered agents retain
        or inherit credentials and tokens, allowing them to interact with tools
        and MCP servers undetected. This breaks the identity lifecycle and
        creates persistent blind spots in monitoring, attribution, and
        revocation.
      - >
        This risk is the AI-specific extension of two classical security
        challenges: Shadow IT (unauthorized systems operating outside governance
        processes) and orphaned account management (failure to tombstone
        decommissioned credentials). The key AI-specific amplifier is that
        orchestration layers can dynamically spawn credentialed agents without
        human approval — a capability with no direct classical equivalent.
      - >
        The vulnerability arises from incomplete provisioning controls,
        credential reuse across sessions, or weak network isolation. Attack
        vectors include compromised orchestration components that spawn hidden
        agents and failure to decommission old agent instances (creating "zombie"
        agents). Supply-chain injection of backdoored agent templates is a
        related vector addressed by {{riskToolSourceProvenance}} and
        {{riskToolRegistryTampering}}; this risk covers the downstream identity
        lifecycle failure when such agents persist undetected. The exposure is
        present where agents receive credentials without first registering with
        a central identity service, where there is no runtime mechanism to
        detect and block actions from unregistered or decommissioned agents,
        where credentials are reused across ephemeral agents, and where an
        orchestration layer that spawns a new agent passes credentials down by
        inheritance rather than issuing fresh, individually attested ones.
      - >
        The insider threat dimension is also relevant: a compromised or rogue
        insider can create shadow agents that persist beyond their own access
        revocation, analogous to classical insider threats via undocumented
        service accounts or orphaned API keys.
      - >
        Potential impacts include stealthy data exfiltration, unauthorized
        actions across tenants, and long-term attacker persistence. Consequences
        include accountability gaps (actions cannot be reliably attributed),
        compliance violations, and increased difficulty in incident response.
      - >
        {{riskZombieShadowMCPServers}} addresses decommissioned tool server
        endpoints; this risk addresses unregistered agent identities. Both share
        the lifecycle management failure mode but differ in the entity type
        affected.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaEndUser
    controls:
      - controlSecureByDefaultMLTooling
      - controlAgentObservability
      - controlAgentInventoryManagement
      - controlAgentIntegrityManagement
      - controlAgentCredentialIsolation
      - controlAgenticZeroTrustPosture
      - controlAIInfrastructureObservability
    examples:
      - >
        A Gartner survey of 302 cybersecurity leaders (2025) ({{ref:gartner-2025-genai-blind-spots-press-release}})
        found that 69% of organizations suspect or have evidence that employees are using
        prohibited public GenAI. Gartner predicts that by 2030, more than 40% of enterprises
        will experience security or compliance incidents linked to unauthorized shadow
        AI.
    tourContent:
      introduced:
        - >
          Introduced during deployment when orchestration layers or development
          teams create agents without central registration, or when provisioning
          controls do not require identity lifecycle enrollment before credential
          issuance.
      exposed:
        - >
          Exposed at runtime when unregistered agents interact with tools, MCP
          servers, or other agents using inherited or shared credentials. The
          exposure persists through maintenance cycles when decommissioning
          processes fail to revoke credentials for retired agents.
      mitigated:
        - >
          Mitigated by central agent inventory management requiring registration
          before credential issuance, cryptographic attestation of agent identity,
          runtime detection of unregistered agents, and automated credential
          revocation on lifecycle state changes.
    mappings:
      stride:
        - Spoofing
        - Repudiation
      mitre-atlas:
        - AML.T0012@5.0.1
    lifecycleStage:
      - deployment
      - runtime
      - maintenance
    impactType:
      - confidentiality
      - integrity
      - accountability
      - compliance
    actorAccess:
      - agent
      - privileged
      - supply-chain
      - infrastructure-provider
    externalReferences:
      - type: editorial
        id: gartner-2025-genai-blind-spots-press-release
        title: Gartner Identifies Critical GenAI Blind Spots That CIOs Must Urgently
          Address
        url: https://www.gartner.com/en/newsroom/press-releases/2025-11-19-gartner-identifies-critical-genai-blind-spots-that-cios-must-urgently-address0
  - id: riskRunawayAgentToolLoops
    title: Runaway Agent Tool Loops
    shortDescription:
      - >
        Agents enter uncontrolled recursive tool-calling cycles at the
        orchestration layer, exhausting context windows, compute resources, and
        API budgets through emergent autonomous behavior or adversarial trigger.
    longDescription:
      - >
        In agentic systems, autonomous agents invoke tools in sequence or
        recursively based on LLM reasoning. Runaway Agent Tool Loops occur when
        agents enter uncontrolled tool-calling cycles because termination
        conditions are absent, broken, or never satisfied. The primary failure
        mode is emergent: agents that loop because validation functions never
        return satisfying results, max_turns defaults are not set, or tool
        responses trigger further reasoning without convergence. No adversary
        is required.
      - >
        This risk extends classical infinite loop and fork bomb patterns to the
        agentic domain. In traditional systems, runaway processes are constrained
        by watchdog timers, process resource limits (ulimit, cgroups), and
        OS-level scheduling. The AI-specific amplifier is that LLM-driven agents
        make non-deterministic decisions about when to stop, and each tool call
        generates reasoning traces and tool response pairs that accumulate in
        the context window. The loop degrades the agent's ability to reason
        about stopping even as it continues — context-window saturation creates
        a feedback loop where the agent can no longer process enough history to
        recognize it should terminate.
      - >
        This risk is distinct from {{riskEconomicDenialOfWallet}}, which addresses
        adversarial resource exhaustion at the API billing layer through
        attacks on pricing models and billing mechanisms. Runaway Agent Tool
        Loops addresses autonomous agent behavior at the MCP orchestration
        layer, where impacts include context-window exhaustion (task fails
        silently or incompletely), availability degradation for co-tenants, and
        safety failures in time-sensitive systems — impacts with no financial
        dimension. Prompt injection can trigger runaway loops (see
        {{riskPromptInjection}}), but the underlying vulnerability is the absence
        of loop bounds at the orchestration layer: deployments that do not
        enforce per-agent, per-session, or per-tool-call resource budgets and
        rate limits, that allow recursive or deeply nested tool chains without
        an automatic bound or a human-approval checkpoint, that rely on MCP
        servers unable to reject or throttle requests based on cumulative
        context or cost, and that do not monitor for context-window saturation
        during tool-calling sequences.
      - >
        Potential impacts include context-window exhaustion leading to silent
        task failure, massive unexpected costs, service degradation for other
        users on shared infrastructure, and safety risks when time-sensitive
        agent tasks are delayed or never complete. Consequences range from
        financial damage to availability failures and loss of trust in
        autonomous agent systems.
    category: risksRuntimeInputSecurity
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaEndUser
    controls:
      - controlAgentObservability
      - controlAgentExecutionBounds
    examples:
      - >
        The Microsoft AutoGen infinite loop issue (#108) ({{ref:github-autogen-infinite-loops-issue-108}})
        documented agents entering infinite tool-calling cycles because the termination
        condition checked for exact "TERMINATE" text, but agents generated variations
        that never matched. The loop continued until OpenAI rate limits triggered. No
        adversary was involved — the failure was emergent from a broken termination function,
        demonstrating the autonomous failure mode that distinguishes this risk from adversarial
        cost-spike attacks.
    tourContent:
      introduced:
        - >
          Introduced during deployment when agent orchestration frameworks are
          configured without default tool-call limits, context-window budgets,
          or termination condition validation.
      exposed:
        - >
          Exposed at runtime when an agent enters a recursive tool-calling cycle
          that consumes context window, compute, and API budget without
          converging on a result or triggering a termination condition.
      mitigated:
        - >
          Mitigated by enforcing per-agent, per-session, and per-tool-call
          resource budgets; setting mandatory max_turns defaults in orchestration
          frameworks; monitoring for context-window saturation and loop patterns;
          and implementing circuit breakers that halt agent execution when
          cumulative resource thresholds are exceeded.
    mappings:
      stride:
        - DenialOfService
      mitre-atlas:
        - AML.T0034.002@5.0.1
      owasp-top10-llm:
        - LLM10:2025
    lifecycleStage:
      - runtime
    impactType:
      - availability
      - safety
    actorAccess:
      - agent
    externalReferences:
      - type: editorial
        id: github-autogen-infinite-loops-issue-108
        title: 'Microsoft AutoGen Issue #108: Infinite Loops with GPT-4'
        url: https://github.com/microsoft/autogen/issues/108
  - id: riskAgenticDelegationConfusedDeputy
    title: Agentic Delegation Confused Deputy
    shortDescription:
      - >
        A high-privilege agent acts on behalf of a less-privileged caller
        without validating the caller's authorization at the delegation
        boundary, allowing the caller to escalate privileges through the
        deputy's own permissions.
    longDescription:
      - >
        In agentic systems, agents with elevated privileges frequently act on
        behalf of other agents, users, or external inputs through delegation
        mechanisms such as OAuth token exchange and MCP tool invocation. The
        Agentic Delegation Confused Deputy occurs when a high-privilege agent
        (the deputy) performs an action that the caller could not do directly,
        because the deputy does not validate the caller's authorization at the
        delegation boundary. The deputy uses its own permissions without
        distinguishing the caller's authority from its own.
      - >
        This risk is a direct extension of the classical confused deputy problem, first
        identified by Norm Hardy in 1988 when a compiler with file system privileges was
        tricked into overwriting its billing file by a user who supplied a system path
        as the output filename. The pattern recurs across computing eras: CSRF exploits
        the browser as a confused deputy (using session cookies on behalf of a malicious
        cross-origin caller), and AWS cross-account role assumption ({{ref:aws-iam-confused-deputy}})
        without ExternalId validation allows a third-party vendor to be tricked into assuming
        a victim's IAM role. The AI-specific amplifier is threefold: (1) the deputy's
        capability set expands dynamically at runtime via MCP server discovery, making
        the attack surface unpredictable; (2) the deputy autonomously decides which tools
        to invoke based on LLM reasoning, not static dispatch; (3) multi-hop delegation
        can chain multiple confused deputies, amplifying the privilege escalation.
      - >
        Attack vectors include indirect prompt injection via user-submitted
        data, poisoned MCP tool descriptions, crafted tool responses, and
        legitimate-looking API calls from less-privileged agents. The trigger
        mechanism varies (see {{riskPromptInjection}} for injection attacks
        specifically), but the underlying vulnerability is the same: the deputy
        does not check the caller's authorization scope before acting, and
        cannot distinguish that scope from its own when it selects which tools
        to invoke. The exposure persists wherever a delegation step does not
        enforce least-privilege narrowing together with an explicit
        caller-authorization check, wherever confused-deputy protections are
        applied at only one of the IAM and MCP layers rather than both, and
        wherever there is no runtime detection of an agent executing an action
        that exceeds the caller's authorization scope.
      - >
        This risk is distinct from {{riskRogueActions}}, which covers unintended
        agent actions broadly (accidental and malicious). The confused deputy
        specifically addresses the authorization failure at delegation
        boundaries — the caller could not perform the action directly, but the
        deputy does it using its own permissions. Rogue actions can occur in
        single-agent systems; the confused deputy requires asymmetric privilege
        across a delegation boundary. {{riskAgentDelegationChainOpacity}} addresses
        the inability to see who authorized an action; this risk addresses the
        failure to check whether the caller was authorized.
      - >
        Potential impacts include unauthorized data access across trust
        boundaries, financial transactions executed on behalf of unauthorized
        callers, infrastructure modifications, and privilege escalation chains
        in multi-agent systems. Consequences include accountability failures,
        regulatory non-compliance, and amplified blast radius when the deputy's
        permissions span multiple services or tenants.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaEndUser
    controls:
      - controlSecureByDefaultMLTooling
      - controlAgentPluginPermissions
      - controlAgentObservability
      - controlComponentIdentityAuthentication
      - controlDelegatedAuthorizationIntegrity
      - controlDelegatedAuthorityConfinement
      - controlExternalizedAuthorizationDecisioning
      - controlTrustedPolicyEnforcementPoint
      - controlResourceAuthorizationEnforcement
      - controlAgenticZeroTrustPosture
    examples:
      - >
        In the Supabase/Cursor data exfiltration (2025) ({{ref:generalanalysis-2026-supabase-mcp}}),
        a developer's Cursor IDE agent connected to Supabase using service_role credentials
        that bypassed all Row-Level Security. An attacker embedded SQL exfiltration commands
        in a support ticket. When the agent summarized tickets, it executed the attacker's
        commands with its elevated permissions, exfiltrating OAuth secrets the ticket
        author could never access directly — a textbook confused deputy where the agent
        used its own root-level database access without validating the caller's authorization.
      - >
        In the Invariant Labs WhatsApp MCP exploit (2025) ({{ref:invariantlabs-2025-whatsapp-mcp-exploited}}),
        a malicious MCP server poisoned its tool descriptions with hidden instructions
        targeting a co-installed WhatsApp MCP server. The agent — which had legitimate
        WhatsApp send authority — exfiltrated chat history to an attacker-controlled number.
        The malicious server had no WhatsApp access of its own; it exploited the agent
        as a confused deputy to launder its requests through the agent's cross-server
        authority.
    tourContent:
      introduced:
        - >
          Introduced during deployment when agent delegation boundaries are
          configured without caller authorization validation — specifically when
          high-privilege agents accept delegation requests without verifying
          whether the caller's authority matches the requested action's
          privilege level.
      exposed:
        - >
          Exposed at runtime when a less-privileged caller (another agent,
          external input, or low-privilege user) submits a request that the
          high-privilege deputy fulfills using its own permissions. The deputy
          cannot distinguish the caller's authorization scope from its own.
      mitigated:
        - >
          Mitigated by enforcing caller authorization validation at every
          delegation boundary, scoping the deputy's effective permissions to
          the intersection of its own permissions and the caller's
          authorization, and applying least-privilege narrowing at each
          delegation hop.
    mappings:
      stride:
        - ElevationOfPrivilege
        - Spoofing
      mitre-atlas:
        - AML.T0053@5.0.1
      owasp-top10-llm:
        - LLM06:2025
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
      - accountability
      - compliance
    actorAccess:
      - agent
      - external
      - user
    externalReferences:
      - type: spec
        id: aws-iam-confused-deputy
        title: 'AWS IAM User Guide: The confused deputy problem'
        url: https://docs.aws.amazon.com/IAM/latest/UserGuide/confused-deputy.html
      - type: paper
        id: generalanalysis-2026-supabase-mcp
        title: Supabase MCP can leak your entire SQL database
        url: https://generalanalysis.com/blog/supabase-mcp-blog
      - type: paper
        id: invariantlabs-2025-whatsapp-mcp-exploited
        title: 'WhatsApp MCP Exploited: Exfiltrating your message history via MCP'
        url: https://invariantlabs.ai/blog/whatsapp-mcp-exploited
  - id: riskCrossTenantCredentialPropagation
    title: Cross-Tenant Credential Propagation
    shortDescription:
      - >
        Shared or insufficiently tenant-scoped agent credentials allow a
        compromise in one tenant to propagate access across tenant boundaries
        through the identity layer.
    longDescription:
      - >
        Multi-tenant agentic platforms frequently share infrastructure
        components across tenants for efficiency — base models, credential
        pools, MCP tool server endpoints, and OAuth token caches. Cross-Tenant
        Credential Propagation occurs when agent identities or credentials are
        not strictly scoped to individual tenants, allowing a compromise in one
        tenant to authenticate to another tenant's resources through the shared
        identity layer.
      - >
        This risk extends what the Cloud Security Alliance identifies as
        "Insufficient Identity, Credential, and Access Management" — a top
        cloud threat — to the agentic domain. Multi-tenant SaaS systems have
        long struggled with shared service accounts, wildcard TLS certificates,
        shared OAuth client credentials, and connection pool credentials that
        cross tenant boundaries. CWE-653 (Insufficient Compartmentalization)
        captures the general pattern of failing to isolate security domains.
        The AI-specific amplifier is that agentic platforms additionally share
        model serving endpoints, MCP tool registries, and OAuth token pools
        across tenants, and the dynamic nature of agent delegation means a
        compromised credential can propagate through delegation chains across
        tenant boundaries — agents autonomously use credentials without human
        verification at each hop.
      - >
        The vulnerability arises from insufficient tenant scoping at the agent
        identity layer: shared OAuth client credentials, MCP tokens that are
        valid across tenants, or agent identity pools that serve multiple
        organizations. A compromise in one tenant — through credential theft,
        infrastructure exploitation, or insider access — yields credentials
        that work across tenant boundaries because nothing restricts their
        scope to the originating tenant. The exposure is present wherever
        agent identities are not strictly scoped to a single tenant, wherever
        credential pools, OAuth token caches, and MCP server endpoints are
        shared rather than isolated per tenant, and wherever tenant-boundary
        validation is not enforced at every MCP hop and delegation step — any
        of which lets a compromise confined to one tenant reach another
        tenant's resources.
      - >
        This risk is distinct from {{riskAcceleratorAndSystemSideChannels}}, which
        covers hardware-layer cross-tenant leakage (timing, cache, speculative
        execution). It is also distinct from {{riskPromptResponseCachePoisoning}},
        which covers cross-user contamination via shared LLM caches. This risk
        specifically addresses the identity and credential layer — shared or
        unscoped credentials that allow authentication across tenant boundaries.
      - >
        Potential impacts include widespread data breaches spanning multiple
        tenants, unauthorized cross-tenant actions, intellectual property theft,
        and complete breakdown of multi-tenancy guarantees. Consequences include
        major compliance violations (GDPR, SOC 2), loss of customer trust, and
        systemic risk across the shared platform.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaEndUser
    controls:
      - controlSecureByDefaultMLTooling
      - controlAgentPluginPermissions
      - controlIsolatedConfidentialComputing
      - controlAgentCredentialIsolation
      - controlDelegatedAuthorityConfinement
      - controlAgenticZeroTrustPosture
    examples:
      - >
        The Asana MCP cross-tenant data exposure (2025) ({{ref:bleepingcomputer-2025-asana-mcp-data-exposure}})
        demonstrated this pattern directly in the agentic domain: a logic flaw in Asana's
        MCP server feature exposed data from one organization's instance to other organizations'
        MCP users for approximately 1,000 customers, because tenant context was not maintained
        across MCP sessions.
      - >
        Wiz researchers discovered the BingBang vulnerability (2023) ({{ref:wiz-2023-bingbang-aad-misconfiguration}})
        affecting approximately 25% of Azure AD multi-tenant application registrations,
        which accepted valid OAuth tokens from any Azure tenant without checking the tenant
        ID claim. A token issued for an attacker's tenant was accepted by apps belonging
        to other tenants, including Microsoft's internal Bing management applications
        — a cross-tenant credential propagation through the identity layer where the credential
        itself was valid across tenant boundaries.
      - >
        In the UNC6395/Salesloft Drift breach (2025) ({{ref:valencesecurity-2025-salesforce-oauth-breach}}),
        a threat actor compromised Salesloft's infrastructure and stole per-customer OAuth
        tokens that Drift stored for approximately 700 Salesforce organizations. Each
        bearer token granted direct Salesforce API access bypassing MFA — a single compromise
        of a multi-tenant intermediary's centralized credential store yielded cross-tenant
        access through the identity layer.
    tourContent:
      introduced:
        - >
          Introduced during deployment when agent identities, credential pools,
          or MCP server endpoints are configured to serve multiple tenants
          without strict tenant-scoped isolation at the identity layer.
      exposed:
        - >
          Exposed at runtime when a compromise in one tenant (credential theft,
          infrastructure exploitation, or insider access) yields credentials
          that authenticate to other tenants' resources because the credentials
          are not tenant-scoped.
      mitigated:
        - >
          Mitigated by issuing strictly tenant-scoped agent credentials with no
          cross-tenant validity, enforcing tenant boundary validation at every
          MCP hop and delegation step, and isolating credential pools, token
          caches, and MCP endpoints per tenant.
    mappings:
      stride:
        - ElevationOfPrivilege
        - InformationDisclosure
      mitre-atlas:
        - AML.T0012@5.0.1
        - AML.T0055@5.0.1
      owasp-top10-llm:
        - LLM06:2025
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
      - compliance
      - privacy
    actorAccess:
      - agent
      - privileged
      - infrastructure-provider
    externalReferences:
      - type: news
        id: bleepingcomputer-2025-asana-mcp-data-exposure
        title: Asana warns MCP AI feature exposed customer data to other orgs
        url: https://www.bleepingcomputer.com/news/security/asana-warns-mcp-ai-feature-exposed-customer-data-to-other-orgs/
      - type: editorial
        id: valencesecurity-2025-salesforce-oauth-breach
        title: 'Salesforce OAuth Token Breach: What Every Security Team Must Know'
        url: https://www.valencesecurity.com/resources/blogs/salesforce-oauth-token-breach-what-every-security-team-must-know
      - type: paper
        id: wiz-2023-bingbang-aad-misconfiguration
        title: 'BingBang: AAD misconfiguration led to Bing.com results manipulation and
          account takeover'
        url: https://www.wiz.io/blog/azure-active-directory-bing-misconfiguration
  - id: riskZombieShadowMCPServers
    title: Zombie / Shadow MCP Servers
    shortDescription:
      - >
        Decommissioned or unregistered MCP servers remain accessible and respond
        to agent tool calls, allowing attackers to intercept or redirect
        legitimate requests.
    longDescription:
      - >
        MCP servers expose tools to agents and are frequently created, scaled,
        or retired during operations. Zombie / Shadow MCP Servers occur when
        decommissioned servers are not fully removed from service discovery,
        DNS, load balancers, or tool registries, leaving stale endpoints that
        remain responsive to agent connections. An attacker who claims the
        abandoned endpoint receives all tool calls that agents route to it.
      - >
        This risk is the agentic extension of dangling DNS and subdomain takeover — a
        well-documented vulnerability pattern ({{ref:owasp-wstg-4-2-10-subdomain-takeover}})
        where orphaned DNS records to decommissioned cloud services allow attackers to
        claim abandoned resources and intercept traffic. The AI-specific amplifier is
        that agents autonomously discover and invoke tool servers without human verification
        at each call. In classical systems, a developer would notice a stale API endpoint
        returning unexpected responses; in agentic systems, the agent silently processes
        the zombie server's responses as legitimate tool output, potentially poisoning
        reasoning chains that influence downstream actions.
      - >
        Transport security alone does not close this gap: an attacker who
        controls DNS for a stale endpoint can obtain a valid ACME-issued
        certificate, and mTLS will authenticate them as a "valid" server.
        Transport security works as specified — the missing layer is provenance
        binding to the registered principal. This is why the risk requires a
        registry-bound provenance control ({{controlComponentIdentityProvenance}})
        in addition to transport security and inventory management.
      - >
        The vulnerability stems from incomplete lifecycle management: tool
        server entries persist in registries, DNS, or agent configurations
        after the legitimate server is decommissioned. Dynamic discovery
        mechanisms that do not require runtime attestation or liveness
        verification exacerbate the risk — agents trust registry presence as
        proof of legitimacy. The exposure is present where an MCP server can
        become discoverable without registering under cryptographic
        attestation, where decommissioning does not guarantee complete removal
        from every discovery mechanism (registry, DNS, load balancer, and
        agent configuration alike), where agents do not re-verify a tool
        server's liveness and identity at invocation time rather than trusting
        the discovery-time record, and where nothing automatically detects and
        blocks calls routed to decommissioned or unverified endpoints.
      - >
        This risk is distinct from {{riskToolSourceProvenance}}, which addresses
        adopting unvetted tool sources — zombie servers were previously vetted
        and legitimate. It is distinct from {{riskToolRegistryTampering}}, which
        addresses active modification of registry entries — zombie servers
        involve stale entries that were never cleaned up. It is distinct from
        {{riskInsecureIntegratedComponent}}, which addresses vulnerabilities in
        running tool implementations — zombie servers involve the absence of a
        legitimate tool at an endpoint now controlled by an attacker.
        {{riskShadowAndUnknownAgents}} addresses unregistered agent identities;
        this risk addresses decommissioned tool server endpoints.
      - >
        Potential impacts include stealthy interception of tool calls, injection
        of malicious schemas or responses, data exfiltration from agent
        interactions, and persistent attacker access long after official
        decommissioning. Consequences include undetected breaches, compliance
        failures, and erosion of trust in the agentic infrastructure.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaEndUser
    controls:
      - controlAgentObservability
      - controlAgentInventoryManagement
      - controlInterComponentTransportSecurity
      - controlComponentIdentityProvenance
      - controlComponentIdentityAuthentication
      - controlInboundNetworkExposureAndSegmentation
      - controlAIInfrastructureObservability
    examples:
      - >
        Dangling DNS and subdomain takeover is a well-documented vulnerability pattern
        (OWASP) ({{ref:owasp-wstg-4-2-10-subdomain-takeover}}) where orphaned DNS CNAME
        records to decommissioned cloud services allow attackers to claim the abandoned
        resource and intercept all traffic. The MCP equivalent: a tool registry entry
        persists after server decommissioning, and an attacker claims the stale endpoint
        URL — agents route tool calls to the attacker automatically because they trust
        registry presence without runtime liveness verification.
      - >
        ACME certificate authorities (e.g., Let's Encrypt) automate issuance of
        domain-validated certificates based solely on control of the DNS record
        at issuance time. An attacker who claims a decommissioned subdomain can
        obtain a valid ACME certificate within minutes, and mTLS between agent
        and the reclaimed endpoint will succeed. Transport security is not
        broken in this scenario — it is working exactly as specified. The
        missing control is runtime attestation that the authenticated key
        holder is the currently registered, non-revoked principal for the role,
        not merely the holder of a key bound to the domain.
    tourContent:
      introduced:
        - >
          Introduced during deployment when MCP servers are provisioned and
          registered in tool registries, DNS, or agent configurations.
      exposed:
        - >
          Exposed at runtime when decommissioned servers are not fully removed
          from all discovery mechanisms. Agents continue calling stale endpoints
          because registry presence implies legitimacy. The exposure persists
          through maintenance cycles when decommissioning processes are
          incomplete.
      mitigated:
        - >
          Mitigated by requiring cryptographic attestation and runtime liveness
          verification for all MCP server endpoints, automating removal from
          all discovery mechanisms on decommission, and monitoring for agent
          calls to unresponsive or unverified endpoints.
    mappings:
      stride:
        - Spoofing
        - Tampering
        - InformationDisclosure
      mitre-atlas:
        - AML.T0010.001@5.0.1
      owasp-top10-llm:
        - LLM03:2025
    lifecycleStage:
      - deployment
      - runtime
      - maintenance
    impactType:
      - confidentiality
      - integrity
    actorAccess:
      - external
      - supply-chain
    externalReferences:
      - type: spec
        id: owasp-wstg-4-2-10-subdomain-takeover
        title: 'OWASP Web Security Testing Guide 4.2.10: Test for Subdomain Takeover'
        url: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/10-Test_for_Subdomain_Takeover
  - id: riskConcentratedAccessCorrelation
    title: Concentrated Access Enabling Cross-Service Correlation
    shortDescription:
      - >
        A single brokering layer that aggregates broadly-scoped access to many disparate
        services lets a partial compromise correlate data across those services, building
        a comprehensive profile of the affected users or organizations.
    longDescription:
      - >
        Agentic systems increasingly route an agent's access to many downstream services
        — mail, calendar, files, finance, ticketing, CRM — through a single brokering
        or aggregation layer (an MCP gateway, an A2A or UCP intermediary, or an agentic
        platform's connector hub) so the agent can compose those services in one session.
        Concentrated Access Enabling Cross-Service Correlation occurs when that single
        layer holds simultaneous, broadly-scoped access to disparate services, so a partial
        compromise of the layer — a leaked token, a confused-deputy invocation, or a foothold
        on the broker host — yields reach across all of them at once. The attacker then
        correlates and aggregates data pulled from each service to assemble a comprehensive
        profile of the affected users or organizations.
      - >
        This is the agentic expression of a classical principle: the concentration violates
        segregation of access ({{ref:cwe-653}}, Insufficient Compartmentalization) and
        least-privilege scoping. The privacy harm is the long-studied aggregation problem
        — individually innocuous records (a calendar entry, a shipping address, a transaction
        memo) become identifying and exploitable once one actor can join them across previously-segregated
        systems. A shared single-sign-on broker, an over-scoped OAuth service account,
        or a data-warehouse account that fronts many backends produces the same single-point
        cross-service exposure. The AI-specific amplifier is that agentic brokers are
        designed to hold broad, multi-service scope concurrently and exercise it autonomously
        without per-step human verification, so the concentrated surface is larger and
        is exercised continuously rather than on demand.
      - >
        The exposure is present wherever a single layer mediates access to multiple disparate
        services without partitioning that access by service, session, or task; wherever
        the credentials or connection that layer holds are broadly scoped rather than
        reduced to the minimum services a given task requires; and wherever the data flowing
        through the broker is not minimized to what each request needs. Any of these lets
        a foothold confined to one layer become correlated visibility across every service
        the layer can reach.
      - >
        This risk is distinct from {{riskSensitiveDataDisclosure}}, which covers the model
        disclosing sensitive data it already holds; here the harm is an attacker joining
        factual data across services reachable from one concentrated layer. It is distinct
        from {{riskInferredSensitiveData}}, which is model-side inference of unstated
        attributes, whereas this is attacker-side correlation of real records. It is distinct
        from {{riskCrossTenantCredentialPropagation}}, which is lateral movement across
        tenant boundaries through shared credentials; this risk is cross-service aggregation
        within a victim's own authorized scope, concentrated at one layer. It is also
        distinct from {{riskExcessiveDataHandlingDuringInference}}, which is the platform
        over-collecting user data, whereas this is an adversary exploiting concentrated
        breadth of access.
      - >
        Potential impacts include comprehensive victim profiling that enables sophisticated
        spear-phishing, extortion, and identity theft, large-scale privacy violation,
        and compliance exposure (GDPR, sector privacy regimes) arising from the breadth
        of correlated data a single compromise can reach.
    category: risksRuntimeDataSecurity
    personas:
      - personaAgenticProvider
      - personaPlatformProvider
      - personaApplicationDeveloper
      - personaEndUser
    controls:
      - controlAgentPluginPermissions
      - controlModelAndDataAccessControls
      - controlRuntimePrivacyEnhancingTechnologies
      - controlAgentCredentialIsolation
    examples:
      - >
        A single agentic broker is provisioned with broad connectors to a user's mailbox,
        calendar, cloud drive, and payment history so the assistant can answer scheduling
        and expense questions. A leaked broker token gives an attacker read access to
        all four at once; by joining travel itineraries (calendar), receipts (drive),
        and card memos (payments) the attacker assembles a movement-and-finance profile
        precise enough to drive targeted extortion — an exposure none of the four services
        would have produced in isolation. A real 2026 breach demonstrates this mechanism
        at scale: a single compromised OAuth token belonging to an employee of an agentic
        integration platform was used to pivot into an internal monitoring tool and reach
        a shared credential cache, exposing roughly 10,242 tokens and API keys spanning
        every third-party service (GitHub, Slack, Jira, HubSpot, Linear, Notion, Google
        Calendar) that customers had connected through the platform — one leaked credential
        functioning as a skeleton key across every connected service at once ({{ref:material-2026-composio-breach}}).
    tourContent:
      introduced:
        - >
          Introduced during development and deployment when an agent's access to many
          disparate services is routed through one brokering or aggregation layer that
          is granted broad, concurrent, cross-service scope rather than per-service or
          per-task partitioned access.
      exposed:
        - >
          Exposed at runtime when a partial compromise of the concentrated layer — a leaked
          or replayed token, a confused-deputy call, or a foothold on the broker — lets
          an attacker read across every reachable service and correlate the results into
          a comprehensive profile.
      mitigated:
        - >
          Mitigated by partitioning and minimizing the access the broker holds (least-privilege,
          per-service and per-task scoping), isolating credentials per downstream service
          so one layer never concentrates keys to all of them, minimizing the data each
          request surfaces, and detecting anomalous cross-service read/aggregation patterns
          at the broker.
    mappings:
      stride:
        - InformationDisclosure
      owasp-top10-llm:
        - LLM02:2025
    lifecycleStage:
      - development
      - deployment
      - runtime
    impactType:
      - confidentiality
      - privacy
      - compliance
    actorAccess:
      - agent
      - api
      - external
    externalReferences:
      - type: cwe
        id: cwe-653
        title: 'CWE-653: Improper Isolation or Compartmentalization'
        url: https://cwe.mitre.org/data/definitions/653.html
      - type: news
        id: material-2026-composio-breach
        title: 'The Composio Breach: One Token, 10,242 Doors'
        url: https://material.security/resources/the-composio-breach-one-token-10242-doors
  - id: riskLongLivedSessionStateWeakness
    title: Long-Lived Session State Weakness
    shortDescription:
      - >
        Extended agentic and conversational sessions keep session tokens, cached authorization,
        and accumulated session state valid for long windows, so classical session-handling
        weaknesses — fixation, missing token rotation, no timeout, and authorization that
        is never re-evaluated — gain a far larger exploitation window than short request/response
        sessions.
    longDescription:
      - >
        Agentic and conversational AI systems establish sessions that are intentionally
        long-lived: multi-turn conversations that persist for hours or days, persistent
        agent workflows, and protocol sessions (for example MCP or agent-to-agent channels)
        that remain open across many tool invocations. Long-Lived Session State Weakness
        is the risk that the session-handling mechanics — how the session identifier is
        established, rotated, timed out, bound, and re-authorized — do not account for
        this extended duration, so the temporal window in which a session token, a cached
        authorization decision, or accumulated session state can be abused is correspondingly
        large.
      - >
        This is the AI-specific extension of classical session-management weaknesses catalogued
        in {{ref:owasp-session-management-cheat-sheet}} and {{ref:nist-sp-800-63b-session}}:
        session fixation (an attacker pre-seeds a session identifier that the victim then
        authenticates into), missing session token rotation (a token captured once remains
        valid for the entire conversation), absent idle and absolute session timeouts
        (a session never expires while the application is in use), and stale authorization
        (an authorization decision made once at session start is never re-evaluated, so
        a user whose entitlements are revoked mid-conversation continues to act with the
        original scope). The AI-specific amplifier is that these sessions are deliberately
        long-lived and that an agent autonomously continues to act under the established
        session without any human re-affirmation, so a window that classical guidance
        keeps short by design is, here, intentionally extended.
      - >
        The exposure is present wherever a session identifier is not rotated after authentication
        or privilege change, wherever sessions lack both idle and absolute timeouts, wherever
        authorization for in-session actions is evaluated only once at session establishment
        rather than re-checked as the session continues, and wherever conversational or
        agent session state accumulated over a long session is not bounded or re-validated.
        The duration of the session is the differentiator: the same handling weakness
        on a short request/response session presents a small window, while on a long-lived
        session it presents a persistent one.
      - >
        This risk is distinct from {{riskMCPTransportHijacking}}, which covers an attacker
        intercepting, modifying, or replaying messages on the transport channel; that
        risk concerns the channel in transit, while this risk concerns the lifecycle and
        re-evaluation of the session itself and applies even on a fully encrypted, mutually
        authenticated channel. It is distinct from {{riskStaleAgentIdentityBinding}},
        in which an agent's identity persists after the underlying model artifact is swapped;
        this risk concerns the session and user-authorization context going stale over
        time regardless of the model behind the agent. It is distinct from {{riskCrossTenantCredentialPropagation}},
        which covers credentials crossing tenant boundaries in space; this risk concerns
        staleness within a single session over time. It is distinct from {{riskExcessiveDataHandlingDuringInference}},
        which covers privacy and retention of user data; this risk concerns the security
        of the session-handling state itself.
      - >
        Potential impacts include session hijacking that grants an attacker the victim's
        full in-session authority, continued action under authorization that should have
        been revoked, and abuse of a captured long-lived token across many tool invocations.
        Because the session and its credentials remain valid, the breach is difficult
        to detect: the agent continues to authenticate normally while the session has
        been fixed, stolen, or has outlived the authority it was granted.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaEndUser
    controls:
      - controlAgentCredentialIsolation
      - controlApplicationAccessManagement
      - controlAgentObservability
      - controlSessionCredentialBindingAndLifecycle
    examples:
      - >
        Persistent conversational and agentic sessions are designed to remain open across
        long durations and many tool calls. When the session identifier issued at authentication
        is never rotated and the session carries no idle or absolute timeout, a token
        captured once — for example from a client log, a proxy, or a compromised endpoint
        — remains usable for the full life of the conversation, granting the attacker
        session hijack: full standing access under the original authorization even after
        the user's entitlements have been reduced or revoked. Facebook's September 2018
        "View As" breach demonstrates this harm at scale in production: a code defect
        caused Facebook to mint access tokens carrying full mobile-app-level session privileges
        that were never re-scoped or re-validated as context changed; attackers stole
        roughly 30 million of these standing tokens and used them for continued, non-reauthenticated
        account access until Facebook force-reset around 90 million tokens ({{ref:meta-2018-view-as-breach}}).
        CircleCI's January 2023 breach is a second, session-specific precedent: an attacker
        reused a single stolen, already-past-2FA SSO session cookie to retain valid production
        access with no re-authentication required for the duration of its validity ({{ref:circleci-2023-incident-report}}).
    tourContent:
      introduced:
        - >
          Introduced during deployment when long-lived agentic or conversational sessions
          are configured without session token rotation, without idle and absolute timeouts,
          and without re-evaluation of authorization for in-session actions.
      exposed:
        - >
          Exposed at runtime when an attacker fixes or captures a long-lived session identifier,
          or when a user's authorization changes mid-session and the agent continues to
          act under the stale, still-valid session.
      mitigated:
        - >
          Mitigated by rotating session identifiers on authentication and on privilege
          change, enforcing both idle and absolute session timeouts, re-evaluating authorization
          for in-session actions rather than only at session start, and scoping session
          tokens to short, bounded lifetimes with explicit re-authentication for long-running
          agent workflows.
    mappings:
      stride:
        - Spoofing
        - ElevationOfPrivilege
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
      - accountability
    actorAccess:
      - external
      - user
    externalReferences:
      - type: spec
        id: owasp-session-management-cheat-sheet
        title: OWASP Session Management Cheat Sheet
        url: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
      - type: spec
        id: nist-sp-800-63b-session
        title: 'NIST SP 800-63B: Digital Identity Guidelines — Session Management'
        url: https://pages.nist.gov/800-63-3/sp800-63b.html
      - type: news
        id: meta-2018-view-as-breach
        title: Security Update (the "View As" access-token breach)
        url: https://about.fb.com/news/2018/09/security-update/
      - type: news
        id: circleci-2023-incident-report
        title: January 4, 2023 Security Incident
        url: https://circleci.com/blog/jan-4-2023-incident-report/
  - id: riskAgentIdentitySpoofing
    title: Agent Identity Spoofing
    shortDescription:
      - >
        An attacker presents stolen, forged, or unverified credentials to a shared agent
        service and is accepted as a legitimate client or agent, because the endpoint
        does not strongly authenticate the requesting principal.
    longDescription:
      - >
        In agentic and remote-tooling deployments, clients and agents authenticate to
        a shared service (an MCP server, tool endpoint, or orchestration plane) before
        issuing tool calls. Agent Identity Spoofing is the risk that an attacker is accepted
        as a legitimate principal at this boundary because authentication of the requester
        is weak, optional, or misconfigured. The attacker then operates under a borrowed
        identity: invoking tools, reading or writing resources, and emitting actions that
        are attributed to the impersonated client. This is the authentication-weakness
        root cause of impersonation, distinct from downstream identity-lifecycle and attribution
        failures.
      - >
        This risk is the agentic instance of a classical security problem rather than
        a novel AI failure mode. It maps directly to STRIDE Spoofing and to long-standing
        endpoint-authentication weaknesses: bearer tokens accepted without proof of possession,
        missing or one-way TLS where mutual authentication is required, default or shared
        service credentials, and endpoints that expose privileged operations without authenticating
        the caller at all. The reference posture is zero-trust enforcement (NIST SP 800-207):
        every request to a protected resource passes a policy enforcement point (PEP)
        that verifies the requester's asserted identity against a policy decision point
        (PDP) before access is granted. The amplifier in agentic systems is that emerging
        protocols frequently leave requester authentication to the deployer and ship with
        permissive defaults, so the weakness is a configuration norm rather than an exception.
      - >
        The vulnerability arises wherever a service accepts a request without strongly
        verifying the identity of the requesting principal: endpoints that trust a bearer
        token without binding it to the holder, that omit mutual authentication on agent-to-service
        hops, that accept self-asserted client identifiers, that rely on network position
        as a proxy for identity, or that ship with shared or default credentials. Attack
        vectors include presenting a stolen or replayed token, connecting to an unauthenticated
        or weakly authenticated endpoint, and exploiting a misconfigured trust anchor
        to forge an accepted identity. The impersonation succeeds at the authentication
        boundary, before any per-action authorization or per-tenant scoping is evaluated.
      - >
        Potential impacts include unauthorized access to server resources and tools under
        a borrowed identity, and corruption of audit trails: actions are recorded against
        the impersonated principal, so attribution and non-repudiation fail (STRIDE Repudiation).
        Consequences include unauthorized data access, unauthorized actions executed with
        the victim's standing privileges, accountability gaps that frustrate incident
        response, and compliance violations where authenticated, attributable access is
        mandated.
      - >
        {{riskShadowAndUnknownAgents}} addresses identities that operate outside lifecycle
        controls because they were never registered; this risk addresses an attacker actively
        impersonating a registered, legitimate principal by defeating weak authentication.
        {{riskAgentDelegationChainOpacity}} addresses inability to reconstruct the delegation
        chain even when each authentication step succeeds; this risk addresses the authentication
        step itself being defeated. {{riskCrossTenantCredentialPropagation}} addresses
        a valid credential leaking across tenant boundaries; this risk addresses acceptance
        of an unverified or forged credential at the endpoint. {{riskMCPTransportHijacking}}
        addresses interception or modification of the channel; this risk addresses the
        principal-authentication decision the endpoint makes regardless of channel security.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaAgenticProvider
      - personaPlatformProvider
      - personaApplicationDeveloper
      - personaEndUser
    controls:
      - controlComponentIdentityProvenance
      - controlAgentCredentialIsolation
      - controlFederatedUserAuthentication
      - controlComponentIdentityRegistration
      - controlAuthenticationSchemeHardening
      - controlSenderConstrainedCredentials
      - controlToolServerVetting
    examples:
      - >
        The Model Context Protocol authorization specification ({{ref:mcp-authorization-spec}})
        defines OAuth-based authorization for MCP servers but leaves enforcement to the
        deployer; servers configured without it, or that accept bearer tokens without
        validating audience and issuer, accept any holder of a token as the corresponding
        principal — the authentication-boundary weakness this risk describes.
      - >
        A 2025 internet-wide scan fingerprinted 1,862 internet-exposed MCP servers and
        manually verified a 119-server sample; all 119 responded to unauthenticated, protocol-compliant
        tools/list requests and freely disclosed their internal tool capabilities without
        validating requester identity ({{ref:knostic-2025-mcp-server-mapping}}) — any
        caller was accepted as a legitimate client, at scale, in production deployments,
        confirming this is not a theoretical gap.
    tourContent:
      introduced:
        - >
          Introduced during deployment when a shared agent service is exposed with weak,
          optional, or misconfigured requester authentication — permissive protocol defaults,
          one-way instead of mutual TLS, unvalidated bearer tokens, or shared and default
          service credentials.
      exposed:
        - >
          Exposed at runtime when an attacker presents stolen, forged, or unverified credentials
          and is accepted as a legitimate client or agent, invoking tools and accessing
          resources under the impersonated identity.
      mitigated:
        - >
          Mitigated by enforcing strong authentication of the requesting principal at
          every endpoint: proof-of-possession or mutually authenticated credentials validated
          against an authoritative registry at invocation time, rejection of self-asserted
          or unverified identities, and detection telemetry that flags authentication
          anomalies and access under revoked or unexpected principals.
    mappings:
      stride:
        - Spoofing
        - Repudiation
      mitre-atlas:
        - AML.T0012@5.0.1
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
      - accountability
    actorAccess:
      - external
      - api
      - agent
    externalReferences:
      - type: spec
        id: mcp-authorization-spec
        title: Model Context Protocol — Authorization Specification
        url: https://modelcontextprotocol.io/specification/2025-06-18/basic/authorization
      - type: news
        id: knostic-2025-mcp-server-mapping
        title: 'Exposing the Unseen: Mapping MCP Servers Across the Internet'
        url: https://www.knostic.ai/blog/mapping-mcp-servers-study
  - id: riskBrokenAuthorizationEnforcement
    title: Broken Authorization Enforcement for Agent Resource Access
    shortDescription:
      - >
        Authorization is not enforced, or is misconfigured, at the point where an agent
        invokes a tool or accesses a resource, so requests run with the agent's standing
        privileges instead of the originating principal's authorization — letting a caller
        reach functions and objects they are not entitled to.
    longDescription:
      - >
        Agentic systems mediate access to tools, data, and downstream services through
        a policy enforcement point (PEP) that should consult a policy decision point (PDP)
        ({{ref:nist-sp-800-162-abac}}) for every tool invocation and resource access.
        Broken Authorization Enforcement occurs when that check is absent, applied at
        the wrong layer, or driven by misconfigured roles, ACLs, or trust relationships
        — so the call executes with whatever standing privilege the agent or its service
        identity holds, rather than being constrained to what the originating principal
        is authorized to do.
      - >
        This is the classical broken-access-control failure — improper authorization ({{ref:cwe-285}}),
        missing function-level authorization ({{ref:cwe-862}}), and improper privilege
        management ({{ref:cwe-269}}), the same class OWASP catalogs as broken function-level
        (BFLA) and broken object-level (BOLA) authorization — relocated to the agent-to-tool
        boundary. Long-standing patterns recur unchanged: an over-broad service account
        or role grant, an ACL that defaults open, a privileged credential reused across
        actions, or an endpoint that authenticates the caller but never authorizes the
        specific action against the specific object. The AI-specific amplifier is that
        an autonomous agent — not a fixed application route — chooses which tool or resource
        call to make based on model reasoning, and its capability set expands dynamically
        through tool and server discovery, so a missing or misconfigured authorization
        check is reachable through an unpredictable and growing set of actions.
      - >
        The exposure is present wherever a tool or resource call is gated only by authentication
        and not by a per-action, per-object authorization decision; wherever the agent's
        standing service identity is used directly instead of an authorization scoped
        to the originating principal; wherever roles, ACLs, or trust relationships are
        misconfigured such that the effective grant exceeds intent; and wherever the PEP
        is enforced at only one layer (for example application but not the tool server,
        or the proxy but not the backend) so a request can reach a privileged operation
        through the unguarded path. Under a zero-trust model every such hop is expected
        to re-evaluate authorization against the principal and the requested operation;
        the gap is that the agent boundary frequently does not.
      - >
        This risk is the authorization-enforcement core that several adjacent risks specialize.
        {{riskAgenticDelegationConfusedDeputy}} covers the specific case where a higher-privilege
        deputy acts on behalf of a lower-privilege caller across a delegation boundary
        without checking the caller's authority; this risk is the broader failure to enforce
        a per-action authorization decision at all, including cases with no deputy delegation.
        {{riskCrossTenantCredentialPropagation}} covers the tenancy specialization — credentials
        valid across tenant boundaries; this risk covers privilege escalation and unauthorized
        access within a single trust domain through misconfigured or missing enforcement.
        {{riskShadowAndUnknownAgents}} concerns identities that operate outside lifecycle
        controls, whereas this risk concerns authorized identities whose actions are not
        constrained to their entitlements.
      - >
        Potential impacts include privilege escalation, unauthorized read or modification
        of objects the caller could not reach directly, lateral movement to privileged
        operations, and chained escalation when an agent's effective authority spans multiple
        services. Consequences include data breaches, integrity compromise of downstream
        systems, accountability gaps, and regulatory non-compliance.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaEndUser
    controls:
      - controlApplicationAccessManagement
      - controlAgentPluginPermissions
      - controlSecureByDefaultMLTooling
      - controlAgentObservability
      - controlResourceAuthorizationEnforcement
    examples:
      - >
        An agent connected to a database tool authenticates with a single service identity
        that holds broad read/write access. The application authenticates the human user
        but never re-authorizes the specific row or table the agent's generated query
        touches, so a low-privilege user's request causes the agent to read records they
        are not entitled to — a missing object-level authorization (BOLA) check at the
        tool boundary rather than a delegation-boundary confused deputy. A 2026 red-team
        exercise against a live production airline booking system demonstrates this mechanism
        concretely: an autonomous agent with no starting credentials minted a valid anonymous
        session, enumerated 514 GraphQL queries via introspection, and retrieved full
        passenger PII plus modify/cancel authority for bookings the session held no entitlement
        to — the session was legitimately authenticated throughout; no object-level check
        gated which records it could reach ({{ref:wiz-2026-red-agent-bola}}).
      - >
        A remote tool server exposes administrative operations behind the same endpoint
        as ordinary operations, gating access with authentication but no per-action authorization.
        Because the calling agent's service account carries a role grant that was misconfigured
        to include the admin scope, the agent can be steered into invoking a privileged
        operation that the requesting principal was never authorized to perform. [No single
        named incident specifically matching admin/ordinary-operation endpoint conflation
        was found as of 2026-07-12; BOLA/BFLA generally has been #1 on the OWASP API Security
        Top 10 since 2019 (already covered by this risk's CWE-862/CWE-269 externalReferences)
        — this example remains illustrative of the established class rather than citing
        a single incident.]
    tourContent:
      introduced:
        - >
          Introduced during deployment when agent tool and resource access is wired with
          authentication but without a per-action, per-object authorization decision,
          or when roles, ACLs, and service-identity grants are configured broader than
          the principals the agent serves actually require.
      exposed:
        - >
          Exposed at runtime when an agent invokes a tool or accesses a resource and the
          enforcement point either performs no authorization check or applies a misconfigured
          grant, so the call executes with the agent's standing privilege rather than
          the originating principal's entitlement.
      mitigated:
        - >
          Mitigated by enforcing a per-action, per-object authorization decision at every
          tool and resource boundary, scoping the agent's effective authority to the originating
          principal's entitlement under least privilege, correcting over-broad role and
          ACL grants, and re-evaluating authorization at each hop consistent with a zero-trust
          enforcement model.
