  - id: riskUntrustedHostToolRuntimeExposure
    title: Untrusted Host Tool Runtime Exposure
    shortDescription:
      - >
        An agentic tool runtime whose isolation doesn't match who sits inside its host's
        privilege boundary exposes its in-memory credentials, keys, secrets, and code
        to a host operator, privileged insider, or co-tenant that can read or tamper with
        them while the workload runs.
    longDescription:
      - >
        Agentic systems run remote-tooling services — MCP servers, A2A endpoints, and
        similar shared tool runtimes — that hold standing credentials and execute tool
        logic on behalf of agents. Untrusted Host Tool Runtime Exposure occurs when a
        party inside the host's privilege boundary — the infrastructure operator, a privileged
        insider, or a co-tenant workload that escapes its own isolation — can read or
        tamper with that runtime's in-use credentials, signing keys, secrets, and code
        while it executes. This holds regardless of who owns the underlying hardware:
        a self-operated host with a compromised insider and a third-party multi-tenant
        host with an untrusted operator present the same exposure to the runtime — precisely
        the isolation gap the MCP specification's own security best-practices guidance
        warns operators to close ({{ref:mcp-spec-2025-11-25-security-best-practices}}).
      - >
        This is a classical host-trust and compartmentalization gap ({{ref:cwe-653}} Insufficient
        Compartmentalization, {{ref:cwe-668}} Exposure of Resource to Wrong Sphere) cast
        in agentic dress. A process running in cleartext memory has always been exposed
        to whatever sits inside its host's privilege boundary — the OS, hypervisor, a
        hardware operator, an insider, or a co-tenant workload that breaks out of its
        own confinement. Two distinct control tiers close this gap for different adversaries:
        OS- and process-level isolation (containers, namespaces, seccomp, mandatory access
        control) bounds what a compromised or escaping co-tenant process can reach, while
        hardware-enforced confidential computing (TEEs, secure enclaves) removes the host
        operator and privileged insiders from the trust boundary entirely — a threat OS-level
        isolation alone cannot address, since an operator with hypervisor-level access
        sits outside any software boundary. The agentic amplifier is that tool runtimes
        concentrate long-lived, high-value standing credentials — bearer tokens, OAuth
        client secrets, delegated tool scopes — and agents authenticate and invoke autonomously
        without a human re-supplying secrets per action, so a single runtime compromise
        yields broad, immediately- usable access.
      - >
        The exposure is present wherever a tool runtime holds credentials, secrets, or
        code in process memory without isolation adequate to its threat model — no OS/process
        boundary against a co-tenant, no hardware boundary against a privileged host operator
        or insider. Under these conditions, whichever party sits inside the applicable
        privilege boundary can extract standing credentials and impersonate the tool runtime,
        or tamper with its in-memory code and data to alter tool behavior — without ever
        defeating the runtime's own authentication, because the secret is read directly
        rather than forged.
      - >
        This risk is distinct from {{riskAcceleratorAndSystemSideChannels}}, which covers
        indirect cross-tenant leakage inferred through hardware side-channels (timing,
        cache, speculative execution); this risk covers direct exposure of secrets and
        code held in cleartext to a party already inside the host's privilege boundary,
        not inference through a side channel. It is distinct from {{riskCrossTenantCredentialPropagation}},
        which covers credentials that are valid across tenant boundaries because they
        are insufficiently scoped at the identity layer; this risk covers credentials
        stolen from an exposed runtime regardless of how well they are scoped. It is distinct
        from {{riskMCPTransportHijacking}}, which covers the communication channel between
        agent and tool; this risk covers the runtime while it executes, not the wire.
      - >
        Potential impacts include theft of standing tool credentials and signing keys
        leading to impersonation of the tool runtime, exposure of sensitive data flowing
        through tool invocations, and tampering with tool code to corrupt agent actions.
        Because a valid credential is extracted rather than forged, downstream authentication
        continues to succeed and the compromise is difficult to detect.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaAgenticProvider
      - personaPlatformProvider
      - personaApplicationDeveloper
      - personaEndUser
    controls:
      - controlRuntimeHostIsolation
      - controlIsolatedConfidentialComputing
      - controlAgentCredentialIsolation
    examples:
      - >
        A managed MCP or remote-tool service runs on a third-party multi-tenant host where
        the platform operator retains administrative access to the underlying VM, and
        tenant workloads are separated by containers rather than hardware-enforced isolation.
        An operator insider can read the OAuth client secret and bearer tokens the tool
        runtime holds in memory directly, with no TEE in the way. A co-tenant can reach
        the same result by escaping its own container: CVE-2019-5736 demonstrated exactly
        this mechanism — a maliciously crafted container image, or a process already running
        as root inside a container, could overwrite the host's runc binary via a /proc/self/exe
        race condition, gaining root access to the host and, from there, direct read access
        to every other tenant's tool-runtime memory sharing that hardware ({{ref:cve-2019-5736}}).
      - >
        A self-hosted tool runtime on infrastructure the operator itself owns stores its
        delegated API tokens in process memory and a local config file. A privileged insider
        with host access copies the tokens and the tool's signing key, enabling impersonation
        of the tool and tampering of its responses to connected agents, with no anomaly
        visible at the runtime's authentication layer. CircleCI's January 2023 incident
        demonstrates the in-use half of this mechanism concretely: after gaining production
        access via a stolen, 2FA-backed SSO session cookie, the attacker extracted encryption
        keys directly from a running process to decrypt data at rest — proof that standing
        access to a host, however obtained, converts directly into secrets read out of
        a live process ({{ref:circleci-2023-incident-report}}).
    tourContent:
      introduced:
        - >
          Introduced during deployment when an agentic tool runtime holding standing credentials
          executes without isolation adequate to who sits inside its host's privilege
          boundary — no OS/process boundary against a co-tenant, no hardware-enforced
          boundary against a privileged host operator or insider.
      exposed:
        - >
          Exposed at runtime when a co-tenant that escapes software isolation, or a hardware
          operator or privileged insider with access inside the host's privilege boundary,
          reads or tampers with the tool runtime's in-memory credentials, keys, code,
          or data while the workload executes.
      mitigated:
        - >
          Mitigated by a tiered isolation posture: OS- and process-level isolation (containerization,
          namespaces, seccomp, mandatory access control) bounds what a compromised or
          escaping co-tenant process can reach on the host; hardware-enforced confidential
          computing (TEEs, secure enclaves) removes the host operator and privileged insiders
          from the trust boundary entirely; and credential isolation ensures that even
          if a host is compromised, no single secret is broadly reusable.
    mappings:
      stride:
        - InformationDisclosure
        - Tampering
        - Spoofing
      owasp-top10-llm:
        - LLM02:2025
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
    actorAccess:
      - privileged
      - infrastructure-provider
      - service-provider
