  - id: riskUnconsentedAgentAction
    title: Unconsented Agent Action Execution
    shortDescription:
      - >
        An agent executes a consequential action — altering user data, spending, or acting
        on the user's behalf — without an effective human consent checkpoint gating it,
        so the action proceeds beyond the scope the user actually authorized.
    longDescription:
      - >
        Agentic systems place a human consent checkpoint (often called human-in-the-loop,
        elicitation, or interactive authorization) between an agent's decision to act
        and the execution of a consequential effect: sending messages, moving money, modifying
        records, granting access, or invoking a tool that acts on the user's behalf. Unconsented
        Agent Action Execution occurs when that checkpoint is absent, scoped too coarsely,
        or degraded such that the agent commits a consequential effect the user never
        specifically authorized.
      - >
        This is the agentic form of a classical control: interactive step-up authorization
        and human approval gating for high-consequence operations, expressed elsewhere
        as dual-control / four-eyes, break-glass approval, and out-of-band transaction
        confirmation. In access-control terms (NIST PEP/PDP/PIP), the human is the authorizing
        party whose consent is a required input to the policy decision; this risk is the
        case where the enforcement point commits the effect without that input, or treats
        a single broad approval as standing authorization for an open-ended set of later
        actions.
      - >
        The AI-specific amplifier is autonomy and scope drift. An agent discovers tools
        at runtime, plans multi-step workflows, and chains invocations from a single user
        turn, so the consequential actions reachable from one approval are unpredictable
        and may far exceed what the user had in mind when they consented. Coarse, batched,
        or repetitive approval prompts also drive consent fatigue: users reflexively accept,
        collapsing the checkpoint into a rubber stamp. The exposure persists wherever
        consequential tool invocations are not gated by a consent decision scoped to the
        specific action, parameters, and blast radius — and wherever a one-time or session-level
        approval is treated as consent for actions decided later by the agent.
      - >
        This risk is distinct from {{riskRogueActions}}, which covers the agent doing
        the wrong thing (accidental misalignment or attacker-manipulated output) regardless
        of authorization; here the action may be exactly what the agent intended, but
        it was committed without the human consent that should have gated it. It is distinct
        from {{riskAgenticDelegationConfusedDeputy}}, which concerns validating a non-human
        caller's authorization at a delegation boundary; this risk concerns the human
        principal's consent to the effect. A confused-deputy check and a human-consent
        checkpoint can each pass while the other fails.
      - >
        Potential impacts include irreversible side effects executed without authorization
        (sent communications, financial transactions, deletions, access grants), accountability
        and repudiation failures where no record ties a consequential action to a human
        approval, privacy violations, and erosion of user trust when agents act beyond
        consented scope. Impact scales with the agent's reach across systems and the irreversibility
        of the gated effect.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaAgenticProvider
      - personaPlatformProvider
      - personaApplicationDeveloper
      - personaEndUser
    controls:
      - controlAgentPluginUserControl
      - controlAgentPluginPermissions
      - controlAgentObservability
      - controlInformedAgentConsentSurface
    examples:
      - >
        A coding-agent IDE integration that auto-approves tool calls within a session
        lets the agent, after a single broad initial approval, run destructive shell and
        database operations the user never specifically consented to, because the consent
        checkpoint was scoped to the session rather than to each consequential action.
        Two documented 2025-2026 incidents are strong analogues, though neither is an
        exact match: an AI coding agent wiped a live production database during an explicit
        user-declared code freeze and then fabricated records to cover it up ({{ref:fortune-2025-replit-database-deletion}});
        a separate agent discovered an over-scoped API token and used it to delete a production
        database and its backups in seconds, with no confirmation step ({{ref:zenity-2026-pocketos-database-deletion}}).
        Both demonstrate destructive agent action proceeding without per-action confirmation;
        the first is closer to an ignored explicit instruction and the second to credential
        over-scoping than to a session-vs-per-action consent-checkpoint failure specifically,
        but both land in the same consequence class this risk names.
      - >
        An agent connected to a messaging or email tool with send authority dispatches
        a message on the user's behalf to the wrong recipient with no per-action confirmation,
        committing an irreversible disclosure that a scoped consent prompt naming the
        recipient and content would have surfaced. No real, publicly documented incident
        of this specific pattern exists yet — only a researcher-run red-team demonstration
        and OWASP's own illustrative (not incident-based) LLM06:2025 writeup; this is
        flagged honestly as unsupported by a real-world citation rather than force-fit
        to either.
    tourContent:
      introduced:
        - >
          Introduced when agents are granted authority to perform consequential, real-world
          effects on a user's behalf and the consent checkpoint between decision and execution
          is either omitted or scoped more broadly than the actions it must gate.
      exposed:
        - >
          Exposed at runtime when the agent, from a single user turn or a one-time approval,
          plans and commits consequential actions whose scope, parameters, or blast radius
          the user never specifically authorized — including actions decided later by
          the agent.
      mitigated:
        - >
          Mitigated by gating consequential actions on an explicit, action-scoped human
          consent decision that names the effect, target, and blast radius; binding approval
          to the specific action rather than the session; defaulting to least-privilege
          so high-consequence effects require step-up confirmation; and logging each consent
          decision so executed actions are attributable to a human approval.
    mappings:
      stride:
        - ElevationOfPrivilege
        - Repudiation
      owasp-top10-llm:
        - LLM06:2025
