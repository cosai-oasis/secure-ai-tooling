  - id: riskExcessiveNetworkExposure
    title: Excessive Network Exposure
    shortDescription:
      - >
        An AI-system component — most commonly an MCP or tool server — is reachable from
        beyond its intended trust boundary, and can itself reach beyond it, because it
        is deployed with an over-broad network posture (bound to all interfaces rather
        than localhost, unsegmented, unrestricted egress). A service meant to be network-isolated
        becomes a pivot: parties that should not reach it can drive the data and tool
        actions it exposes, and if it is compromised it can exfiltrate data, reach command-and-control,
        and move laterally — with DNS rebinding as the canonical path for a remote page
        to drive requests into an assumed-local service.
    longDescription:
      - >
        Agentic deployments run tool servers, MCP endpoints, and orchestrators as network
        services. Excessive Network Exposure occurs when one of these services is placed
        on the network with more reachability than its intended trust boundary requires
        — on the inbound side by binding to all interfaces rather than localhost, omitting
        network segmentation, or lacking Origin/host validation, and on the outbound side
        by permitting unrestricted egress. The attack surface is the deployment's network
        position, not the message channel: a server the operator believed was local or
        internal is in fact reachable from the surrounding network, and a server the operator
        believed was contained can in fact open arbitrary outbound connections. DNS rebinding
        is the canonical inbound vector — a remote web page rebinds a hostname to a loopback
        or internal address and drives requests into a service that assumed only local
        callers could reach it, bypassing same-origin protections.
      - >
        The agentic amplifier is that these services are frequently stood up ad hoc, on
        developer workstations and inside internal networks, under an implicit assumption
        of trust that the deployment posture does not actually enforce. MCP servers commonly
        default to convenient rather than minimal network exposure, and agents discover
        and connect to them at runtime without verifying where they are bound or what
        they can reach. Internal-network deployments using Streamable HTTP inherit the
        full lateral-movement surface of the environment they sit in while often carrying
        only the authentication the operator remembered to add. What distinguishes this
        from generic server hardening is the population it lives in: tool servers are
        frequently stood up by application developers on laptops and internal hosts with
        no operations review, and agents bind to and invoke them from runtime discovery
        rather than a vetted network diagram — so the exposure recurs across a class of
        endpoints that conventional network-hardening processes never see.
      - >
        The consequence is that a single exposed or over-permissive component becomes
        a pivot. On the inbound side, an attacker who reaches an intended-internal service
        can read data and drive tool actions it exposes, and can exhaust an unauthenticated
        service by flooding it; on the outbound side, a compromised or malicious server
        with unrestricted egress can download further malicious payloads, exfiltrate intercepted
        or brokered data, reach command-and-control infrastructure, and move laterally
        across the environment using the credentials it holds for downstream services
        — including turning a commandeered server against co-located systems. Poor segmentation
        converts a foothold on one host into reach across many. Inbound exposure and outbound
        permissiveness are treated here as one risk because they share a single deployment-time
        root cause (mis-scoped network position), the same controls, and the same locus
        — two facets of network reachability, not two independent threats.
      - >
        This risk is distinct from {{riskMCPTransportHijacking}}, which addresses interception
        or modification of traffic on the agent-to-tool channel (missing TLS / mutual
        authentication) — this risk addresses the network POSITION of the endpoint itself
        (who can reach it and what it can reach), independent of whether the channel is
        encrypted. DNS rebinding is cited by both risks but through different enabling
        conditions: in Transport Hijacking the gap is absent Origin/host validation on
        the connection; here it is the binding address and network position that make
        the service reachable by on-network peers at all — validating Origin without correcting
        an all-interfaces bind still leaves the service exposed. It is distinct from {{riskUntrustedHostToolRuntimeExposure}},
        which addresses host- and process-level isolation of secrets and code IN USE inside
        a runtime — this risk addresses network-level reachability, not in-process isolation.
        It is distinct from {{riskCrossTenantCredentialPropagation}}, which addresses
        a valid credential crossing tenant boundaries — here the boundary crossed is the
        network segment, not the tenant. It is distinct from {{riskZombieShadowMCPServers}},
        which addresses stale or unmanaged endpoints — a correctly inventoried, current
        server can still be bound and segmented incorrectly.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaApplicationDeveloper
    controls:
      - controlInboundNetworkExposureAndSegmentation
      - controlNetworkEgressControl
      - controlSecureByDefaultMLTooling
    examples:
      - >
        The MCP specification (2025-11-25) ({{ref:mcp-spec-2025-11-25-transports}}) carries
        an explicit Security Warning for the Streamable HTTP transport: servers "MUST"
        validate the Origin header on every incoming connection to prevent DNS rebinding
        (responding 403 on an invalid Origin), "SHOULD" bind only to localhost (127.0.0.1)
        rather than all interfaces (0.0.0.0) when running locally, and "SHOULD" authenticate
        all connections — the spec warns that "without these protections, attackers could
        use DNS rebinding to interact with local MCP servers from remote websites." The
        exposure therefore arises where deployments violate the Origin-validation "MUST"
        or ignore the localhost-binding and authentication "SHOULD"s; that the protocol
        both names the attack and mandates its primary defense marks this a recognized
        design-level concern, not a mere per-deployment oversight.
    tourContent:
      introduced:
        - >
          Introduced at deployment when a tool or MCP server is placed on the network
          with more reachability than its trust boundary requires — bound to all interfaces
          instead of localhost, without segmentation, or with unrestricted egress.
      exposed:
        - >
          Exposed at runtime when the service is reached from outside its intended boundary
          (directly or via DNS rebinding) or opens outbound connections to unintended
          destinations, and persists wherever ad-hoc and internal deployments assume a
          trust the network position does not enforce.
      mitigated:
        - >
          Mitigated by binding services to the minimum necessary interface, constraining
          inbound reachability and validating request Origin/host, segmenting internal
          deployments, and restricting egress to an allowlist that bounds exfiltration,
          command-and-control, and lateral movement.
    mappings:
      stride:
        - InformationDisclosure
        - ElevationOfPrivilege
        - DenialOfService
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
      - availability
    actorAccess:
      - external
      - agent
    externalReferences:
      - type: spec
        id: mcp-spec-2025-11-25-transports
        title: 'Model Context Protocol specification (2025-11-25): Transports'
        url: https://modelcontextprotocol.io/specification/2025-11-25/basic/transports
  - id: riskConfidentialComputingAttestationBypass
    title: Confidential Computing Attestation Bypass
    shortDescription:
      - >
        A compromised, incorrectly configured, or impostor (shadow) server workload can
        operate as a trusted counterparty in a confidential-computing deployment when
        remote attestation of its runtime measurements is not mandated, not enforced as
        an admission gate, or is itself defeated. The hardware root-of-trust guarantee
        that the workload's code matches a known-good measurement fails silently, letting
        the attacker-controlled or tampered workload operate with the access and trust
        intended for the legitimate one. This models an architecturally sound but not-yet-widely-deployed
        pattern: TEE-hosted MCP and agentic tool servers are an emerging, vendor-recommended
        practice rather than today's operational norm, and no documented real-world instance
        of this specific bypass exists yet.
    longDescription:
      - >
        Confidential computing platforms (hardware Trusted Execution Environments such
        as Intel TDX and AMD SEV-SNP, and enclave technologies such as SGX) let a relying
        party — an orchestrator, agent, or client establishing a session with a server
        workload — verify via *remote attestation* that the workload's measured code and
        configuration match a known-good reference before trusting it. A compromised workload
        (a legitimate deployment later tampered by an insider or a supply-chain substitution),
        an incorrect workload (a misconfigured or wrong-version deployment), or a shadow
        workload (an attacker-launched impostor standing in for the legitimate server)
        each produce measurements that diverge from that known-good reference and should
        fail attestation.
      - >
        The threat is not that attestation catches a mismatch — that is the control working
        as intended. The threat is the gap on either side of that check: deployments that
        place a workload inside a TEE but do not mandate remote attestation as a hard
        admission gate at launch and at every subsequent trust decision, or deployments
        that treat "runs inside a TEE" itself as sufficient evidence of trustworthiness
        without verifying and enforcing the attestation result. In either gap, a compromised,
        incorrect, or shadow workload operates with the full access, credentials, and
        trust intended for the legitimate one, for as long as nothing actually checks,
        or acts on, its measurement.
      - >
        Remote attestation is also not an infallible backstop: it is only as trustworthy
        as the hardware's ability to produce a truthful measurement. Documented hardware-level
        attacks against enclave and TEE platforms — such as the Foreshadow speculative-execution
        attack against Intel SGX ({{ref:vanbulck-2018-foreshadow}}), which extracted attestation
        keys and undermined the platform's ability to vouch for its own measurements —
        demonstrate that the hardware root of trust underlying attestation is itself an
        attack surface, not a fixed guarantee.
      - >
        This risk is distinct from {{riskZombieShadowMCPServers}}, which addresses stale
        or decommissioned registry and DNS entries reclaimed by an attacker after legitimate
        decommissioning — its own scope explicitly excludes vulnerabilities in a running
        tool implementation. This risk addresses an actively running workload whose measured
        code or configuration does not match what was deployed, verified (or not) via
        hardware attestation rather than registry or DNS presence. It is distinct from
        {{riskToolRegistryTampering}}, which addresses compromise of registry metadata
        — tool descriptions, schemas, manifest entries — that redirects agent tool selection;
        this risk addresses the integrity of the running server workload itself, independent
        of whether its registry entry was ever touched. It is distinct from {{riskAgentIdentitySpoofing}},
        which addresses weak or missing authentication credentials that let an attacker
        impersonate a client or agent at the protocol layer; this risk addresses hardware-measured
        code integrity of the server workload, a verification layer a valid, correctly-authenticated
        credential does not itself satisfy. It is distinct from {{riskUntrustedHostToolRuntimeExposure}},
        which addresses secrets and code exposed in use to a hostile host, administrator,
        or co-tenant absent adequate runtime isolation; this risk addresses verifying
        the identity and integrity of the workload itself before trusting it, not protecting
        an already-trusted workload's data from its surroundings. It is also distinct
        from {{riskModelDeploymentTampering}}, which shares this risk's primary control
        ({{controlIsolatedConfidentialComputing}}) but addresses unauthorized modification
        of the model deployment workflow or serving infrastructure itself — altering how
        a model behaves post-deployment via a compromised deployment pipeline; this risk
        addresses verifying the identity and integrity of a server workload as a counterparty
        at connection time, independent of whether that workload happens to be model-serving
        infrastructure, a tool server, or any other MCP component, and independent of
        whether its deployment pipeline was ever touched.
      - >
        A workload trusted despite compromise operates with the full authority of the
        legitimate principal: it can execute tool calls, return tampered results that
        poison downstream agent reasoning, and access whatever credentials, secrets, or
        sensitive data flow through it, while corrupting the audit trail that would otherwise
        attribute those actions to an impostor rather than the trusted server.
    category: risksDeploymentAndInfrastructure
    personas:
      - personaPlatformProvider
      - personaModelServing
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaEndUser
    controls:
      - controlIsolatedConfidentialComputing
      - controlComponentIdentityProvenance
    examples:
      - >
        No documented real-world incident of an MCP or agentic tool server operating as
        a trusted counterparty despite failing remote attestation exists yet — TEE-hosted
        MCP deployment is, per the source paper itself, a forward-looking/recommended
        pattern rather than a widespread deployment reality at the time of writing. This
        risk is evidence-thin on its primary claim (an unmandated or unenforced attestation
        admission gate) for that reason; that gap is stated plainly here rather than papered
        over with a mismatched citation.
      - >
        What is documented is that the underlying hardware root of trust attestation depends
        on is itself attackable: the Foreshadow (L1 Terminal Fault) attack against Intel
        SGX ({{ref:vanbulck-2018-foreshadow}}) (USENIX Security 2018) demonstrated that
        transient out-of-order execution could extract SGX sealing and attestation keys,
        allowing forged attestation quotes and undermining the platform's ability to vouch
        for its own measurements. This supports only this risk's secondary claim — that
        attestation itself can be defeated, not merely skipped or ignored. It is an 8-year-old,
        SGX-specific result, and SGX has been largely superseded by TDX/SEV-SNP-era confidential
        computing, so it grounds the general hardware- trust-surface point without claiming
        currency for the current hardware generation rather than a bypass demonstrated
        against today's dominant platforms.
    mappings:
      stride:
        - Spoofing
        - Tampering
        - InformationDisclosure
    lifecycleStage:
      - deployment
      - runtime
    impactType:
      - confidentiality
      - integrity
    actorAccess:
      - infrastructure-provider
      - privileged
      - supply-chain
      - physical
    externalReferences:
      - type: paper
        id: vanbulck-2018-foreshadow
        title: 'Foreshadow: Extracting the Keys to the Intel SGX Kingdom with Transient
          Out-of-Order Execution'
        url: https://www.usenix.org/conference/usenixsecurity18/presentation/bulck
  - id: riskAuditTrailTampering
    title: Audit Trail Tampering
    shortDescription:
      - >
        An adversary who has compromised — or legitimately operates — a recorded
        workload turns off, redirects, or destroys the audit records describing its own
        activity, so the actions taken cannot afterwards be attributed, investigated, or
        evidenced.
    longDescription:
      - >
        Audit Trail Tampering attacks the evidence rather than the system that produced
        it, through two mechanisms serving one objective. Records already captured are
        altered, truncated, deleted, or reordered, so the surviving trail misstates what
        happened. Or records never become durable: a working recording capability is
        switched off or reconfigured, the write path is redirected to an endpoint that
        discards what it receives, the repository is made unreachable or flooded until
        records of interest age out, or a buffered record is dropped while the action
        proceeds. Either way the investigator holds a trail that reads as complete and
        is not, and a gap indistinguishable from an absence of activity will be read as
        one.
      - >
        The classical form is catalogued as one technique: MITRE ATT&CK's *Disable or
        Modify Tools* ({{ref:attack-t1685}}), under the *Defense Impairment* tactic,
        whose sub-techniques cover both disabling and clearing Windows, Linux, and cloud
        audit logs. NIST SP 800-53 Rev. 5 draws the same line, AU-9 requiring protection
        of "audit information **and audit logging tools** from unauthorized access,
        modification, and deletion" — the recording capability guarded alongside the
        records — with AU-10 supplying non-repudiation ({{ref:nist-sp-800-53r5}}).
        Neither grouping is decisive: ATT&CK groups by adversary tactic, not evidentiary
        locus, and NIST does treat suppression separately in AU-4 (storage capacity) and
        AU-5 (response to logging process failures). What defines the risk is
        independence: **a component cannot be its own audit authority**. An emitter can
        be obliged to produce faithful records; it cannot vouch for them against itself.
        Records held under the same credentials, trust domain, and operator as the
        activity they describe are that operator's assertions, not evidence against it —
        hence an audit record repository deployed out of band from the workloads it
        records.
      - >
        The agentic amplification is one of scale and consequence rather than mechanism,
        and it is at present reasoned rather than demonstrated: both incidents below
        involve human adversaries, and no published result yet shows an agent
        suppressing or rewriting the records of its own activity. The reasoning is that
        autonomous action across many hops leaves a larger share of consequential events
        with no human witness; that delegation across agents, tool servers, and model
        endpoints multiplies the writers whose records must all survive for one action
        to be reconstructable; and that agents hold durable credentials and can be
        steered by injected instructions toward infrastructure, bringing the
        repository's administrative plane within reach.
      - >
        A system is exposed when the credential a component uses to write records can
        also modify or delete them, when the repository's administration is reachable
        from the trust domain of the workload it records, when an emitter's destination
        can be reconfigured or impersonated undetected, when no chain or sequence would
        make an alteration or gap visible and nothing verifies that structure on a
        schedule, or when deletion and retention actions against the repository are not
        recorded. Impacts include actions attributable to no principal, incident
        response unable to establish scope or dwell time, record-keeping obligations
        that cannot be discharged, detection baselines degrading silently as their
        inputs are shaped, and an evidentiary record whose integrity cannot be
        demonstrated.
      - >
        The nearest entry is {{riskAgentDelegationChainOpacity}}, and the boundary is
        whether a recording capability existed. Opacity is architectural omission: the
        emitters never emitted delegation events, so the actor path was never recorded
        and no adversary act was needed to make it absent. This risk is the deliberate
        defeat of a capability that was present and working — reconfiguring an
        orchestrator so it stops emitting is this risk, a framework that never emitted
        is opacity. The loci follow: opacity is a property of the emitters, this risk of
        the repository, its write path, and its administration. Distinct too from
        {{riskSensitiveDataDisclosure}} (accumulated records as a target for *reading*)
        and {{riskAgentIdentitySpoofing}} (a faithful record naming the wrong
        principal).
    category: risksDeploymentAndInfrastructure
    personas:
      - personaPlatformProvider
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaEndUser
    controls:
      - controlResourceAuthorizationEnforcement
      - controlAIInfrastructureObservability
      - controlInterComponentTransportSecurity
      - controlAuditRecordRepositoryIndependence
      - controlAuditTrailCompleteness
      - controlAuditTrailIntegrityVerification
    examples:
      - >
        Mandiant reported that APT29 disabled Purview Audit on targeted accounts inside
        compromised Microsoft 365 tenants, then began accessing those accounts'
        mailboxes ({{ref:mandiant-2022-apt29-purview}}). Mail Items Accessed is the
        audit that establishes which mail items a threat actor read, including access by
        way of the Graph API; it was licensed, enabled, and working on the targeted
        accounts, and the adversary held enough privilege in the tenant to switch off
        the recording of its own activity before acting. The capability existed and was
        deliberately defeated, which is the independence failure in its plainest form.
      - >
        The AIKatz research showed that an attacker who recovers an LLM desktop client's
        session token can drive the same backend API the client drives, and through it
        read, overwrite, and delete the user's stored conversation history
        ({{ref:lumia-2025-aikatz}}). Desktop clients typically load history once, when a
        conversation is opened, so alterations to an open conversation are not shown to
        the user; MITRE ATLAS catalogues the behaviour as a distinct technique, sourced
        from this case study. Where the conversation is the only account of what an
        assistant was asked to do and what it did, an adversary holding the client's own
        credentials can rewrite that account. Recovering the token is
        {{riskCredentialAndTokenTheft}} and is the precondition, not part of this risk.
    tourContent:
      introduced:
        - >
          Introduced at deployment, when the audit record repository's trust boundary is
          set: which principals may write, read, and delete records, whether the
          repository's administrative plane is reachable from the workloads it records,
          whether an emitter's destination can be changed without notice, and whether
          the trail carries any structure — sequence, chain, or published checkpoint —
          that would make alteration or loss detectable.
      exposed:
        - >
          Exposed at runtime whenever a principal that can act on the system also holds
          authority over the records of its own actions, whether through a shared
          credential, a shared operator, or a compromised workload. The exposure is
          latent: it produces no symptom until an investigation asks the trail a
          question it can no longer answer.
      mitigated:
        - >
          Mitigated where the repository is independent of the recorded workload —
          append- only commit under a credential distinct from any read or
          administrative credential, an administrative plane outside the recorded
          workload's trust domain, an authenticated write path whose destination cannot
          be silently substituted, trail structure that makes alteration and gaps
          detectable rather than merely discouraged, scheduled verification of that
          structure, and self- recording of retention, access-grant, and deletion
          actions taken against the repository.
    mappings:
      stride:
        - Repudiation
        - Tampering
        - DenialOfService
    lifecycleStage:
      - deployment
      - runtime
      - maintenance
    impactType:
      - accountability
      - compliance
      - integrity
      - availability
    actorAccess:
      - user
      - privileged
      - agent
      - infrastructure-provider
    externalReferences:
      - type: news
        id: mandiant-2022-apt29-purview
        title: "You Can't Audit Me: APT29 Continues Targeting Microsoft 365"
        url: https://cloud.google.com/blog/topics/threat-intelligence/apt29-continues-targeting-microsoft/
      - type: paper
        id: lumia-2025-aikatz
        title: AIKatz - All Your Chats Are Belong To Us
        url: https://www.lumia.security/blog/aikatz
      - type: attack
        id: attack-t1685
        title: 'Disable or Modify Tools, Technique T1685 - Enterprise | MITRE ATT&CK'
        url: https://attack.mitre.org/techniques/T1685/
      - type: spec
        id: nist-sp-800-53r5
        title: NIST SP 800-53 Rev. 5 - Security and Privacy Controls for Information Systems and Organizations
        url: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
