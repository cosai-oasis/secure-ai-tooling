        url: https://fortune.com/2025/07/23/ai-coding-tool-replit-wiped-database-called-it-a-catastrophic-failure/
  - id: riskOverScopedToolAuthority
    title: Over-Scoped Tool Authority
    shortDescription:
      - >
        A tool exposed to an agent with broader authority than any single task requires,
        whose constraints are enforced by the model's own judgment rather than deterministically
        at the tool boundary, lets a manipulated or merely over-reaching model exercise
        that full excess authority — collapsing the system's effective security to the
        model's weakest behavior.
    longDescription:
      - >
        Tools and capabilities exposed to an agent are designed with authority broader
        than any individual task requires, and the decision to constrain that authority
        — input validation, parameter bounds, object-level authorization, and policy enforcement
        — is delegated to the model's reasoning rather than enforced deterministically
        at the tool boundary. The model is made the security enforcement point. Because
        the model is non-deterministic and manipulable, the effective security of the
        system collapses to the weakest model behavior, and even robust upstream authentication
        and authorization controls can be undermined by the breadth of what the tool is
        permitted to do once invoked.
      - >
        This is a classical least-privilege and secure-by-design failure in agentic dress
        ({{ref:mcp-security-secure-tool-design}}). The same pattern recurs as over-privileged
        service accounts holding ambient authority, clients trusted to enforce access
        control that belongs on the server, and broken object-level authorization (BOLA)
        where the caller is trusted to scope its own request. Reference access-control
        architecture separates the policy enforcement point (PEP), decision point (PDP),
        and information point (PIP) ({{ref:nist-sp-800-162-abac}}) precisely so that enforcement
        does not depend on the requesting actor's good behavior. Delegating enforcement
        to the LLM collapses these into a single untrusted actor. The AI-specific amplifiers
        are that the agent autonomously discovers, plans, and chains tool invocations,
        so a single over-scoped tool can be composed into actions its designer never anticipated,
        and that the model's susceptibility to manipulated input (see {{riskPromptInjection}})
        turns a held over-grant into an externally triggerable one.
      - >
        The exposure persists wherever a tool holds standing capability beyond least privilege,
        wherever a tool's constraints are expressed as model instructions rather than
        as deterministic checks enforced before the action executes, and wherever the
        granted authority is coarse-grained or long-lived rather than ephemeral and context-scoped
        per action. The trigger is mechanism-independent: the over-grant is realized by
        adversarial manipulation of the model, by ambiguity in benign tasks, or simply
        by the agent operating within its intended-but-too-broad parameters.
      - >
        This risk is distinct from {{riskRogueActions}}, which is the output/action-layer
        manifestation — the unintended or manipulated action actually executed via an
        extension. Over-Scoped Tool Authority is the upstream design condition that sets
        the blast radius of any such action; it is present and exploitable even when no
        rogue action has yet occurred, and it is mitigated by design-time controls (scope
        narrowing, relocation of enforcement out of the model) rather than action-time
        controls. It is also broader than {{riskAgenticDelegationConfusedDeputy}}, which
        requires asymmetric privilege across a caller/deputy delegation boundary; the
        over-grant here is a property of a single tool's design and needs no second principal.
      - >
        Potential impacts include unauthorized data access and exfiltration, destructive
        or financial actions executed at the tool's full authority, and privilege escalation
        as over-scoped tools are chained. Because enforcement was delegated to a non-deterministic
        model, these consequences are hard to bound in advance and degrade accountability
        for which constraint was supposed to stop the action.
    category: risksRuntimeInputSecurity
    personas:
      - personaAgenticProvider
      - personaApplicationDeveloper
      - personaPlatformProvider
      - personaEndUser
    controls:
      - controlSecureByDefaultMLTooling
      - controlAgentPluginPermissions
      - controlInputValidationAndSanitization
      - controlAgentObservability
    examples:
      - >
        A file-management tool is exposed to an agent with unrestricted read/write/delete
        across a shared filesystem, with a model instruction to 'only touch files in the
        user's workspace.' Because the constraint lives in the prompt rather than as a
        path allowlist enforced by the tool, an ambiguous or injected request causes the
        agent to operate outside the workspace using authority the tool always held —
        no auth bypass was required.
      - >
        A database tool is registered for an agent using broad service-role credentials
        that bypass row-level security, on the assumption the model will scope its queries
        appropriately. The held authority, not any single query, is the risk: any query
        the model is induced to issue executes at full privilege, so the deterministic
        security boundary that should have existed at the tool was delegated to the model
        and lost. This is a documented real-world pattern, not a hypothetical: researchers
        configured a Supabase-backed MCP integration where the agent held service_role
        credentials that bypass row-level security by design, then planted a prompt-injection
        payload in a customer support ticket instructing the agent to read a table of
        integration tokens and post its contents back into the ticket thread — which the
        agent did, leaking secrets in plaintext because the tool's held authority, not
        the legitimacy of any one request, was the actual boundary ({{ref:generalanalysis-2026-supabase-mcp}}).
    tourContent:
      introduced:
        - >
          Introduced during development and deployment when a tool or capability is exposed
          to an agent with authority broader than its task requires, and its constraints
          are written as model instructions instead of deterministic checks enforced at
          the tool boundary.
      exposed:
        - >
          Exposed at runtime whenever the agent invokes the over-scoped tool — whether
          driven by manipulated input, task ambiguity, or autonomous tool-chaining — because
          the only thing standing between the request and the tool's full authority is
          the model's non-deterministic judgment.
      mitigated:
        - >
          Mitigated by narrowing each tool's granted authority to least privilege with
          ephemeral, context-scoped permissions re-evaluated per action, and by relocating
          security-critical validation and authorization out of the model into deterministic
          enforcement at the tool boundary.
    mappings:
      stride:
        - ElevationOfPrivilege
      owasp-top10-llm:
        - LLM06:2025
    lifecycleStage:
      - development
      - deployment
      - runtime
    impactType:
      - integrity
      - confidentiality
      - accountability
    actorAccess:
      - external
      - api
      - agent
    externalReferences:
